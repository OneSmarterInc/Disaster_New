<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Bench Is Clear — Harlow Instruments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design language shared with sims 01 and 02. Same tokens, same type pairing,
   same 2px corners. Three sims that link to each other should not look like
   three different products. */
:root{
  --night:#0E1524; --panel:#161E2E; --panel2:#1D2637; --raise:#232D40;
  --line:#2B3548; --line2:#3A4659;
  --bone:#E8E4DA; --dim:#8C95A8; --dimmer:#616B7E;
  --amber:#F0A63C; --amber-dim:#8A6427;
  --alert:#CE7C8D; --calm:#7FB08A;
  --serif:'Newsreader',Georgia,'Iowan Old Style',serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--night); color:var(--bone); font-family:var(--serif);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 70% -10%, rgba(240,166,60,.055), transparent 60%);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.wrap{max-width:840px;margin:0 auto;padding:38px 22px 90px}

h1{font-family:var(--serif);font-weight:500;font-size:31px;line-height:1.2;margin:0 0 10px;letter-spacing:-.01em}
h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
   color:var(--dimmer);font-weight:500;margin:0 0 11px}
p{margin:0 0 14px}

/* Eyebrow — mono, uppercase, wide tracking. Used for the standfirst and the
   day counter, exactly as 01 and 02 use it for status lines. */
.sub,.day{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dimmer)}
.sub{margin:0 0 28px}
.day{margin:0 0 18px;overflow:hidden}

.panel{border:1px solid var(--line);background:var(--panel);padding:20px 22px;margin:0 0 16px}
.panel.brief p{margin:0 0 13px}
.panel.brief p:last-child{margin-bottom:0}

/* The scoreboard. The most prominent thing on screen, because it is what the
   participant is measured on and it should feel that way. Numbers in mono. */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin:0 0 16px}
.cell{background:var(--panel);padding:13px 15px}
.cell .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dimmer);margin-bottom:7px}
.cell .v{font-family:var(--mono);font-size:25px;font-weight:500;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--bone)}
.cell .v.up{color:var(--amber)}

/* What landed on the bench this morning. Sets the day apart — without it the
   screen is identical eight times and reads as a slider rather than a job. */
.docket{border-left:2px solid var(--line2);padding:2px 0 2px 15px;margin:0 0 18px;
  color:var(--bone);font-size:17px;line-height:1.5}

.choices{display:grid;gap:9px}
button.choice{display:block;width:100%;text-align:left;border:1px solid var(--line2);
  background:var(--panel2);padding:14px 16px;transition:.13s}
button.choice:hover:not(:disabled){border-color:var(--bone);background:var(--raise)}
button.choice:disabled{opacity:.35;cursor:not-allowed}
button.choice .lab{display:block;font-family:var(--serif);font-size:17px;font-weight:500;margin-bottom:4px}
button.choice .bl{display:block;color:var(--dim);font-size:14.5px}
button.choice .cost{float:right;margin-left:14px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--amber);
  border:1px solid var(--amber-dim);padding:4px 8px}

.primary{border:1px solid var(--amber);background:var(--amber);color:#1A1206;
  font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  font-weight:600;padding:12px 20px;transition:.13s}
.primary:hover{background:#FFB94E;border-color:#FFB94E}

/* What comes back when they pay to look downstream. */
.reading{border:1px solid var(--line);border-left:2px solid var(--amber);
  background:var(--panel2);padding:14px 17px;margin:0 0 16px}
.reading .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--amber);margin-bottom:7px}

.clock{float:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.clock.low{color:var(--alert)}

/* Day by day. Numbers mono, names serif — the table that has to carry the
   whole debrief. */
table.tl{width:100%;border-collapse:collapse;font-size:14.5px;margin:2px 0 4px}
table.tl th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dimmer);font-weight:500;
  padding:0 12px 9px 0;border-bottom:1px solid var(--line2)}
table.tl td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);color:var(--bone)}
table.tl td:first-child,table.tl td:nth-child(3),table.tl td:nth-child(4){
  font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
table.tl td.saw{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--amber)}
table.tl tr:last-child td{border-bottom:none}

.tail{border:1px solid var(--amber-dim);background:rgba(240,166,60,.05);padding:17px 20px;margin:0 0 16px}
.tail .name{font-family:var(--serif);font-size:19px;font-weight:500;color:var(--amber);margin-bottom:4px}

.qs{counter-reset:q;padding:0;list-style:none;margin:0}
.qs li{counter-increment:q;position:relative;padding-left:32px;margin:0 0 13px}
.qs li:last-child{margin-bottom:0}
.qs li::before{content:counter(q);position:absolute;left:0;top:3px;width:20px;height:20px;
  border:1px solid var(--line2);color:var(--dimmer);font-family:var(--mono);font-size:10px;
  line-height:18px;text-align:center}

.gate{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.gate input{flex:1;min-width:180px;background:var(--night);color:var(--bone);
  border:1px solid var(--line2);padding:11px 13px;font-family:var(--mono);font-size:13px;
  letter-spacing:.04em}
.gate input::placeholder{color:var(--dimmer)}
.gate input:focus{border-color:var(--amber);outline:none}

.err{border:1px solid var(--alert);background:rgba(206,124,141,.08);color:var(--alert);
  padding:12px 16px;margin:0 0 16px;font-size:14.5px}
.hidden{display:none}

@media (max-width:620px){
  .board{grid-template-columns:repeat(3,1fr)}
  .wrap{padding:24px 15px 64px}
  h1{font-size:25px}
  button.choice .cost{float:none;display:inline-block;margin:0 0 7px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Client. Knows nothing.
//
// Every string a participant reads comes from the server on the turn it is
// needed. There is no action table here, no cost table, no notion that a
// second step exists. If you find yourself wanting to branch on which option
// was chosen, that logic belongs on the server — putting it here ships the
// answer key.
//
// The clock is the one piece of real logic in this file, and it is advisory:
// the server does not enforce it. A participant who lets it run out gets the
// decision made for them by the client, which is the same as a real deadline.

(function () {
  'use strict';

  const app = document.getElementById('app');
  const SECONDS_PER_DAY = 90;

  const state = {
    runId: null,
    view: null,
    reading: null,
    brief: null,
    timer: null,
    left: SECONDS_PER_DAY,
    busy: false
  };

  // Resume across a lost tab or a break between class sessions.
  const KEY = 'rapidsim03.run';
  const remember = (id) => { try { sessionStorage.setItem(KEY, id); } catch (e) {} };
  const recall = () => { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } };
  const forget = () => { try { sessionStorage.removeItem(KEY); } catch (e) {} };

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  // Read from the hash as well as the query, the way 01 does — a code pasted
  // after a # never reaches the server as a query parameter, and people paste
  // whatever they were given.
  function fromUrl(name) {
    const m = (location.hash + location.search).match(new RegExp(name + '=([^&]+)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  // The sim is served two ways: directly at its own deployment, where the API
  // sits at /api/run, and proxied by the platform under /sim03, where the same
  // endpoint is at /sim03/api/run. An absolute path works in the first case and
  // 404s in the second, which is exactly what it did. 01 and 02 both do this.
  const BASE = (location.pathname.match(/^\/sim\d+/) || [''])[0];

  const CODE_KEY = 'rapidsim03.code';
  let ACCESS_CODE = fromUrl('code');
  if (ACCESS_CODE) { try { sessionStorage.setItem(CODE_KEY, ACCESS_CODE); } catch (e) {} }
  else { try { ACCESS_CODE = sessionStorage.getItem(CODE_KEY); } catch (e) {} }

  async function post(action, extra) {
    const headers = { 'content-type': 'application/json' };
    // Passed through by the platform when the sim is launched from a course.
    // A launch token stands in for the access code entirely.
    const lt = fromUrl('lt') || fromUrl('launch');
    if (lt) headers['x-launch-token'] = lt;
    if (ACCESS_CODE) headers['x-access-code'] = ACCESS_CODE;

    const r = await fetch(BASE + '/api/run', {
      method: 'POST',
      headers,
      body: JSON.stringify(Object.assign({ action: action, runId: state.runId }, extra || {}))
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const e = new Error(data.message || data.error || ('HTTP ' + r.status));
      e.code = data.error;
      throw e;
    }
    return data;
  }

  // -------------------------------------------------------------------------
  // The access gate
  //
  // Standalone deployments set ACCESS_CODE and everyone is given the same
  // string. Without this screen a 401 arrives as a bare error message and the
  // participant has nowhere to type — which is what 03 did until now, while
  // 01 and 02 both prompt.
  // -------------------------------------------------------------------------

  function renderGate(message) {
    app.innerHTML =
      '<h1>You\'ll need an access code</h1>' +
      '<p class="sub">Harlow Instruments — diagnosis bench</p>' +
      '<div class="panel">' +
      '<p>' + esc(message || 'Enter the code you were given.') + '</p>' +
      '<div class="gate">' +
      '<input id="codein" type="text" autocomplete="off" spellcheck="false" placeholder="access code">' +
      '<button class="primary" id="codego">Continue</button>' +
      '</div></div>';

    const input = document.getElementById('codein');
    const go = () => {
      const v = input.value.trim();
      if (!v) return;
      ACCESS_CODE = v;
      try { sessionStorage.setItem(CODE_KEY, v); } catch (e) {}
      boot();
    };
    document.getElementById('codego').onclick = go;
    input.onkeydown = (ev) => { if (ev.key === 'Enter') go(); };
    input.focus();
  }

  // A launch that fails is almost always a mismatched LAUNCH_SECRET between
  // the platform and this deployment, and it is not something the participant
  // can fix by typing. Say so rather than showing them a code box.
  function renderBadLaunch() {
    app.innerHTML =
      '<h1>This sim did not accept your link</h1>' +
      '<p class="sub">Harlow Instruments — diagnosis bench</p>' +
      '<div class="panel"><p>The link may have expired — go back to your course and start it again. ' +
      'If it keeps happening, this simulation and the platform are not sharing the same launch secret, ' +
      'which is something an administrator has to put right.</p></div>';
  }

  function fail(msg) {
    const d = document.createElement('div');
    d.className = 'err';
    d.textContent = msg;
    app.prepend(d);
  }

  // -------------------------------------------------------------------------
  // Screens
  // -------------------------------------------------------------------------

  function renderBrief() {
    const b = state.brief.brief;
    app.innerHTML =
      '<h1>' + esc(b.heading) + '</h1>' +
      '<p class="sub">' + esc(b.clock) + ' · you run the ' + esc(state.brief.station).toLowerCase() + '</p>' +
      '<div class="panel brief">' +
      b.lines.map(l => '<p>' + esc(l) + '</p>').join('') +
      '</div>' +
      '<button class="primary" id="go">Start day 1</button>';
    document.getElementById('go').onclick = start;
  }

  function renderDay() {
    const v = state.view;
    const day = v.round + 1;

    let readingHtml = '';
    if (state.reading) {
      readingHtml =
        '<div class="reading"><div class="who">' + esc(state.reading.stationName) + '</div>' +
        esc(state.reading.text) + '</div>';
    }

    const note = v.note ? '<div class="docket">' + esc(v.note) + '</div>' : '';

    app.innerHTML =
      '<div class="day">Day ' + day + ' of ' + v.roundsTotal +
      '<span class="clock" id="clk">1:30</span></div>' +
      note +
      '<div class="board">' +
      cell('Units cleared', v.cleared, true) +
      cell('In the queue', v.backlog) +
      cell('Cycle time', v.localCycleTime + 'h') +
      '</div>' +
      readingHtml +
      '<div class="panel"><h3>What do you do today?</h3><div class="choices" id="ch">' +
      v.availableActions.map(a =>
        '<button class="choice" data-id="' + esc(a.id) + '">' +
        '<span class="lab">' + esc(a.label) + '</span>' +
        '<span class="bl">' + esc(a.blurb || '') + '</span>' +
        '</button>').join('') +
      '</div></div>';

    Array.prototype.forEach.call(document.querySelectorAll('.choice'), (btn) => {
      btn.onclick = () => choose(btn.getAttribute('data-id'));
    });

    startClock(v.availableActions);
  }

  function cell(k, v, accent) {
    return '<div class="cell"><div class="k">' + esc(k) + '</div>' +
      '<div class="v' + (accent ? ' up' : '') + '">' + esc(v) + '</div></div>';
  }

  function renderDebrief(d) {
    const tail = d.outcome
      ? '<div class="tail"><div class="name">' + esc(d.outcome.person) + '</div>' +
        esc(d.outcome.what) + ' Day ' + esc(d.outcome.atRound) + '.</div>'
      : '';

    app.innerHTML =
      '<h1>' + esc(d.title) + '</h1>' +
      '<p class="sub">Bench score ' + esc(d.localScore) + ' · ' + esc(d.cleared) + ' units cleared · ' +
      'you called the field desk ' + esc(d.counts.timesLooked) +
      (d.counts.timesLooked === 1 ? ' time' : ' times') + '</p>' +
      tail +
      '<div class="panel"><p>' + esc(d.body) + '</p></div>' +
      '<div class="panel"><h3>Day by day</h3>' +
      '<table class="tl"><thead><tr><th>Day</th><th>What you did</th><th>Cleared</th><th>Score</th><th></th></tr></thead><tbody>' +
      d.timeline.map(t =>
        '<tr><td>' + esc(t.day) + '</td><td>' + esc(t.did) + '</td><td>' + esc(t.cleared) +
        '</td><td>' + esc(t.score) + '</td><td class="saw">' + (t.sawIt ? 'you looked' : '') + '</td></tr>'
      ).join('') +
      '</tbody></table></div>' +
      '<div class="panel"><h3>For the debrief</h3><ul class="qs">' +
      d.questions.map(q => '<li>' + esc(q) + '</li>').join('') +
      '</ul></div>';

    forget();
  }

  // -------------------------------------------------------------------------
  // The clock
  //
  // Advisory, and it does not stop the run. When it expires the most recently
  // hovered option is not chosen for them — the first one is, which is the
  // fast one, because a decision not made under time pressure defaults to the
  // path of least resistance. That is not a trick; it is the point.
  // -------------------------------------------------------------------------

  function startClock(actions) {
    stopClock();
    state.left = SECONDS_PER_DAY;
    const el = document.getElementById('clk');
    const tick = () => {
      state.left -= 1;
      if (el) {
        const m = Math.floor(Math.max(state.left, 0) / 60);
        const s = Math.max(state.left, 0) % 60;
        el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
        if (state.left <= 15) el.className = 'clock low';
      }
      if (state.left <= 0) {
        stopClock();
        if (!state.busy && actions.length) choose(actions[0].id);
      }
    };
    state.timer = setInterval(tick, 1000);
  }

  function stopClock() {
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
  }

  // -------------------------------------------------------------------------
  // Flow
  // -------------------------------------------------------------------------

  async function start() {
    try {
      const d = await post('start');
      state.runId = d.runId;
      state.view = d.view;
      state.reading = null;
      remember(d.runId);
      renderDay();
    } catch (e) { fail(e.message); }
  }

  async function choose(id) {
    if (state.busy) return;
    state.busy = true;
    stopClock();
    Array.prototype.forEach.call(document.querySelectorAll('.choice'), b => b.disabled = true);
    try {
      const d = await post('act', { choice: id });
      state.view = d.view;
      state.reading = d.reading || null;
      state.busy = false;
      if (d.finished) return finish();
      renderDay();
    } catch (e) {
      state.busy = false;
      fail(e.message);
    }
  }

  async function finish() {
    try {
      const d = await post('debrief');
      renderDebrief(d.debrief);
    } catch (e) { fail(e.message); }
  }

  async function boot() {
    try {
      state.brief = await post('brief');
    } catch (e) {
      if (e.code === 'launch_token_invalid') return renderBadLaunch();
      if (e.code === 'access_code_required') {
        return renderGate(ACCESS_CODE
          ? 'That code was not accepted. Check it and try again.'
          : 'Enter the code you were given.');
      }
      return fail('Could not reach the server. ' + e.message);
    }

    const prior = recall();
    if (prior) {
      state.runId = prior;
      try {
        const d = await post('resume');
        state.view = d.view;
        if (d.finished) return finish();
        return renderDay();
      } catch (e) {
        // Expired or unknown. Start clean rather than showing an error for
        // something the participant did not do.
        forget();
        state.runId = null;
      }
    }
    renderBrief();
  }

  boot();
})();

</script>
</body>
</html>
