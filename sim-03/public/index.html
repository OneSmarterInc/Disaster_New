<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Why Don't They Have Any Patience?</title>
<style>:root{--ink:#17202a;--muted:#667085;--line:#d9dee7;--paper:#fff;--wash:#f4f6f8;--blue:#185adb;--navy:#102a43;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.top{background:var(--navy);color:#fff;padding:18px 24px}.top small{opacity:.75;text-transform:uppercase;letter-spacing:.08em}.top h1{margin:3px 0;font-size:clamp(20px,3vw,30px)}main{max-width:980px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px;box-shadow:0 2px 8px #102a430d}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);font-weight:700}.muted{color:var(--muted)}button,input,textarea,select{font:inherit}button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:650}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf0ff;color:#1748a8}.choice{width:100%;text-align:left;background:#fff;border:1px solid var(--line);margin:7px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.source{padding:14px;border:1px solid var(--line);border-radius:9px}.bar{height:8px;border-radius:10px;background:#e5e7eb;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.chat{max-height:430px;overflow:auto}.bubble{max-width:82%;padding:11px 14px;border-radius:12px;margin:10px 0}.q{margin-left:auto;background:#eaf0ff}.a{background:#f1f3f5}.ask{display:flex;gap:9px;margin-top:14px}.ask input{flex:1}.row{display:grid;grid-template-columns:1.3fr .8fr 1.6fr;gap:10px;align-items:start;padding:15px 0;border-top:1px solid var(--line)}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px}textarea{min-height:74px}.error{color:var(--red);background:#fff0ee;padding:10px;border-radius:7px}.pill{display:inline-block;background:#eaf0ff;color:#1748a8;border-radius:999px;padding:4px 9px;font-size:13px}@media(max-width:680px){.grid,.row{
