<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--BASE-->
<script>
// Static Vercel responses also need the canonical mount before loading assets.
if (!document.querySelector('base')) {
  const base = document.createElement('base');
  base.href = /^\/sim10(?:\/|$)/.test(location.pathname) ? '/sim10/' : '/';
  document.head.appendChild(base);
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infrastructure or Bubble?</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="wrap narrow">
  <h1>Infrastructure or Bubble?</h1>
  <section id="solo" hidden>
    <h2>Play on your own</h2>
    <p>Read the figures, make your call, then explore what happened. Your reading and decision timers start when you begin.</p>
    <form id="solo-form">
      <div class="field"><label for="solo-cases">How many companies?</label>
        <select id="solo-cases" required><option value="">Choose one or two</option><option value="A">One company</option><option value="A,B">Two companies, one after the other</option></select>
      </div>
      <div class="field" id="solo-access-field" hidden><label for="solo-access">Access code</label><input id="solo-access" type="text" autocomplete="off"></div>
      <p class="error" id="solo-error" role="alert"></p>
      <button class="btn" id="solo-start" type="submit">Start a new run</button>
      <button class="btn" id="solo-resume" type="button" hidden>Resume your run</button>
    </form>
    <p><a href="host" id="host-link" hidden>Run a class session</a></p>
    <hr>
  </section>
  <h2>Join a class session</h2>
  <p class="muted">Enter the code your host shows on screen.</p>
  <form id="join" autocomplete="off">
    <div class="field">
      <label for="code">Session code</label>
      <input id="code" class="code-input" type="text" maxlength="5" inputmode="text" required>
    </div>
    <div class="field" id="access-field" hidden>
      <label for="access">Class access code</label>
      <input id="access" type="text" autocomplete="off">
    </div>
    <div class="field" id="team-field" hidden>
      <label for="team">Your team</label>
      <select id="team"></select>
    </div>
    <p class="error" id="err" role="alert"></p>
    <button class="btn" id="go" type="submit">Join</button>
  </form>
</main>
<script src="common.js"></script>
<script>
const form = $('#join'), codeEl = $('#code'), teamField = $('#team-field'), teamEl = $('#team'), err = $('#err');
const who = launchInfo();
if (who && (who.role === 'faculty' || who.role === 'faculty_preview') && who.mode === 'session') location.replace('host');
const preset = new URLSearchParams(location.search).get('session');
if (preset) codeEl.value = preset.toUpperCase();
if (!preset && who?.mode !== 'session') $('#solo').hidden = false;
$('#host-link').hidden = !who || !['faculty', 'faculty_preview'].includes(who.role);
const soloResume = $('#solo-resume');
let savedSolo = null;
try { savedSolo = JSON.parse(sessionStorage.getItem(soloKey()) || 'null'); } catch {}
soloResume.hidden = !savedSolo?.code || !savedSolo?.pid;
function openRun(run) {
  sessionStorage.setItem(participantKey(run.code), run.pid);
  rememberLaunch(run.code);
  location.href = `play?code=${encodeURIComponent(run.code)}`;
}
soloResume.addEventListener('click', () => openRun(savedSolo));
$('#solo-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#solo-start'), error = $('#solo-error');
  if (btn.disabled) return;
  error.textContent = '';
  if (!$('#solo-cases').value) { error.textContent = 'Choose one company or two.'; return; }
  btn.disabled = true;
  if ($('#solo-access').value.trim()) sessionStorage.setItem('s10-access', $('#solo-access').value.trim());
  try {
    const run = await api('POST', 'api/solo', { cases: $('#solo-cases').value.split(',') });
    sessionStorage.setItem(soloKey(), JSON.stringify(run));
    openRun(run);
  } catch (err) {
    if (err.code === 'unauthorized' && !launchToken()) $('#solo-access-field').hidden = false;
    error.textContent = err.message;
  } finally { btn.disabled = false; }
});
let info = null;
codeEl.addEventListener('input', () => { info = null; teamField.hidden = true; err.textContent = ''; });
async function go() {
  if ($('#go').disabled) return;
  $('#go').disabled = true;
  err.textContent = '';
  const code = codeEl.value.trim().toUpperCase();
  if ($('#access').value.trim()) sessionStorage.setItem('s10-access', $('#access').value.trim());
  try {
    if (!info) {
      info = await api('GET', `api/session?code=${encodeURIComponent(code)}`);
      if (info.platform && !launchToken()) { location.href = info.joinUrl; return; }
      if (info.mode === 'team' && (launchToken() || !sessionStorage.getItem(participantKey(code)))) {
        teamEl.innerHTML = '<option value="">Choose your team</option>' + Array.from({ length: info.teams }, (_, i) => `<option value="${i + 1}">Team ${i + 1}</option>`).join('');
        teamField.hidden = false; teamEl.focus();
        return;
      }
    }
    if (info.mode === 'team' && !teamField.hidden && !teamEl.value) { err.textContent = 'Choose your team to join.'; return; }
    if (launchToken() || !sessionStorage.getItem(participantKey(code))) {
      const j = await api('POST', 'api/join', { code, team: info.mode === 'team' ? Number(teamEl.value) : undefined });
      sessionStorage.setItem(participantKey(code), j.pid);
    }
    rememberLaunch(code);
    location.href = `play?code=${encodeURIComponent(code)}`;
  } catch (e2) {
    if (e2.code === 'unauthorized' && !launchToken()) { $('#access-field').hidden = false; sessionStorage.removeItem('s10-access'); }
    err.textContent = e2.message;
  } finally { $('#go').disabled = false; }
}
form.addEventListener('submit', (e) => { e.preventDefault(); go(); });
if (preset && launchToken()) go();
</script>
</body>
</html>
