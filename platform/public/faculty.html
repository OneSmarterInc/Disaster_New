<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your courses — Flexee Rapid Sims</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="bar">
  <div class="brand">Flexee Rapid <span>Sims</span></div>
  <div class="who" id="who"></div>
  <a class="btn sm" id="adminlink" href="/admin.html" style="display:none">Admin console</a>
  <a class="btn sm" href="/account.html">Account</a>
  <button class="btn sm" id="out">Sign out</button>
</div>
<div class="wrap" id="app"></div>
<script>
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F = { view: 'home', data: null, course: null, simsOverview: null, progress: null, err: null, sel: new Set(), me: null };

async function api(path, payload) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.message || d.error || 'HTTP ' + r.status); e.body = d; throw e; }
  return d;
}

// Every action button says what happened, where it was pressed.
function flash(btn, msg, kind) {
  if (!btn) return;
  const original = btn.textContent;
  btn.textContent = msg;
  btn.style.borderColor = kind === 'bad' ? 'var(--rose)' : 'var(--green)';
  btn.style.color = kind === 'bad' ? 'var(--rose)' : 'var(--green)';
  setTimeout(() => { btn.textContent = original; btn.style.borderColor = ''; btn.style.color = ''; }, 1800);
}
function acting(btn, working) {
  if (!btn) return () => {};
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = working || 'Working…';
  return (msg, kind) => {
    btn.disabled = false;
    if (msg) { btn.textContent = original; flash(btn, msg, kind); } else btn.textContent = original;
  };
}
const simLabel = (x) => (x.number ? 'Rapid Sim ' + String(x.number).padStart(2,'0') + ' — ' : '') + x.title;
const when = t => t ? new Date(t).toLocaleDateString(undefined, { day:'numeric', month:'short' }) : '—';
const daysLeft = t => Math.max(0, Math.ceil((new Date(t) - Date.now()) / 86400000));

document.getElementById('out').onclick = async () => { await api('/api/auth', { action:'signout' }); location.href = '/'; };

async function loadHome() {
  try { F.data = await api('/api/faculty', { action:'overview' }); F.err = null; }
  catch (e) { F.err = e.message; }
  F.view = 'home'; F.course = null; render();
}
async function openProgress(courseId, simId) {
  try { F.progress = await api('/api/faculty', { action:'sim_progress', courseId, simId }); F.view = 'progress'; F.err = null; }
  catch (e) { F.err = e.message; }
  render();
}
async function openCourse(id) {
  try { F.course = await api('/api/faculty', { action:'course_detail', courseId: id }); F.view = 'course'; F.sel.clear(); F.err = null; }
  catch (e) { F.err = e.message; }
  render();
}

function render() {
  if (F.err && !F.data) { app.innerHTML = `<h1>Something's wrong</h1><div class="err">${esc(F.err)}</div>`; return; }
  if (!F.data) { app.innerHTML = '<h1>Loading…</h1>'; return; }
  if (F.view === 'progress' && F.progress) return renderProgress();
  if (F.view === 'course' && F.course) return renderCourse();
  renderHome();
}

// ---------- home ----------
function renderHome() {
  const { courses, catalogue, previews } = F.data;
  const prevOf = id => previews.find(p => p.sim_id === id);

  app.innerHTML = `
    <div class="eyebrow">Your teaching</div>
    <h1>Courses and <em>simulations</em></h1>
    ${F.me && F.me.role === 'admin' ? `<div class="note">
      You're signed in as an administrator, so this page shows only courses <b>you</b> run — probably none.
      To see every facilitator's courses and students, use the <a href="/admin.html">admin console</a>.
    </div>` : ''}

    <h2>Your simulations</h2>
    ${F.simsOverview === null
      ? '<div class="card dim tight">Loading…</div>'
      : (F.simsOverview.length ? `<div class="card" style="padding:0"><table>
          <thead><tr><th>Simulation</th><th class="mono">Courses</th><th class="mono">Released</th><th class="mono">Started</th><th class="mono">Finished</th></tr></thead>
          <tbody>${F.simsOverview.map(x => `<tr>
            <td data-l="Simulation"><b>${esc(simLabel(x))}</b><div class="tiny dim">${esc(x.tagline || '')}</div></td>
            <td data-l="Courses" class="mono">${x.courses}</td>
            <td data-l="Released" class="mono">${x.released} of ${x.enrolled}</td>
            <td data-l="Started" class="mono">${x.started}</td>
            <td data-l="Finished" class="mono">${Number(x.finished) === Number(x.started) && Number(x.started) > 0
                ? `<span class="pill ok">${x.finished}</span>` : `<span class="pill">${x.finished}</span>`}</td>
          </tr>`).join('')}</tbody></table></div>`
        : '<div class="card dim tight">None in use yet — add one to a course below.</div>')}

    <h2>Your courses</h2>
    ${courses.map(c => `<div class="card">
      <h3>${esc(c.title)}</h3>
      <div class="tiny dim">${esc(c.term || 'No term set')} · join code <span class="mono">${esc(c.join_code)}</span></div>
      <div class="row" style="margin-top:12px">
        <span class="pill">${c.enrolled} enrolled</span>
        <span class="pill ${Number(c.paid) === Number(c.enrolled) && Number(c.enrolled) > 0 ? 'ok' : 'warn'}">${c.paid} with access</span>
        <span class="pill">${c.sims} simulation${Number(c.sims) === 1 ? '' : 's'}</span>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn pri sm" data-course="${esc(c.id)}">Open this course</button>
      </div>
    </div>`).join('') || '<div class="card dim">No courses yet. Create one below.</div>'}

    <div class="card tight">
      <div class="row">
        <div class="grow"><label class="f">Course title</label><input id="c_t" type="text" placeholder="Operations Management"></div>
        <div style="width:180px"><label class="f">Term</label><input id="c_m" type="text" placeholder="Fall 2026"></div>
        <button class="btn pri" id="c_go" style="align-self:flex-end">Create course</button>
      </div>
    </div>

    <h2>Available simulations</h2>
    ${catalogue.map(si => {
      const p = prevOf(si.id);
      const live = p && daysLeft(p.expires_at) > 0;
      return `<div class="card">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div style="flex:1;min-width:240px">
            <h3>${esc(simLabel(si))}</h3>
            <div class="tiny dim">${esc(si.tagline || '')}${si.minutes ? ' · about ' + si.minutes + ' minutes' : ''}</div>
            ${si.description ? `<p class="tiny" style="margin-top:9px;max-width:60ch">${esc(si.description)}</p>` : ''}
          </div>
          <div class="row">
            ${live ? `<span class="pill warn">preview · ${daysLeft(p.expires_at)}d left</span>
                      <a class="btn" href="/api/launch?sim=${encodeURIComponent(si.id)}">Open it</a>`
                   : p ? `<span class="pill bad">preview ended</span>`
                   : `<button class="btn" data-prev="${esc(si.id)}">Preview for 7 days</button>`}
          </div>
        </div>
      </div>`;
    }).join('') || `<div class="card dim">
      <p style="margin:0">Nothing available to you at the moment.</p>
      <p class="tiny" style="margin:8px 0 0">Simulations appear here once they are published. If one is still in preparation, an administrator can give you early access to review it.</p>
    </div>`}
    ${F.err ? `<div class="err">${esc(F.err)}</div>` : ''}`;

  if (F.simsOverview === null) {
    api('/api/faculty', { action:'sims_overview' })
      .then(d => { F.simsOverview = d.sims || []; render(); })
      .catch(() => { F.simsOverview = []; render(); });
  }
  document.getElementById('c_go').onclick = async () => {
    const btn = document.getElementById('c_go');
    const t = document.getElementById('c_t').value.trim();
    if (!t) { flash(btn, 'Needs a title', 'bad'); return; }
    const done = acting(btn, 'Creating…');
    try { await api('/api/faculty', { action:'create_course', title: t, term: document.getElementById('c_m').value });
      done(); loadHome(); } catch (e) { done('Failed', 'bad'); }
  };
  app.querySelectorAll('[data-course]').forEach(b => b.onclick = () => openCourse(b.dataset.course));
  app.querySelectorAll('[data-prev]').forEach(b => b.onclick = async () => {
    const done = acting(b, 'Starting…');
    try { await api('/api/faculty', { action:'start_preview', simId: b.dataset.prev }); done(); loadHome(); }
    catch (e) { done('Failed', 'bad'); }
  });
}

// ---------- one course ----------
function renderCourse() {
  const { course, sims, roster, catalogue, enrolUrl } = F.course;
  const active = roster.filter(r => !r.dropped);
  const unpaid = active.filter(r => !r.paid);
  const notAdded = catalogue.filter(si => !sims.find(x => x.sim_id === si.id));

  app.innerHTML = `
    <button class="btn sm" id="back">← All courses</button>
    <div class="eyebrow" style="margin-top:20px">${esc(course.term || '')}</div>
    <h1>${esc(course.title)}</h1>
    <div class="row" style="margin-bottom:18px">
      <button class="btn sm" id="c_edit">Rename this course</button>
      <button class="btn sm" id="c_arch">Archive it</button>
      <button class="btn sm danger" id="c_del">Delete it</button>
      <span class="tiny dim">Archiving hides it from your list and stops new students joining. Nothing is deleted.</span>
    </div>
    <div id="c_editbox"></div>

    <div class="note">
      <b>Students join with this link.</b> Send it however you normally reach them — it's the only thing they need.
      <div class="copybox">
        <input type="text" id="eurl" readonly value="${esc(enrolUrl)}">
        <button class="btn" id="ecopy">Copy</button>
      </div>
      <div class="tiny" style="margin-top:8px">Or they can enter the code <span class="mono">${esc(course.join_code)}</span> themselves.</div>
    </div>

    <h2>Simulations in this course</h2>
    ${sims.map(x => `<div class="card">
      <h3>${esc(simLabel(x))}</h3>
      <div class="tiny dim">${x.expected_seats ? 'expecting ' + x.expected_seats + ' students' : 'no expected number set'}${x.hard_cap ? ' · hard cap' : ''}
        ${x.expected_seats && active.length > x.expected_seats ? ` · <span style="color:var(--rose)">${active.length} enrolled</span>` : ''}</div>
      <div class="row" style="margin-top:10px">
        <span class="pill">${x.started || 0} started it</span>
        <span class="pill ${Number(x.finished) > 0 ? 'ok' : ''}">${x.finished || 0} finished it</span>
      </div>
      <div class="row" style="margin-top:14px">
        <a class="btn pri sm" href="/api/launch?sim=${encodeURIComponent(x.sim_id)}&course=${encodeURIComponent(course.id)}">Open the simulation</a>
        <button class="btn sm" data-prog="${esc(x.sim_id)}">See who has played</button>
        <button class="btn sm" data-seats="${esc(x.sim_id)}" data-cur="${x.expected_seats || ''}">Change expected number</button>
        <button class="btn sm" data-rmsim="${esc(x.sim_id)}">Remove from course</button>
      </div>
    </div>`).join('') || '<div class="card dim tight">None yet — add one below.</div>'}

    ${!notAdded.length && sims.length ? '<div class="tiny dim" style="margin-bottom:16px">Every simulation available to you is already in this course.</div>' : ''}
    ${sims.some(x => !catalogue.find(c => c.id === x.sim_id)) ? `<div class="note" style="margin-bottom:16px">
      One of the simulations below is no longer in the catalogue — it has been withdrawn while it is worked on.
      It stays in your course and your students keep their access; you just cannot add it anywhere new for now.
    </div>` : ''}
    ${notAdded.length ? `<div class="card tight">
      <div class="row">
        <div class="grow"><label class="f">Add a simulation</label>
          <select id="a_sim">${notAdded.map(si => `<option value="${esc(si.id)}">${esc(si.title)}</option>`).join('')}</select>
        </div>
        <div style="width:150px"><label class="f">Students expected</label><input id="a_seats" type="number" min="1" placeholder="e.g. 24"></div>
        <button class="btn pri" id="a_go" style="align-self:flex-end">Add</button>
      </div>
      <div class="tiny dim" style="margin-top:9px">The number is a forecast, not a limit — nobody is turned away if more enrol.</div>
    </div>` : ''}

    <h2>Students</h2>
    <div class="note" style="border-left-color:var(--line2);background:var(--sunk)">
      Anyone with your link can enrol, but they cannot open a simulation until you give them access.
      Do that once their registration is settled — payment happens outside this system, so this switch is yours.
      ${unpaid.length ? `<div style="margin-top:10px"><b>${unpaid.length}</b> ${unpaid.length === 1 ? 'person is' : 'people are'} waiting for access.</div>`
        : (active.length ? '<div style="margin-top:10px">Everyone enrolled has access.</div>' : '')}
    </div>

    <div class="row" style="margin-bottom:12px">
      <button class="btn pri" id="p_all" ${unpaid.length ? '' : 'disabled'}>${unpaid.length
        ? `Give access to all ${unpaid.length} waiting`
        : 'Nobody waiting for access'}</button>
      <button class="btn" id="p_sel" disabled>Give access to selected</button>
      <input type="text" id="p_note" placeholder="note to yourself, e.g. dept PO 4471" style="width:240px">
    </div>

    <div class="card" style="padding:0">
      <table>
        <thead><tr><th style="width:34px"></th><th>Student</th><th>Can open sims?</th><th>Joined</th><th class="mono">Times played</th><th></th></tr></thead>
        <tbody>
        ${roster.map(r => `<tr style="${r.dropped ? 'opacity:.5' : ''}">
          <td data-l="">${r.dropped ? '' : `<input type="checkbox" data-en="${esc(r.enrolment_id)}" style="width:auto">`}</td>
          <td data-l="Student"><b>${esc(r.name)}</b><div class="tiny dim mono">${esc(r.email)}</div></td>
          <td data-l="Can open sims?">${r.dropped ? '<span class="pill">removed from course</span>'
                : r.paid ? `<span class="pill ok">yes</span>${r.paid_note ? `<div class="tiny dim">${esc(r.paid_note)}</div>` : ''}`
                : '<span class="pill warn">not yet</span>'}</td>
          <td data-l="Joined" class="tiny dim">${when(r.created_at)}</td>
          <td data-l="Times played" class="mono tiny">${r.launches || 0}</td>
          <td data-l="" class="row" style="gap:6px">
            ${r.dropped ? '' : (r.paid
              ? `<button class="btn sm" data-revoke="${esc(r.enrolment_id)}">Take access away</button>`
              : `<button class="btn sm" data-give="${esc(r.enrolment_id)}">Give access</button>`)}
            <button class="btn sm" data-drop="${esc(r.enrolment_id)}" data-now="${r.dropped ? '1' : '0'}">${r.dropped ? 'Put back in course' : 'Remove from course'}</button>
          </td>
        </tr>`).join('') || '<tr><td colspan="6" class="dim">Nobody has joined yet.</td></tr>'}
        </tbody>
      </table>
    </div>
    ${F.err ? `<div class="err">${esc(F.err)}</div>` : ''}`;

  document.getElementById('back').onclick = loadHome;
  document.getElementById('ecopy').onclick = () => {
    document.getElementById('eurl').select();
    navigator.clipboard.writeText(enrolUrl);
    flash(document.getElementById('ecopy'), 'Copied');
  };

  const ago = document.getElementById('a_go');
  if (ago) ago.onclick = async () => {
    const done = acting(ago, 'Adding…');
    try { await api('/api/faculty', { action:'add_sim', courseId: course.id,
      simId: document.getElementById('a_sim').value,
      expectedSeats: document.getElementById('a_seats').value }); done(); openCourse(course.id); }
    catch (e) { done('Failed', 'bad'); }
  };
  document.getElementById('c_edit').onclick = () => {
    flash(document.getElementById('c_edit'), 'Editing ↓');
    const box = document.getElementById('c_editbox');
    box.innerHTML = `<div class="card tight">
      <div class="row">
        <div class="grow"><label class="f">Course title</label><input id="e_t" type="text" value="${esc(course.title)}"></div>
        <div style="width:180px"><label class="f">Term</label><input id="e_m" type="text" value="${esc(course.term || '')}"></div>
        <button class="btn pri" id="e_go" style="align-self:flex-end">Save</button>
        <button class="btn" id="e_no" style="align-self:flex-end">Cancel</button>
      </div></div>`;
    document.getElementById('e_no').onclick = () => { box.innerHTML = ''; };
    document.getElementById('e_go').onclick = async () => {
      const eb = document.getElementById('e_go');
      const done = acting(eb, 'Saving…');
      try { await api('/api/faculty', { action:'update_course', courseId: course.id,
        title: document.getElementById('e_t').value, term: document.getElementById('e_m').value });
        done(); openCourse(course.id); } catch (e) { done('Failed', 'bad'); }
    };
  };
  document.getElementById('c_del').onclick = async () => {
    if (!confirm('Delete this course? Everyone enrolled loses it.')) return;
    const doneD = acting(document.getElementById('c_del'), 'Deleting…');
    try {
      await api('/api/faculty', { action:'delete_course', courseId: course.id });
      doneD(); loadHome();
    } catch (e) {
      if (confirm(e.message + '\n\nDelete it anyway?')) {
        await api('/api/faculty', { action:'delete_course', courseId: course.id, force: true });
        doneD(); loadHome();
      } else doneD('Kept', 'bad');
    }
  };
  document.getElementById('c_arch').onclick = async () => {
    if (!confirm('Archive this course? It disappears from your list and nobody new can join. Nothing is deleted.')) return;
    const doneA = acting(document.getElementById('c_arch'), 'Archiving…');
    try { await api('/api/faculty', { action:'update_course', courseId: course.id, archived: true });
      doneA(); loadHome(); } catch (e) { doneA('Failed', 'bad'); }
  };
  app.querySelectorAll('[data-seats]').forEach(b => b.onclick = async () => {
    const cur = b.dataset.cur || '';
    const v = prompt('How many students do you expect for this simulation?\n\nThis is a forecast, not a limit — nobody is turned away if more enrol.', cur);
    if (v === null) return;
    const done = acting(b, 'Saving…');
    try { await api('/api/faculty', { action:'add_sim', courseId: course.id, simId: b.dataset.seats, expectedSeats: v });
      done(); openCourse(course.id); } catch (e) { done('Failed', 'bad'); }
  });
  app.querySelectorAll('[data-prog]').forEach(b => b.onclick = () => openProgress(course.id, b.dataset.prog));
  app.querySelectorAll('[data-rmsim]').forEach(b => b.onclick = async () => {
    if (!confirm('Remove this simulation from the course? Students lose access to it; nothing they have already done is deleted.')) return;
    const done = acting(b, 'Removing…');
    try { await api('/api/faculty', { action:'remove_sim', courseId: course.id, simId: b.dataset.rmsim });
      done(); openCourse(course.id); } catch (e) { done('Failed', 'bad'); }
  });

  const selBtn = document.getElementById('p_sel');
  app.querySelectorAll('[data-en]').forEach(cb => cb.onchange = () => {
    cb.checked ? F.sel.add(cb.dataset.en) : F.sel.delete(cb.dataset.en);
    selBtn.disabled = F.sel.size === 0;
    selBtn.textContent = F.sel.size ? `Release selected (${F.sel.size})` : 'Release selected';
  });

  document.getElementById('p_all').onclick = async () => {
    const btn = document.getElementById('p_all');
    const done = acting(btn, 'Giving access…');
    try { await api('/api/faculty', { action:'set_paid', courseId: course.id, all: true, paid: true,
      note: document.getElementById('p_note').value }); done(); openCourse(course.id); }
    catch (e) { done('Failed', 'bad'); }
  };
  selBtn.onclick = async () => {
    const done = acting(selBtn, 'Giving access…');
    try { await api('/api/faculty', { action:'set_paid', courseId: course.id, paid: true,
      enrolmentIds: [...F.sel], note: document.getElementById('p_note').value });
      done(); openCourse(course.id); } catch (e) { done('Failed', 'bad'); }
  };
  app.querySelectorAll('[data-give]').forEach(b => b.onclick = async () => {
    const done = acting(b, 'Giving…');
    try { await api('/api/faculty', { action:'set_paid', courseId: course.id, paid: true,
      enrolmentIds: [b.dataset.give], note: document.getElementById('p_note').value }); done(); openCourse(course.id); }
    catch (e) { done('Failed', 'bad'); }
  });
  app.querySelectorAll('[data-revoke]').forEach(b => b.onclick = async () => {
    if (!confirm('Take access away? If they have already played, that does not undo it.')) return;
    const done = acting(b, 'Removing…');
    try { await api('/api/faculty', { action:'set_paid', courseId: course.id, paid: false, enrolmentIds: [b.dataset.revoke] });
      done(); openCourse(course.id); } catch (e) { done('Failed', 'bad'); }
  });
  app.querySelectorAll('[data-drop]').forEach(b => b.onclick = async () => {
    const done = acting(b, 'Saving…');
    try { await api('/api/faculty', { action:'set_dropped', courseId: course.id,
      enrolmentId: b.dataset.drop, dropped: b.dataset.now !== '1' });
      done(); openCourse(course.id); } catch (e) { done('Failed', 'bad'); }
  });
}

function renderProgress() {
  const { sim, course, rows } = F.progress;
  const active = rows.filter(r => !r.dropped);
  const done = active.filter(r => r.completed_at);
  const started = active.filter(r => Number(r.starts) > 0 && !r.completed_at);
  const mins = sec => sec ? Math.round(sec / 60) + ' min' : '—';

  app.innerHTML = `
    <button class="btn sm" id="back">← ${esc(course.title)}</button>
    <div class="eyebrow" style="margin-top:20px">${esc(course.title)}</div>
    <h1>${esc(sim ? simLabel(sim) : 'Simulation')}</h1>
    <p class="lede">${done.length} of ${active.length} have finished it${started.length ? `, ${started.length} started and didn't` : ''}.</p>

    <div class="card" style="padding:0">
      <table>
        <thead><tr><th>Student</th><th>Status</th><th class="mono">Took</th><th>What came back</th></tr></thead>
        <tbody>
        ${rows.map(r => {
          const m = r.metrics || {};
          return `<tr style="${r.dropped ? 'opacity:.5' : ''}">
            <td data-l="Student"><b>${esc(r.name)}</b><div class="tiny dim mono">${esc(r.email)}</div></td>
            <td data-l="Status">${r.dropped ? '<span class="pill">dropped</span>'
                 : r.completed_at ? '<span class="pill ok">finished</span>'
                 : Number(r.starts) > 0 ? '<span class="pill warn">started</span>'
                 : !r.paid ? '<span class="pill">not released</span>'
                 : '<span class="pill">not started</span>'}</td>
            <td data-l="Took" class="mono tiny">${mins(r.duration_seconds)}</td>
            <td data-l="What came back" class="tiny">${Object.keys(m).length
              ? Object.entries(m).map(([k, v]) => `<div><span class="dim">${esc(k)}:</span> ${esc(v)}</div>`).join('')
              : '<span class="dim">—</span>'}</td>
          </tr>`;
        }).join('') || '<tr><td colspan="4" class="dim">Nobody enrolled yet.</td></tr>'}
        </tbody>
      </table>
    </div>
    <div class="note">What comes back is whatever the simulation chose to report — a short summary, not a transcript. Students keep their own transcript; nothing they said is stored here.</div>`;

  document.getElementById('back').onclick = () => openCourse(course.id);
}

(async () => {
  try {
    const me = await api('/api/auth', { action:'me' });
    if (!me.user) { location.href = '/'; return; }
    if (me.user.role === 'student') { location.href = '/student.html'; return; }
    F.me = me.user;
    document.getElementById('who').textContent = me.user.name +
      (me.user.role === 'admin' ? ' · administrator, teaching view' : ' · facilitator');
    if (me.user.role === 'admin') document.getElementById('adminlink').style.display = '';
  } catch (e) { location.href = '/'; return; }
  loadHome();
})();
</script>
