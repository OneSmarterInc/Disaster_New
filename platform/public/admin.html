<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Flexee Rapid Sims</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="bar">
  <div class="brand">Flexee Rapid <span>Sims</span></div>
  <div class="who" id="who"></div>
  <a class="btn sm" href="/account.html">Account</a>
  <button class="btn sm" id="out">Sign out</button>
</div>
<div class="wrap" id="app"></div>
<script>
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D = { tab: 'faculty', data: null, detail: null, err: null, lastInvite: null, grants: null,
            simSearch: '', simFilter: 'all', simOpen: null, simEdit: null, maintOpen: false, inviteOpen: false, page: {}, courseSearch: '', linkFor: null, linkUrl: '', linkNote: '', detailSearch: '',
            facSearch: '', students: null, stuSearch: '', personEdit: null };

async function api(path, payload) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.message || d.error || 'HTTP ' + r.status); e.body = d; throw e; }
  return d;
}
// Tables stay one screen tall. Twenty-five rows a page, with a footer only when
// there is more than one page — so a small pilot never sees paging machinery.
const PER_PAGE = 25;
function paged(key, rows) {
  const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
  const p = Math.min(Math.max(1, D.page[key] || 1), pages);
  D.page[key] = p;
  return { rows: rows.slice((p - 1) * PER_PAGE, p * PER_PAGE), page: p, pages, total: rows.length };
}
function pager(key, r) {
  if (r.pages < 2) return '';
  return `<div class="row" style="justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line)">
    <span class="tiny dim">Showing ${(r.page-1)*PER_PAGE+1}–${Math.min(r.page*PER_PAGE, r.total)} of ${r.total}</span>
    <div class="row" style="gap:6px">
      <button class="btn sm" data-page="${key}:${r.page-1}" ${r.page<=1?'disabled':''}>Previous</button>
      <span class="tiny dim mono" style="align-self:center">${r.page} / ${r.pages}</span>
      <button class="btn sm" data-page="${key}:${r.page+1}" ${r.page>=r.pages?'disabled':''}>Next</button>
    </div>
  </div>`;
}

const simLabel = (x) => (x.number ? 'Rapid Sim ' + String(x.number).padStart(2,'0') + ' — ' : '') + x.title;

// Every action button says what happened, where it was pressed. A button that
// works silently is indistinguishable from one that is broken.
function flash(btn, msg, kind) {
  if (!btn) return;
  const original = btn.textContent;
  btn.textContent = msg;
  btn.style.borderColor = kind === 'bad' ? 'var(--rose)' : 'var(--green)';
  btn.style.color = kind === 'bad' ? 'var(--rose)' : 'var(--green)';
  setTimeout(() => { btn.textContent = original; btn.style.borderColor = ''; btn.style.color = ''; }, 1800);
}
// Wraps an async click: disables, shows progress, then says what happened.
function acting(btn, working) {
  if (!btn) return () => {};
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = working || 'Working…';
  return (msg, kind) => {
    btn.disabled = false;
    if (msg) { btn.textContent = original; flash(btn, msg, kind); }
    else btn.textContent = original;
  };
}
function scrollTo(id) {
  const el = document.getElementById(id);
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
const when = t => t ? new Date(t).toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }) : '—';

document.getElementById('out').onclick = async () => { await api('/api/auth', { action:'signout' }); location.href = '/'; };

async function load() {
  try {
    D.data = await api('/api/admin', { action:'overview' });
    D.grants = (await api('/api/admin', { action:'sim_access_list' })).grants || [];
    D.err = null;
  } catch (e) { D.err = e.message; }
  render();
}

function render() {
  if (!D.data) {
    // A release that adds a column and queries it will fail here until the
    // schema catches up — and the migrate button used to live on this page,
    // which made it unreachable exactly when it was needed.
    const schemaBehind = D.err && /does not exist|column|relation/i.test(D.err);
    app.innerHTML = D.err
      ? `<div class="eyebrow">Administration</div>
         <h1>${schemaBehind ? 'The database is behind the code' : 'Something went wrong'}</h1>
         <p class="lede">${esc(D.err)}</p>
         ${schemaBehind ? `<p>This release expects something the database has not got yet. Bringing it up to date creates only what is missing and drops nothing.</p>
         <div class="card"><button class="btn pri" id="fixdb">Bring the database up to date</button><div id="fixout"></div></div>`
         : '<div class="card"><button class="btn" id="retry">Try again</button></div>'}`
      : '<h1>Loading…</h1>';
    const fd = document.getElementById('fixdb');
    if (fd) fd.onclick = async () => {
      const out = document.getElementById('fixout');
      fd.disabled = true; fd.textContent = 'Running…';
      try {
        const d = await api('/api/admin', { action:'migrate' });
        out.innerHTML = `<div class="ok">Up to date — ${d.statements} statements checked.</div>`;
        D.err = null; load();
      } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`;
        fd.disabled = false; fd.textContent = 'Bring the database up to date'; }
    };
    const rt = document.getElementById('retry');
    if (rt) rt.onclick = () => { D.err = null; load(); };
    return;
  }
  if (D.detail) return renderDetail();

  const t = D.data.totals || {};
  const tabs = [['faculty','Faculty'],['students','Students'],['courses','All courses'],['catalogue','Catalogue']];

  app.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px">
      <div class="stat" style="gap:26px;margin:0">
        <div><div class="n">${D.data.faculty.length}</div><div class="l">Faculty</div></div>
        <div><div class="n">${t.students || 0}</div><div class="l">Students</div></div>
        <div><div class="n">${t.courses || 0}</div><div class="l">Courses</div></div>
        <div><div class="n">${t.paid_seats || 0}</div><div class="l">Released</div></div>
        <div><div class="n">${t.launches || 0}</div><div class="l">Launches</div></div>
      </div>
      <div class="row" style="gap:6px">
        ${tabs.map(([k,l]) => `<button class="btn ${D.tab===k?'pri':''}" data-tab="${k}">${l}</button>`).join('')}
      </div>
    </div>
    <div id="body"></div>`;

  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { D.tab = b.dataset.tab; render(); });
  app.querySelectorAll('[data-page]').forEach(b => b.onclick = () => {
    const [key, n] = b.dataset.page.split(':');
    D.page[key] = parseInt(n, 10);
    render();
  });
  const body = document.getElementById('body');
  if (D.tab === 'faculty') { body.innerHTML = facultyTab(); wireFaculty(); }
  else if (D.tab === 'students') { body.innerHTML = studentsTab(); wireStudents(); }
  else if (D.tab === 'courses') { body.innerHTML = coursesTab(); wireCourses(); }
  else { body.innerHTML = catalogueTab(); wireCatalogue(); }
}

function facultyTab() {
  const fq = (D.facSearch || '').toLowerCase().trim();
  const facPage = paged('fac', D.data.faculty.filter(f =>
    !fq || [f.name, f.email, f.institution].filter(Boolean).join(' ').toLowerCase().includes(fq)));
  return `
    <div class="row" style="justify-content:space-between;align-items:center;margin:4px 0 12px">
      <div class="eyebrow">Facilitators</div>
      <button class="btn ${D.inviteOpen ? '' : 'pri'} sm" id="inv_toggle">${D.inviteOpen ? 'Cancel' : 'Invite a facilitator'}</button>
    </div>

    ${D.inviteOpen ? `<div class="card tight" style="margin-bottom:12px">
      <div class="row" style="align-items:flex-end">
        <div class="grow"><label class="f">Name</label><input id="in" type="text" placeholder="Chuck Rivera"></div>
        <div class="grow"><label class="f">Email</label><input id="ie" type="email" placeholder="crivera@university.edu"></div>
        <div class="grow"><label class="f">Institution</label><input id="ii" type="text" placeholder="optional"></div>
        <button class="btn pri" id="inv">Create invitation</button>
      </div>
      <div id="invout"></div>
      ${D.lastInvite ? `<div class="note" style="margin-top:14px">
        <b>Send this to ${esc(D.lastInvite.name)}${D.lastInvite.email ? ' at ' + esc(D.lastInvite.email) : ''}.</b>
        There's no email service, so copy it into your own message. It works once and expires ${when(D.lastInvite.expiresAt)}.
        <div class="copybox">
          <input type="text" id="iurl" readonly value="${esc(D.lastInvite.inviteUrl)}">
          <button class="btn" id="icopy">Copy</button>
          <button class="btn" id="idone">Done</button>
        </div>
      </div>` : ''}
    </div>` : ''}

    <div class="card tight" style="margin-bottom:10px">
      <input id="fac_q" type="text" placeholder="Search by name, email or institution" value="${esc(D.facSearch || '')}">
    </div>
    <div class="card" style="padding:0">
      <table>
        <thead><tr><th>Name</th><th>Courses and simulations</th><th>Status</th><th class="mono">Students</th><th class="mono">Launches</th><th>Last seen</th><th></th></tr></thead>
        <tbody>
        ${facPage.rows.map(f => `<tr>
          <td data-l="Name"><b>${esc(f.name)}</b>
            <div class="tiny dim mono">${esc(f.email)}</div>
            ${f.institution ? `<div class="tiny dim">${esc(f.institution)}</div>` : ''}</td>
          <td data-l="Courses" class="tiny">
            ${f.course_titles ? esc(f.course_titles) : '<span class="dim">no courses yet</span>'}
            ${f.sim_titles ? `<div class="dim" style="margin-top:4px">${esc(f.sim_titles)}</div>` : ''}</td>
          <td data-l="Status">${f.disabled ? '<span class="pill bad">disabled</span>'
                : f.accepted ? '<span class="pill ok">active</span>'
                : '<span class="pill warn">invited</span>'}</td>
          <td data-l="Students" class="mono">${f.paid_students} of ${f.students}</td>
          <td data-l="Launches" class="mono">${f.launches || 0}</td>
          <td data-l="Last seen" class="tiny dim">${when(f.last_seen_at)}</td>
          <td data-l="" class="row" style="gap:6px">
            <button class="btn sm" data-open="${esc(f.id)}">Open</button>
            <button class="btn sm" data-pedit="${esc(f.id)}">Edit</button>
            <button class="btn sm" data-prow="${esc(f.id)}" data-acc="${f.accepted ? '1' : '0'}">${f.accepted ? 'Reset link' : 'New invite'}</button>
          </td>
        </tr>
        ${D.linkFor === f.id ? `<tr><td colspan="7" style="background:var(--amber-soft);padding:14px 12px">
          <b>Send this to ${esc(f.name)}.</b> ${esc(D.linkNote || '')}
          <div class="copybox"><input type="text" id="rowurl" readonly value="${esc(D.linkUrl || '')}">
            <button class="btn" id="rowcopy">Copy</button>
            <button class="btn" id="rowhide">Done</button></div>
        </td></tr>` : ''}
        ${D.personEdit === f.id ? `<tr><td colspan="7" style="background:var(--sunk);padding:16px 12px">
          <div class="row" style="align-items:flex-start">
            <div class="grow"><label class="f">Name</label><input type="text" data-pf="name" value="${esc(f.name)}"></div>
            <div class="grow"><label class="f">Email</label><input type="email" data-pf="email" value="${esc(f.email)}"></div>
            <div class="grow"><label class="f">Institution</label><input type="text" data-pf="institution" value="${esc(f.institution || '')}"></div>
          </div>
          <div class="tiny dim" style="margin-top:8px">Correcting a mistyped email here keeps their courses and students. If they never accepted the invitation, issue a fresh one afterwards — the old link points at the old address.</div>
          <div class="row" style="margin-top:12px">
            <button class="btn pri sm" data-psave="${esc(f.id)}">Save</button>
            <button class="btn sm" data-pcancel="1">Cancel</button>
            ${Number(f.courses) === 0 ? `<button class="btn sm danger" data-pdel="${esc(f.id)}">Delete this account</button>` : ''}
          </div>
          <div data-pout="${esc(f.id)}"></div>
        </td></tr>` : ''}`).join('') || '<tr><td colspan="7" class="dim">Nobody yet. Invite someone above.</td></tr>'}
        </tbody>
      </table>
      ${pager('fac', facPage)}
    </div>`;
}

// Editing a person is the same job whether they facilitate or study, so both
// tables share it.
function wirePersonEditing(reloadAfter) {
  const repaint = () => render();
  app.querySelectorAll('[data-pedit]').forEach(b => b.onclick = () => {
    D.personEdit = D.personEdit === b.dataset.pedit ? null : b.dataset.pedit; repaint(); });
  app.querySelectorAll('[data-pcancel]').forEach(b => b.onclick = () => { D.personEdit = null; repaint(); });

  app.querySelectorAll('[data-psave]').forEach(btn => btn.onclick = async () => {
    const uid = btn.dataset.psave;
    const row = btn.closest('td');
    const val = (f) => { const el = row.querySelector(`[data-pf="${f}"]`); return el ? el.value : undefined; };
    const out = app.querySelector(`[data-pout="${uid}"]`);
    const done = acting(btn, 'Saving…');
    try {
      await api('/api/admin', { action:'update_person', userId: uid,
        name: val('name'), email: val('email'), institution: val('institution') });
      done('Saved'); D.personEdit = null; D.students = null; await load();
    } catch (e) {
      if (out) out.innerHTML = `<div class="err">${esc(e.message)}</div>`;
      done('Not saved', 'bad');
    }
  });

  app.querySelectorAll('[data-pdel]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Delete this account? Only possible because they have no courses.')) return;
    const done = acting(btn, 'Deleting…');
    try { await api('/api/admin', { action:'delete_faculty', facultyId: btn.dataset.pdel });
      done(); D.personEdit = null; await load(); }
    catch (e) {
      const out = app.querySelector(`[data-pout="${btn.dataset.pdel}"]`);
      if (out) out.innerHTML = `<div class="err">${esc(e.message)}</div>`;
      done('Refused', 'bad');
    }
  });

  app.querySelectorAll('[data-sdel]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Delete this student? Their enrolments go with them.')) return;
    const done = acting(btn, 'Deleting…');
    try { await api('/api/admin', { action:'delete_student', userId: btn.dataset.sdel });
      done(); D.students = null; await load(); }
    catch (e) {
      if (confirm(e.message + '\n\nDelete anyway?')) {
        await api('/api/admin', { action:'delete_student', userId: btn.dataset.sdel, force: true });
        done(); D.students = null; await load();
      } else done('Kept', 'bad');
    }
  });
}

function wireStudents() {
  app.querySelectorAll('[data-page]').forEach(b => b.onclick = () => {
    const [key, n] = b.dataset.page.split(':');
    D.page[key] = parseInt(n, 10); render();
  });
  const sq = document.getElementById('stu_q');
  if (sq) sq.oninput = () => {
    D.stuSearch = sq.value; D.page.stu = 1;
    const body = document.getElementById('body');
    body.innerHTML = studentsTab(); wireStudents();
    const again = document.getElementById('stu_q');
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  };
  wirePersonEditing();
}

function wireFaculty() {
  const it = document.getElementById('inv_toggle');
  if (it) it.onclick = () => {
    D.inviteOpen = !D.inviteOpen;
    if (!D.inviteOpen) D.lastInvite = null;
    render();
    const n = document.getElementById('in'); if (n) n.focus();
  };
  app.querySelectorAll('[data-prow]').forEach(btn => btn.onclick = async () => {
    const fid = btn.dataset.prow;
    const person = D.data.faculty.find(x => x.id === fid);
    const done = acting(btn, 'Creating…');
    try {
      if (btn.dataset.acc === '1') {
        const d = await api('/api/admin', { action:'issue_reset', userId: fid });
        D.linkUrl = d.resetUrl;
        D.linkNote = 'A password reset. It works once and expires in three days.';
      } else {
        const d = await api('/api/admin', { action:'invite_faculty',
          name: person.name, email: person.email, institution: person.institution });
        D.linkUrl = d.inviteUrl;
        D.linkNote = 'A fresh invitation. It works once, and replaces any earlier link.';
      }
      D.linkFor = fid; D.personEdit = null;
      done(); render();
    } catch (e) { done('Failed', 'bad'); }
  });
  const rc = document.getElementById('rowcopy');
  if (rc) rc.onclick = () => {
    const f = document.getElementById('rowurl');
    f.select(); navigator.clipboard.writeText(f.value);
    flash(rc, 'Copied');
  };
  const rh = document.getElementById('rowhide');
  if (rh) rh.onclick = () => { D.linkFor = null; render(); };

  const fq = document.getElementById('fac_q');
  if (fq) fq.oninput = () => {
    D.facSearch = fq.value; D.page.fac = 1;
    const body = document.getElementById('body');
    body.innerHTML = facultyTab(); wireFaculty();
    const again = document.getElementById('fac_q');
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  };
  wirePersonEditing();
  const inv = document.getElementById('inv');
  if (inv) inv.onclick = async () => {
    const out = document.getElementById('invout');
    const name = document.getElementById('in').value;
    const email = document.getElementById('ie').value;
    const doneInv = acting(inv, 'Creating…');
    out.innerHTML = '';
    try {
      const d = await api('/api/admin', {
        action: 'invite_faculty', name, email,
        institution: document.getElementById('ii').value
      });
      // Held in state so refreshing the list underneath can't take it away.
      D.lastInvite = { name, email, inviteUrl: d.inviteUrl, expiresAt: d.expiresAt, facultyId: d.facultyId };
      doneInv(); await load();
    } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; doneInv('Failed', 'bad'); }
  };
  const ic = document.getElementById('icopy');
  if (ic) ic.onclick = () => {
    const f = document.getElementById('iurl');
    f.select(); navigator.clipboard.writeText(f.value);
    ic.textContent = 'Copied';
    setTimeout(() => { ic.textContent = 'Copy'; }, 1500);
  };
  const idone = document.getElementById('idone');
  if (idone) idone.onclick = () => { D.lastInvite = null; render(); };   // visible: the panel disappears
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = async () => {
    const done = acting(b, 'Opening…');
    try { D.detail = await api('/api/admin', { action:'faculty_detail', facultyId: b.dataset.open }); done(); render(); }
    catch (e) { done('Failed', 'bad'); D.err = e.message; render(); }
  });
}

function renderDetail() {
  const { person, courses, students, courseSims } = D.detail;
  app.innerHTML = `
    <button class="btn sm" id="back">← All facilitators</button>
    <div class="eyebrow" style="margin-top:20px">${esc(person.email)}</div>
    <h1>${esc(person.name)}</h1>
    <p class="lede">${person.accepted ? 'Active' : 'Invited but hasn\'t set a password yet'}${person.institution ? ' · ' + esc(person.institution) : ''} · joined ${when(person.created_at)}</p>

    <h2>Courses and students</h2>
    ${students.filter(st => !st.dropped).length > 6 ? `<div class="card tight" style="margin-bottom:12px">
      <input id="det_q" type="text" placeholder="Search this facilitator's students" value="${esc(D.detailSearch || '')}">
    </div>` : ''}
    ${courses.length ? courses.map(c => {
      const sims = courseSims.filter(cs => cs.course_id === c.id);
      const dq = (D.detailSearch || '').toLowerCase().trim();
      const inCourse = students.filter(st => st.course_id === c.id && !st.dropped)
        .filter(st => !dq || [st.name, st.email].filter(Boolean).join(' ').toLowerCase().includes(dq));
      return `<div class="card">
        <div class="row" style="justify-content:space-between">
          <div><h3>${esc(c.title)}</h3><div class="tiny dim">${esc(c.term || '')} · join code <span class="mono">${esc(c.join_code)}</span></div></div>
          <div class="row">
            <span class="pill">${c.enrolled} enrolled</span>
            <span class="pill ${c.paid == c.enrolled && c.enrolled > 0 ? 'ok' : 'warn'}">${c.paid} paid</span>
          </div>
        </div>
        ${sims.length ? `<div class="tiny dim" style="margin-top:10px">Sims: ${sims.map(x => esc(x.title) + (x.expected_seats ? ` (expects ${x.expected_seats})` : '')).join(', ')}</div>` : ''}
        ${inCourse.length ? `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:6px">
          <table><tbody>
          ${inCourse.map(st => `<tr>
            <td data-l="Student">${esc(st.name)}<div class="tiny dim mono">${esc(st.email)}</div></td>
            <td data-l="Access">${st.paid ? '<span class="pill ok">released</span>' : '<span class="pill warn">not yet</span>'}
                ${st.paid_note ? `<div class="tiny dim">${esc(st.paid_note)}</div>` : ''}</td>
            <td data-l="Played" class="mono tiny">${st.launches} launch${st.launches == 1 ? '' : 'es'}</td>
          </tr>`).join('')}
          </tbody></table>
        </div>` : '<div class="tiny dim" style="margin-top:10px">Nobody enrolled yet.</div>'}
      </div>`;
    }).join('') : '<div class="card dim">No courses yet.</div>'}

    <div class="rule"></div>
    <div class="row">
      <button class="btn ${person.disabled ? '' : 'danger'}" id="tog">${person.disabled ? 'Re-enable this account' : 'Disable this account'}</button>
      ${person.accepted ? '<button class="btn" id="rst">Issue a password reset link</button>'
        : '<button class="btn" id="rst">Issue a fresh invitation link</button><button class="btn" id="rev">Cancel the invitation</button>'}
      <button class="btn danger" id="del">Delete this account</button>
      <span class="tiny dim">Disabling stops them signing in. Their courses and students are untouched.</span>
    </div>
    <div id="rstout"></div>`;

  const $ = (id) => document.getElementById(id);
  const out = () => $('rstout');
  const showLink = (label, url, note) => {
    out().innerHTML = `<div class="note" style="margin-top:14px"><b>${esc(label)}</b> ${esc(note || '')}
      <div class="copybox"><input type="text" id="rurl" readonly value="${esc(url)}"><button class="btn" id="rcopy">Copy</button></div></div>`;
    $('rcopy').onclick = () => {
      $('rurl').select(); navigator.clipboard.writeText(url);
      $('rcopy').textContent = 'Copied';
      setTimeout(() => { const b = $('rcopy'); if (b) b.textContent = 'Copy'; }, 1500);
    };
  };
  const refresh = async () => {
    D.detail = await api('/api/admin', { action:'faculty_detail', facultyId: person.id });
    await load();
  };

  $('back').onclick = () => { D.detail = null; D.detailSearch = ''; render(); };
  const dq = $('det_q');
  if (dq && dq.oninput === null) dq.oninput = () => {
    D.detailSearch = dq.value; render();
    const again = document.getElementById('det_q');
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  };   // visible: the whole view changes

  $('rst').onclick = async () => {
    const doneR = acting($('rst'), 'Creating…');
    try {
      if (person.accepted) {
        const d = await api('/api/admin', { action:'issue_reset', userId: person.id });
        showLink(`Send this to ${d.who}.`, d.resetUrl, 'It works once and expires in three days.');
      } else {
        const d = await api('/api/admin', { action:'invite_faculty',
          name: person.name, email: person.email, institution: person.institution });
        showLink(`Send this to ${person.name}.`, d.inviteUrl, 'A fresh invitation. It works once; any earlier link is replaced.');
      }
      doneR();
    } catch (e) { out().innerHTML = `<div class="err">${esc(e.message)}</div>`; doneR('Failed', 'bad'); }
  };

  const rev = $('rev');
  if (rev) rev.onclick = async () => {
    if (!confirm('Cancel the invitation? Any link already sent will stop working.')) return;
    const doneV = acting(rev, 'Cancelling…');
    try {
      await api('/api/admin', { action:'revoke_invites', facultyId: person.id });
      D.lastInvite = null;
      out().innerHTML = '<div class="ok">Invitation cancelled. Any link already sent is now dead.</div>';
      doneV();
    } catch (e) { out().innerHTML = `<div class="err">${esc(e.message)}</div>`; doneV('Failed', 'bad'); }
  };

  const del = $('del');
  if (del) del.onclick = async () => {
    if (!confirm(`Delete ${person.name} entirely? This is refused if they have courses.`)) return;
    const doneDel = acting(del, 'Deleting…');
    try {
      await api('/api/admin', { action:'delete_faculty', facultyId: person.id });
      doneDel(); D.detail = null; D.lastInvite = null; await load();
    } catch (e) { out().innerHTML = `<div class="err">${esc(e.message)}</div>`; doneDel('Not deleted', 'bad'); }
  };

  $('tog').onclick = async () => {
    const doneT = acting($('tog'), 'Saving…');
    try {
      await api('/api/admin', { action:'set_faculty_disabled', facultyId: person.id, disabled: !person.disabled });
      doneT(); await refresh();
    } catch (e) { out().innerHTML = `<div class="err">${esc(e.message)}</div>`; doneT('Failed', 'bad'); }
  };
}

function studentsTab() {
  if (!D.students) { loadStudents(); return '<div class="card dim">Loading…</div>'; }
  const q = (D.stuSearch || '').toLowerCase().trim();
  const stuPage = paged('stu', D.students.filter(st => !q ||
    [st.name, st.email, st.course_titles, st.faculty_names, st.sim_titles]
      .filter(Boolean).join(' ').toLowerCase().includes(q)));
  const shown = stuPage.rows;
  return `
    <h2>Students</h2>
    <div class="card tight" style="margin-bottom:12px">
      <input id="stu_q" type="text" placeholder="Search by name, email or course" value="${esc(D.stuSearch || '')}">
    </div>
    <div class="card" style="padding:0">
      <table>
        <thead><tr><th>Student</th><th>Course and facilitator</th><th>Simulations</th><th class="mono">Access</th><th class="mono">Played</th><th class="mono">Finished</th><th></th></tr></thead>
        <tbody>
        ${shown.map(st => `<tr>
          <td data-l="Student"><b>${esc(st.name)}</b>
            <div class="tiny dim mono">${esc(st.email)}</div>
            <div class="tiny dim">joined ${when(st.created_at)}</div></td>
          <td data-l="Course" class="tiny">${esc(st.course_titles || '—')}
            ${st.faculty_names ? `<div class="dim" style="margin-top:3px">${esc(st.faculty_names)}</div>` : ''}</td>
          <td data-l="Simulations" class="tiny">${st.sim_titles ? esc(st.sim_titles) : '<span class="dim">none yet</span>'}</td>
          <td data-l="Access" class="mono">${Number(st.with_access) === Number(st.courses) && Number(st.courses) > 0
              ? `<span class="pill ok">${st.with_access} of ${st.courses}</span>`
              : `<span class="pill warn">${st.with_access} of ${st.courses}</span>`}</td>
          <td data-l="Played" class="mono">${st.launches}</td>
          <td data-l="Finished" class="mono">${Number(st.finished) > 0 ? `<span class="pill ok">${st.finished}</span>` : '0'}</td>
          <td data-l="" class="row" style="gap:6px">
            <button class="btn sm" data-pedit="${esc(st.id)}">Edit</button>
            <button class="btn sm danger" data-sdel="${esc(st.id)}">Delete</button>
          </td>
        </tr>
        ${D.personEdit === st.id ? `<tr><td colspan="7" style="background:var(--sunk);padding:16px 12px">
          <div class="row" style="align-items:flex-start">
            <div class="grow"><label class="f">Name</label><input type="text" data-pf="name" value="${esc(st.name)}"></div>
            <div class="grow"><label class="f">Email</label><input type="email" data-pf="email" value="${esc(st.email)}"></div>
          </div>
          <div class="tiny dim" style="margin-top:8px">Their email is how they sign in. Changing it does not tell them.</div>
          <div class="row" style="margin-top:12px">
            <button class="btn pri sm" data-psave="${esc(st.id)}">Save</button>
            <button class="btn sm" data-pcancel="1">Cancel</button>
          </div>
          <div data-pout="${esc(st.id)}"></div>
        </td></tr>` : ''}`).join('') || `<tr><td colspan="7" class="dim">${D.students.length ? 'Nobody matches that.' : 'No students yet.'}</td></tr>`}
        </tbody>
      </table>
      ${pager('stu', stuPage)}
    </div>`;
}
async function loadStudents() {
  try { D.students = (await api('/api/admin', { action:'all_students' })).students; render(); }
  catch (e) { D.students = []; D.err = e.message; render(); }
}

function coursesTab() {
  if (!D.allCourses) { load_courses(); return '<div class="card dim">Loading…</div>'; }
  const cq = (D.courseSearch || '').toLowerCase().trim();
  const cPage = paged('crs', D.allCourses.filter(c =>
    !cq || [c.title, c.term, c.join_code, c.faculty_name, c.sim_titles]
      .filter(Boolean).join(' ').toLowerCase().includes(cq)));
  const rows = cPage.rows;
  return `
    <div class="card tight" style="margin:4px 0 10px">
      <input id="crs_q" type="text" placeholder="Search by course, term, code, facilitator or simulation" value="${esc(D.courseSearch || '')}">
    </div>
    <div class="card" style="padding:0">
      <table>
        <thead><tr><th>Course</th><th>Facilitator</th><th>Simulations</th><th class="mono">Enrolled</th><th class="mono">Released</th><th class="mono">Launches</th></tr></thead>
        <tbody>
        ${rows.map(c => `<tr${c.archived ? ' style="opacity:.5"' : ''}>
          <td data-l="Course"><b>${esc(c.title)}</b><div class="tiny dim">${esc(c.term || '')} · <span class="mono">${esc(c.join_code)}</span>${c.archived ? ' · archived' : ''}</div></td>
          <td data-l="Facilitator">${esc(c.faculty_name)}${c.institution ? `<div class="tiny dim">${esc(c.institution)}</div>` : ''}</td>
          <td data-l="Simulations" class="tiny">${esc(c.sim_titles || '—')}</td>
          <td data-l="Enrolled" class="mono">${c.enrolled}</td>
          <td data-l="Released" class="mono">${Number(c.paid) === Number(c.enrolled) && Number(c.enrolled) > 0
              ? `<span class="pill ok">${c.paid}</span>` : `<span class="pill warn">${c.paid}</span>`}</td>
          <td data-l="Launches" class="mono">${c.launches}</td>
        </tr>`).join('') || '<tr><td colspan="6" class="dim">No courses yet.</td></tr>'}
        </tbody>
      </table>
      ${pager('crs', cPage)}
    </div>`;
}
async function load_courses() {
  try { D.allCourses = (await api('/api/admin', { action:'all_courses' })).courses; render(); }
  catch (e) { D.err = e.message; }
}
function wireCourses() {
  const cq = document.getElementById('crs_q');
  if (cq) cq.oninput = () => {
    D.courseSearch = cq.value; D.page.crs = 1;
    const body = document.getElementById('body');
    body.innerHTML = coursesTab(); wireCourses();
    const again = document.getElementById('crs_q');
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  };
  app.querySelectorAll('[data-page]').forEach(b => b.onclick = () => {
    const [key, n] = b.dataset.page.split(':');
    D.page[key] = parseInt(n, 10); render();
  });
}

function catalogueTab() {
  const all = (D.data.sims || []);
  const q = (D.simSearch || '').toLowerCase().trim();
  const shown = all.filter(si => {
    if (D.simFilter === 'published' && !si.published) return false;
    if (D.simFilter === 'draft' && si.published) return false;
    if (!q) return true;
    return [si.title, si.id, si.tagline, si.description, si.number]
      .filter(Boolean).join(' ').toLowerCase().includes(q);
  });
  const counts = { all: all.length,
    published: all.filter(x => x.published).length,
    draft: all.filter(x => !x.published).length };

  return `
    <h2>Sims</h2>
    <div class="card tight" style="margin-bottom:16px">
      <div class="row">
        <div class="grow">
          <input id="sim_q" type="text" placeholder="Search by title, id or number" value="${esc(D.simSearch || '')}">
        </div>
        ${[['all','Everything'],['published','Published'],['draft','Draft']].map(([k,l]) =>
          `<button class="btn ${D.simFilter === k ? 'pri' : ''}" data-simfilter="${k}">${l} (${counts[k]})</button>`).join('')}
      </div>
    </div>

    ${shown.map(si => {
      const reviewers = (D.grants || []).filter(g => g.sim_id === si.id);
      const open = D.simOpen === si.id;
      return `<div class="card" style="padding:0;margin-bottom:10px">
        <div class="row" style="justify-content:space-between;align-items:flex-start;padding:16px 20px;gap:14px">
          <div style="flex:1;min-width:220px">
            <div class="row" style="gap:10px;align-items:baseline">
              <span class="mono" style="font-size:13px;color:var(--ink3);min-width:26px">${si.number ? String(si.number).padStart(2,'0') : '··'}</span>
              <h3 style="margin:0">${esc(si.title)}</h3>
              ${si.published ? '<span class="pill ok">published</span>'
                : `<span class="pill warn">draft${reviewers.length ? ' · ' + reviewers.length + ' reviewing' : ''}</span>`}
            </div>
            <div class="tiny dim" style="margin-top:5px">${esc(si.tagline || '')}</div>
            <div class="tiny dim mono" style="margin-top:6px">${esc(si.id)} · ${si.minutes || '?'} min · ${esc(si.launch_url)}</div>
          </div>
          <div class="row" style="gap:6px">
            <button class="btn sm" data-editsim="${esc(si.id)}">${D.simEdit === si.id ? 'Close' : 'Edit'}</button>
            <button class="btn sm" data-pub="${esc(si.id)}" data-now="${si.published ? '1' : '0'}">${si.published ? 'Unpublish' : 'Publish'}</button>
            ${!si.published ? `<button class="btn sm" data-simopen="${esc(si.id)}">${open ? 'Hide reviewers' : 'Reviewers'}</button>` : ''}
            <button class="btn sm danger" data-delsim="${esc(si.id)}">Delete</button>
          </div>
        </div>

        ${D.simEdit === si.id ? `<div style="border-top:1px solid var(--line);padding:18px 20px;background:var(--sunk)">
          <div class="eyebrow" style="margin-bottom:12px">Editing</div>
          <div class="row" style="align-items:flex-start">
            <div style="width:110px"><label class="f">Number</label>
              <input type="number" min="1" data-f="number" value="${si.number || ''}"></div>
            <div class="grow"><label class="f">Title</label>
              <input type="text" data-f="title" value="${esc(si.title || '')}"></div>
            <div style="width:120px"><label class="f">Minutes</label>
              <input type="number" data-f="minutes" value="${si.minutes || ''}"></div>
          </div>
          <div class="field" style="margin-top:14px"><label class="f">Tagline</label>
            <input type="text" data-f="tagline" value="${esc(si.tagline || '')}"></div>
          <div class="field"><label class="f">Description</label>
            <textarea rows="4" data-f="description">${esc(si.description || '')}</textarea></div>
          <div class="tiny dim" style="margin-bottom:14px">The id and address come from the deployment itself and are not editable here.
            Anything you write below is yours — the simulation will not overwrite it when it next announces itself.</div>
          <div class="row">
            <button class="btn pri" data-savesim="${esc(si.id)}">Save changes</button>
            <button class="btn" data-canceledit="1">Cancel</button>
          </div>
          <div data-saveout="${esc(si.id)}"></div>
        </div>` : ''}

        ${(!si.published && open) ? `<div style="border-top:1px solid var(--line);padding:16px 20px;background:var(--sunk)">
          <div class="eyebrow" style="margin-bottom:8px">Who can see it before it's published</div>
          ${reviewers.map(g => `<div class="row" style="justify-content:space-between;padding:5px 0">
            <div><b>${esc(g.name)}</b> <span class="tiny dim mono">${esc(g.email)}</span>
              ${g.note ? `<div class="tiny dim">${esc(g.note)}</div>` : ''}</div>
            <button class="btn sm" data-revgrant="${esc(g.id)}">Revoke</button>
          </div>`).join('') || '<div class="tiny dim">Nobody yet — it is invisible to everyone but administrators.</div>'}
          <div class="row" style="margin-top:12px">
            <input type="email" data-grantmail="${esc(si.id)}" placeholder="their email" style="width:220px">
            <input type="text" data-grantnote="${esc(si.id)}" placeholder="why, e.g. reviewing before we ship" style="width:250px">
            <button class="btn" data-grant="${esc(si.id)}">Give review access</button>
          </div>
          <div class="tiny dim" style="margin-top:8px">They must already have a facilitator account. Grants disappear when the simulation is published.</div>
        </div>` : ''}
      </div>`;
    }).join('') || `<div class="card dim">${all.length ? 'Nothing matches that.' : 'Nothing in the catalogue yet — add one below.'}</div>`}

    <div class="rule" style="margin:34px 0 0"></div>
    <div class="row" style="justify-content:space-between;align-items:center;margin-top:18px">
      <div class="eyebrow">Maintenance</div>
      <button class="btn sm" id="maint_toggle">${D.maintOpen ? 'Hide' : 'Show'}</button>
    </div>

    ${D.maintOpen ? `<div class="card tight" style="margin-top:12px">
      <div class="row" style="justify-content:space-between;align-items:flex-start;padding:4px 0 14px;border-bottom:1px solid var(--line)">
        <div style="flex:1;min-width:240px">
          <b>Update the database</b>
          <div class="tiny dim" style="margin-top:3px">Run after a release that adds tables or columns. Creates only what is missing and never drops anything, so running it again is harmless.</div>
        </div>
        <button class="btn" id="mig">Update</button>
      </div>
      <div id="migout"></div>

      <div class="row" style="justify-content:space-between;align-items:flex-start;padding:14px 0 4px">
        <div style="flex:1;min-width:240px">
          <b style="color:var(--rose)">Clear the pilot data</b>
          <div class="tiny dim" style="margin-top:3px">Deletes every facilitator, student, course, enrolment and record of play, so a trial can be run again from nothing. Administrators and the catalogue survive. There is no undo.</div>
        </div>
        <div class="row">
          <input type="text" id="rst_confirm" placeholder="type DELETE EVERYTHING" style="width:200px">
          <button class="btn danger" id="rst_go">Clear</button>
        </div>
      </div>
      <div id="rst_out"></div>
    </div>` : ''}

    <div class="note">
      Simulations appear here on their own. Each deployment tells the platform it exists the first time it is used, and arrives unpublished — invisible to everyone but you until you publish it or grant someone review access. There is nothing to add by hand.
    </div>
`;
}

function wireCatalogue() {
  const sq = document.getElementById('sim_q');
  const repaint = () => {
    const body = document.getElementById('body');
    body.innerHTML = catalogueTab(); wireCatalogue();
  };
  if (sq) sq.oninput = () => {
    D.simSearch = sq.value;
    repaint();
    const again = document.getElementById('sim_q');
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  };
  app.querySelectorAll('[data-simfilter]').forEach(b => b.onclick = () => { D.simFilter = b.dataset.simfilter; repaint(); });
  app.querySelectorAll('[data-simopen]').forEach(b => b.onclick = () => {
    D.simOpen = D.simOpen === b.dataset.simopen ? null : b.dataset.simopen; repaint(); });
  app.querySelectorAll('[data-editsim]').forEach(b => b.onclick = () => {
    D.simEdit = D.simEdit === b.dataset.editsim ? null : b.dataset.editsim;
    D.simOpen = null; repaint(); });
  app.querySelectorAll('[data-canceledit]').forEach(b => b.onclick = () => { D.simEdit = null; repaint(); });

  app.querySelectorAll('[data-savesim]').forEach(btn => btn.onclick = async () => {
    const simId = btn.dataset.savesim;
    const si = (D.data.sims || []).find(x => x.id === simId);
    const panel = btn.closest('div').parentElement;
    const val = (f) => {
      const el = panel.querySelector(`[data-f="${f}"]`);
      return el ? el.value : '';
    };
    const out = app.querySelector(`[data-saveout="${simId}"]`);
    const done = acting(btn, 'Saving…');
    try {
      await api('/api/admin', { action:'save_sim',
        id: simId, number: val('number'), title: val('title'),
        tagline: val('tagline'), description: val('description'),
        minutes: val('minutes'), launchUrl: si.launch_url, published: !!si.published });
      done('Saved'); D.simEdit = null; load();
    } catch (e) {
      if (out) out.innerHTML = `<div class="err">${esc(e.message)}</div>`;
      done('Not saved', 'bad');
    }
  });

  app.querySelectorAll('[data-pub]').forEach(btn => btn.onclick = async () => {
    const si = (D.data.sims || []).find(x => x.id === btn.dataset.pub);
    if (!si) return;
    const done = acting(btn, 'Saving…');
    try {
      await api('/api/admin', { action:'save_sim', id: si.id, number: si.number, title: si.title,
        tagline: si.tagline, description: si.description, launchUrl: si.launch_url,
        minutes: si.minutes, published: btn.dataset.now !== '1' });
      done(); load();
    } catch (e) { done('Failed', 'bad'); }
  });

  app.querySelectorAll('[data-grant]').forEach(btn => btn.onclick = async () => {
    const sid = btn.dataset.grant;
    const mail = app.querySelector(`[data-grantmail="${sid}"]`);
    const note = app.querySelector(`[data-grantnote="${sid}"]`);
    const done = acting(btn, 'Granting…');
    try {
      await api('/api/admin', { action:'grant_sim_access',
        simId: sid, email: mail ? mail.value : '', note: note ? note.value : '' });
      done('Granted'); load();
    } catch (e) { done(e.message.slice(0, 24), 'bad'); }
  });
  app.querySelectorAll('[data-revgrant]').forEach(btn => btn.onclick = async () => {
    const done = acting(btn, 'Revoking…');
    try { await api('/api/admin', { action:'revoke_sim_access', grantId: btn.dataset.revgrant }); done(); load(); }
    catch (e) { done('Failed', 'bad'); }
  });

  app.querySelectorAll('[data-delsim]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Delete this simulation from the catalogue? It will reappear, unpublished, the next time that deployment is used.')) return;
    const done = acting(btn, 'Deleting…');
    try { await api('/api/admin', { action:'delete_sim', simId: btn.dataset.delsim }); done(); load(); }
    catch (e) {
      if (confirm(e.message + '\n\nDelete it anyway?')) {
        await api('/api/admin', { action:'delete_sim', simId: btn.dataset.delsim, force: true });
        done(); load();
      } else done('Kept', 'bad');
    }
  });

  const rg = document.getElementById('rst_go');
  if (rg) rg.onclick = async () => {
    const out = document.getElementById('rst_out');
    const done = acting(rg, 'Wiping…');
    try {
      await api('/api/admin', { action:'reset_test_data', confirm: document.getElementById('rst_confirm').value });
      out.innerHTML = '<div class="ok">Done. Everything except administrators and the catalogue is gone.</div>';
      D.detail = null; D.lastInvite = null; D.allCourses = null;
      done(); load();
    } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; done('Failed', 'bad'); }
  };

  const mt = document.getElementById('maint_toggle');
  if (mt) mt.onclick = () => { D.maintOpen = !D.maintOpen; repaint(); };

  const mb = document.getElementById('mig');
  if (mb) mb.onclick = async () => {
    const out = document.getElementById('migout');
    const done = acting(mb, 'Running…');
    try {
      const d = await api('/api/admin', { action:'migrate' });
      out.innerHTML = `<div class="ok">Up to date — ${d.statements} statements checked.</div>`;
      done();
    } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; done('Failed', 'bad'); }
  };
}

(async () => {
  try {
    const me = await api('/api/auth', { action:'me' });
    if (!me.user) { location.href = '/'; return; }
    if (me.user.role !== 'admin') { location.href = me.user.role === 'faculty' ? '/faculty.html' : '/student.html'; return; }
    document.getElementById('who').textContent = me.user.name + ' · administrator';
  } catch (e) { location.href = '/'; return; }
  load();
})();
</script>
</body>
</html>
