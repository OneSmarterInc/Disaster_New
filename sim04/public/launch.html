<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whose Number Is Right? — access</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E1524;color:#E8E4DA;font-family:Georgia,serif}.box{width:min(520px,calc(100% - 36px));padding:30px;border:1px solid #2B3548;background:#161E2E}.ey{font:11px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#F0A63C}h1{font-weight:400;margin:10px 0 10px}.muted{color:#8C95A8;line-height:1.55}a{color:#F0A63C}
</style>
</head>
<body>
<div class="box">
  <div class="ey">Flexee RapidSim 04</div>
  <h1 id="title">Whose Number Is Right?</h1>
  <p class="muted" id="message">Checking your RapidSims sign-in…</p>
  <p class="muted" id="course-link" hidden><a href="/student.html">Back to your courses</a></p>
  <p class="muted"><a id="instructorLink" href="instructor.html">Instructor? Open the console.</a></p>
</div>
<script src="platform-launch.js"></script>
<script>
const BASE=(location.pathname.match(/^\/sim-?\d+/)||[''])[0];
const tokenParams=new URLSearchParams(location.hash.slice(1));
let launch=null,token=tokenParams.get('lt')||new URLSearchParams(location.search).get('lt')||null;
if(token){try{launch=JSON.parse(atob(token.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')))}catch{launch=null}}
const faculty=launch&&(launch.role==='faculty'||launch.role==='faculty_preview')&&launch.mode==='session';
if(faculty&&token)sessionStorage.setItem('m04-faculty-lt',token);
const params=new URLSearchParams(location.search);params.delete('lt');const session=(params.get('session')||'').trim().toUpperCase();const q=params.toString();
document.getElementById('instructorLink').href=BASE+'/instructor.html';
function goWithToken(){const target=faculty?'/instructor.html':'/index.html';location.replace(BASE+target+(q?'?'+q:'')+'#lt='+encodeURIComponent(token))}
function openPlatformSession(){
  if(session){
    const entry=new URLSearchParams({sim:'rapid-04-whose-number',session});
    const course=params.get('course');if(course)entry.set('course',course);
    location.replace('https://rapidsims.flexee.org/session.html?'+entry.toString());
  }else location.replace('https://rapidsims.flexee.org/sim04/');
}
if(token){goWithToken()}
else if(BASE!=='/sim04'){openPlatformSession()}
else{
  const message=document.getElementById('message'),courseLink=document.getElementById('course-link');
  platformLaunch('rapid-04-whose-number').then(result=>{
    if(result.status==='launched')return;
    if(result.status==='signed_out'){
      message.textContent='Sign in to RapidSims from your course page to open this simulation.';courseLink.hidden=false;return;
    }
    message.textContent=result.message||'RapidSims could not check access right now.';
    courseLink.hidden=false;
  });
}
</script>
</body>
</html>
