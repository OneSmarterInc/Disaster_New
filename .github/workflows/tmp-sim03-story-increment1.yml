name: tmp-sim03-story-increment1
on:
  push:
    branches: [content/sim03-story-increment-1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/sim03-story-increment-1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Increment 1 only
        run: |
          python .github/scripts/sim03_story_increment1_patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('sim03/build.js')
          s=p.read_text()
          old="for (const marker of ['Forty-one years old, profitable, and nobody thinks it is in trouble.','Four people, one budget.','Take the seat','One of the five lines has nobody speaking for it','Dale Brenner','Renata Oyelaran','Tom Vasquez','Sam Achterberg',\"Nobody asks for this.\",\"Sam's line.\"])"
          new="for (const marker of ['Forty-one years old, profitable, and nobody thinks it is in trouble.','Four people, one budget.','Take the seat','One of the five lines has nobody speaking for it'])"
          if old not in s: raise SystemExit('increment-1 build marker anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Assert out-of-scope code untouched
        run: |
          git diff --exit-code HEAD -- sim03/config/thresholds.json sim03/api sim03/public/instructor.html
          git show HEAD:sim03/lib/scenario.js | sed -n '/const COPY = Object.freeze(/,/function publicConfig()/p' | sed '$d' > /tmp/engine-before
          sed -n '/const COPY = Object.freeze(/,/function publicConfig()/p' sim03/lib/scenario.js | sed '$d' > /tmp/engine-after
          diff -u /tmp/engine-before /tmp/engine-after
          ! git diff -- sim03/public/index.html | grep -E '^[+-].*(The CEO wants AI failure prediction|Same company\. Three different answers|Your outcome|Overall result|Three-year consequence timeline)' 
      - name: Run Sim03 tests
        run: npm --prefix sim03 test
      - name: Build Sim03
        run: npm --prefix sim03 run build
      - name: Run platform integration check
        run: node platform/tools/check-sim03-integration.js
      - name: Parse student browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('sim03/public/index.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>', text)
          assert scripts
          for i,s in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'sim03-inc1-{i}.js'
              p.write_text(s)
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Assert Increment 1 content
        run: |
          grep -q 'Dale Brenner' sim03/lib/scenario.js
          grep -q 'Renata Oyelaran' sim03/lib/scenario.js
          grep -q 'Tom Vasquez' sim03/lib/scenario.js
          grep -q 'Sam Achterberg' sim03/lib/scenario.js
          grep -q "line: 'Run'" sim03/lib/scenario.js
          grep -q "line: 'Uptime'" sim03/lib/scenario.js
          grep -q "line: 'Features'" sim03/lib/scenario.js
          grep -q "line: 'Connect'" sim03/lib/scenario.js
          ! grep -q "line: 'Capacity'" sim03/lib/scenario.js
          grep -q 'Four people, one budget.' sim03/public/index.html
          grep -q 'Take the seat' sim03/public/index.html
          grep -q 'Forty-one years old, profitable, and nobody thinks it is in trouble.' sim03/public/index.html
          grep -q 'readOnlyAllocationHTML' sim03/public/index.html
      - name: Commit Increment 1
        run: |
          git config user.name 'OneSmarterInc Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sim03/lib/scenario.js sim03/public/index.html sim03/tools/check.js sim03/build.js
          git diff --cached --quiet && exit 0
          git commit -m 'Set up Midland story and room'
          git push origin HEAD:content/sim03-story-increment-1
