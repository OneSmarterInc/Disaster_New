name: tmp-fix-sim03-access-loop

on:
  push:
    branches: ['fix/sim03-access-loop']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim03-access-loop
      - name: Stop automatic access redirect loop
        shell: python
        run: |
          from pathlib import Path
          p=Path('sim03/public/index.html')
          s=p.read_text()
          old="""  catch(e){
    if(e.code==='access_code_required'&&!LAUNCH_TOKEN){sessionStorage.removeItem('m03-access');location.replace(BASE+'/');return}
    app.innerHTML=`<main class=\"page\">${notice(e.message,true)}<div class=\"actions\"><button class=\"btn pri\" onclick=\"location.reload()\">Try again</button></div></main>`;
    return;
  }"""
          new="""  catch(e){
    if(e.code==='access_code_required'&&!LAUNCH_TOKEN){
      sessionStorage.removeItem('m03-access');
      app.innerHTML=`<main class=\"page\">${notice('Your access code is missing or no longer valid.',true)}<div class=\"actions\"><button class=\"btn pri\" id=\"accessBtn\">Return to access screen</button></div></main>`;
      document.getElementById('accessBtn').onclick=()=>location.replace(BASE+'/');
      return;
    }
    app.innerHTML=`<main class=\"page\">${notice(e.message,true)}<div class=\"actions\"><button class=\"btn pri\" onclick=\"location.reload()\">Try again</button></div></main>`;
    return;
  }"""
          if old not in s:
            if new not in s: raise SystemExit('access catch marker missing')
          else:
            s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sim03/public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stop Sim03 access redirect loop"
          git push origin HEAD:fix/sim03-access-loop
