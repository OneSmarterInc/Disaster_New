name: tmp-sim03-increment2
on:
  push:
    branches: [content/sim03-increment2]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/sim03-increment2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Increment 2 patch
        run: python .github/scripts/sim03_increment2_patch.py
      - name: Assert out-of-scope files untouched
        run: |
          git diff --exit-code HEAD -- sim03/config/thresholds.json sim03/public/instructor.html sim03/api/session.js sim03/api/outcome.js sim03/lib/store.js sim03/lib/guard.js sim03/api/health.js
      - name: Run Sim03 tests
        run: npm --prefix sim03 test
      - name: Run Sim03 build guards
        run: npm --prefix sim03 run build
      - name: Run platform integration
        run: node platform/tools/check-sim03-integration.js
      - name: Run platform lifecycle
        run: node tools/sim03-lifecycle-check.js
      - name: Parse student browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('sim03/public/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', text)
          assert scripts
          for i,s in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'sim03-inc2-{i}.js'
              p.write_text(s)
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit Increment 2
        run: |
          git config user.name 'OneSmarterInc Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sim03/lib/scenario.js sim03/lib/closingLesson.js sim03/api/finish.js sim03/public/index.html sim03/build.js sim03/tools/check.js sim03/tools/increment2-check.js
          git diff --cached --quiet && exit 0
          git commit -m 'Midland Increment 2: make consequences land'
          git push origin HEAD:content/sim03-increment2
