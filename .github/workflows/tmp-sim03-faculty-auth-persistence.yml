name: tmp-sim03-faculty-auth-persistence
on:
  push:
    branches: [fix/sim03-faculty-auth-persistence]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim03-faculty-auth-persistence
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply faculty auth persistence fix
        run: python .github/scripts/sim03_faculty_auth_persistence.py
      - name: Assert gameplay and team engine untouched
        run: |
          git diff --exit-code HEAD -- sim03/api/session.js sim03/lib/store.js sim03/lib/scenario.js sim03/config/thresholds.json sim03/api/outcome.js sim03/api/finish.js sim03/lib/closingLesson.js sim03/api/health.js sim03/public/instructor.html~ 2>/dev/null || true
          git diff --exit-code HEAD -- sim03/api/session.js sim03/lib/store.js sim03/lib/scenario.js sim03/config/thresholds.json sim03/api/outcome.js sim03/api/finish.js sim03/lib/closingLesson.js sim03/api/health.js
      - name: Run Sim03 tests
        run: npm --prefix sim03 test
      - name: Run complete build guards
        run: npm --prefix sim03 run build
      - name: Run explicit three-student team handler regression
        run: node sim03/tools/team-handler-check.js
      - name: Run platform integration
        run: node platform/tools/check-sim03-integration.js
      - name: Parse all Sim03 browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ['index.html','instructor.html','launch.html']:
              text=Path('sim03/public',name).read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text)
              assert scripts, name
              for n,code in enumerate(scripts):
                  p=Path(tempfile.gettempdir())/f'{name}-{n}.js'
                  p.write_text(code)
                  subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Assert authorization persistence behavior
        run: |
          grep -q "sessionStorage.getItem(FACULTY_TOKEN_KEY)" sim03/public/instructor.html
          grep -q "sessionStorage.setItem(FACULTY_TOKEN_KEY,incomingLT)" sim03/public/instructor.html
          grep -q "Faculty authorization received from RapidSims" sim03/public/instructor.html
          grep -q "signed platform faculty token should create a team session" sim03/tools/session-auth-check.js
          grep -q "sessionStorage.setItem('m03-faculty-lt',token)" sim03/public/launch.html
      - name: Commit tested fix
        run: |
          git config user.name 'OneSmarterInc Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sim03/public/instructor.html sim03/public/launch.html sim03/public/index.html sim03/tools/session-auth-check.js sim03/build.js
          git diff --cached --quiet && exit 0
          git commit -m 'Keep Sim03 faculty authorization across instructor reloads'
          git push origin HEAD:fix/sim03-faculty-auth-persistence
