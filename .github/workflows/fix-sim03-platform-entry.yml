name: fix-sim03-platform-entry

on:
  push:
    branches:
      - 'fix/sim03-platform-entry'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim03-platform-entry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Sim03 platform entry hotfix
        run: python .github/scripts/fix_sim03_platform_entry.py
      - name: Commit hotfix
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add platform/vercel.json platform/tools/check-sim03-integration.js sim03/public/index.html sim03/build.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix Sim03 platform access entry loop"
          git push origin HEAD:fix/sim03-platform-entry
