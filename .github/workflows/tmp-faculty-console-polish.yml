name: tmp-faculty-console-polish
on:
  push:
    branches: ['ui/faculty-console-polish-pagination']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/faculty-console-polish-pagination
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply faculty console polish and pagination
        run: python .github/scripts/faculty_console_polish.py
      - name: Run faculty and Sim03 integration checks
        working-directory: platform
        run: |
          node tools/check-faculty-student-results.js
          node tools/faculty-views-check.js
          node tools/check-sim03-integration.js
      - name: Parse faculty browser JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const s=fs.readFileSync('platform/public/faculty.html','utf8');
          const scripts=[...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]);
          if(!scripts.length) throw new Error('No inline scripts');
          scripts.forEach((x,i)=>new vm.Script(x,{filename:'faculty-script-'+i}));
          console.log('Faculty browser JavaScript parses.');
          NODE
      - name: Commit updated faculty console
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add platform/public/faculty.html platform/public/app.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish faculty console and add table pagination"
          git push origin HEAD:ui/faculty-console-polish-pagination
