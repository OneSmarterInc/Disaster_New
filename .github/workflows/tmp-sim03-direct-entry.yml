name: tmp-sim03-direct-entry

on:
  push:
    branches: ['fix/sim03-direct-access-entry']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim03-direct-access-entry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch direct access entry
        shell: python
        run: |
          from pathlib import Path
          import json

          p=Path('sim03/public/index.html')
          s=p.read_text()
          old="document.getElementById('accessBtn').onclick=()=>location.assign(BASE+'/');"
          new="document.getElementById('accessBtn').onclick=()=>location.assign(BASE+'/launch.html');"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('access button marker missing')
          p.write_text(s)

          p=Path('sim03/vercel.json')
          j=json.loads(p.read_text())
          j['rewrites']=[r for r in j.get('rewrites',[]) if r.get('source') != '/']
          redirects=[r for r in j.get('redirects',[]) if r.get('source') != '/']
          redirects.insert(0, {'source':'/','destination':'/launch.html','permanent':False})
          j['redirects']=redirects
          p.write_text(json.dumps(j, indent=2)+'\n')

          p=Path('sim03/build.js')
          s=p.read_text()
          marker="if (!index.includes('Enter access code')) {\n  refuse('student access failure does not offer a stable manual return to the gate');\n}\n"
          extra=marker+"if (!index.includes(\"location.assign(BASE+'/launch.html')\")) {\n  refuse('student access button does not target the explicit launch gate');\n}\n"
          if "student access button does not target the explicit launch gate" not in s:
              if marker not in s: raise SystemExit('build marker missing')
              s=s.replace(marker,extra,1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sim03/public/index.html sim03/vercel.json sim03/build.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Sim03 direct access-code entry"
          git push origin HEAD:fix/sim03-direct-access-entry
