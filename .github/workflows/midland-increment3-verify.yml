name: Midland student browser verification
on:
  pull_request:
    paths:
      - 'sim03/**'
      - '.github/workflows/midland-increment3-verify.yml'
  push:
    branches: [main]
    paths:
      - 'sim03/**'
      - '.github/workflows/midland-increment3-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  student-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and behavioral regressions
        run: |
          cd sim03
          npm test
          npm run build
      - name: Install isolated browser test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/midland-browser"
          cd "$RUNNER_TEMP/midland-browser"
          npm install --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Student journey and laptop-layout checks
        env:
          NODE_PATH: ${{ runner.temp }}/midland-browser/node_modules
          MIDLAND_SCREENSHOTS: ${{ runner.temp }}/midland-screenshots
        run: node sim03/tools/increment3-browser-check.js
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midland-student-browser-evidence
          path: ${{ runner.temp }}/midland-screenshots
          if-no-files-found: ignore
