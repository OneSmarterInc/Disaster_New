name: tmp-sim03-access-source

on:
  push:
    branches: ['fix/sim03-access-and-e2e']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim03-access-and-e2e
      - name: Patch committed student source
        shell: python
        run: |
          from pathlib import Path
          p=Path('sim03/public/index.html')
          s=p.read_text()
          old="let ACCESS_CODE=(function(){const m=(location.hash+location.search).match(/code=([^&]+)/);return m?decodeURIComponent(m[1]):null})();"
          new="let ACCESS_CODE=(function(){const m=(location.hash+location.search).match(/code=([^&]+)/);return m?decodeURIComponent(m[1]):(sessionStorage.getItem('m03-access')||null)})();\nif(ACCESS_CODE)sessionStorage.setItem('m03-access',ACCESS_CODE);"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('ACCESS_CODE marker missing')
          old2="  catch(e){\n    app.innerHTML=`<main class=\"page\">${notice(e.message,true)}<div class=\"actions\"><button class=\"btn pri\" onclick=\"location.reload()\">Try again</button></div></main>`;\n    return;\n  }"
          new2="  catch(e){\n    if(e.code==='access_code_required'&&!LAUNCH_TOKEN){sessionStorage.removeItem('m03-access');location.replace(BASE+'/');return}\n    app.innerHTML=`<main class=\"page\">${notice(e.message,true)}<div class=\"actions\"><button class=\"btn pri\" onclick=\"location.reload()\">Try again</button></div></main>`;\n    return;\n  }"
          if old2 in s: s=s.replace(old2,new2,1)
          elif new2 not in s: raise SystemExit('init catch marker missing')
          p.write_text(s)

          p=Path('sim03/DEPLOYMENT.md')
          s=p.read_text()
          note="""\n## Standalone access code\n\nSet `ACCESS_CODE` on the Sim03 Vercel project for Production. Direct visitors to `https://rapidsims.flexee.org/sim03` are shown an access-code gate and the code is validated server-side before scenario copy loads. Faculty and students launched by the RapidSims platform use signed `LAUNCH_SECRET` tokens and do not need the standalone access code. Do not hard-code the code in Git.\n"""
          if '## Standalone access code' not in s: s += note
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sim03/public/index.html sim03/DEPLOYMENT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist Sim03 access in browser session"
          git push origin HEAD:fix/sim03-access-and-e2e
