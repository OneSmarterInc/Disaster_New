name: tmp-sim03-briefing-results
on:
  push:
    branches: ['fix/sim03-briefing-results']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim03-briefing-results
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply briefing and results patch
        run: python .github/scripts/sim03_briefing_results.py
      - name: Run Sim03 guards
        working-directory: sim03
        run: node build.js
      - name: Commit updated Sim03 source
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sim03
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Sim03 briefing exhibits and full results"
          git push origin HEAD:fix/sim03-briefing-results
