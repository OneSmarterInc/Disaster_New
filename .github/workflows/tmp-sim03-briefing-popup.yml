name: tmp-sim03-briefing-popup
on:
  push:
    branches: [ui/sim03-briefing-popup]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/sim03-briefing-popup
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply briefing popup
        run: python .github/scripts/sim03_briefing_popup.py
      - name: Run Sim03 tests
        run: npm --prefix sim03 test
      - name: Build Sim03
        run: npm --prefix sim03 run build
      - name: Run platform integration check
        run: node platform/tools/check-sim03-integration.js
      - name: Parse Sim03 browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('sim03/public/index.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>', text)
          assert scripts
          for i,s in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'sim03-browser-{i}.js'
              p.write_text(s)
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Assert briefing popup content
        run: |
          grep -q 'Read briefing packet' sim03/public/index.html
          grep -q 'Done reading' sim03/public/index.html
          grep -q 'Four people you work with' sim03/public/index.html
          grep -q 'What happens Tuesday' sim03/public/index.html
          grep -q 'peopleNote' sim03/lib/scenario.js
      - name: Commit briefing popup
        run: |
          git config user.name 'OneSmarterInc Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sim03/public/index.html sim03/lib/scenario.js
          git diff --cached --quiet && exit 0
          git commit -m 'Add first-page Midland briefing popup'
          git push origin HEAD:ui/sim03-briefing-popup
