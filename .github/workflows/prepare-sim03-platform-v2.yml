name: prepare-sim03-platform-v2

on:
  push:
    branches:
      - 'feature/sim03-platform-integration'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sim03-platform-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration changes
        run: python .github/scripts/prepare_sim03_platform.py
      - name: Commit integration changes
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add platform sim03
          if git diff --cached --quiet; then
            echo "No integration changes needed"
            exit 0
          fi
          git commit -m "Prepare Sim03 for platform catalogue integration"
          git push origin HEAD:feature/sim03-platform-integration
