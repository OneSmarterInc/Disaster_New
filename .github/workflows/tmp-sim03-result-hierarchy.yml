name: tmp-sim03-result-hierarchy
on:
  push:
    branches: ['fix/sim03-result-hierarchy']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim03-result-hierarchy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply outcome-first results patch
        run: |
          python .github/scripts/sim03_result_hierarchy.py
          python .github/scripts/sim03_result_hierarchy_followup.py
      - name: Run Sim03 guards
        working-directory: sim03
        run: node build.js
      - name: Commit updated Sim03 source
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sim03
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make Sim03 final results outcome-first"
          git push origin HEAD:fix/sim03-result-hierarchy
