name: materialize-sim03-source

on:
  push:
    branches:
      - 'fix/sim03-materialize-source'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim03-materialize-source
      - name: Patch final source details
        shell: python
        run: |
          from pathlib import Path
          p = Path('sim03/public/index.html')
          s = p.read_text()

          helper = """function friendlyError(code,status){
            const m={
              strategic_view_locked:'Your opening view was committed before Year 1 and can no longer be changed.',
              year1_locked:'Year 1 has already been committed and cannot be changed after its outcome is revealed.',
              year2_locked:'Year 2 has already been committed and cannot be changed after its events are revealed.',
              session_not_running:'Your instructor has not started the session yet.',
              session_paused:'Your instructor has paused the session.',
              captain_only:'Only your team captain can commit this choice.',
              not_joined:'Rejoin the session before continuing.'
            };
            return m[code]||'';
          }
          """
          marker = "const STEPS=['Brief','Position','View','Year 1','Outcome','Year 2','Events','Year 3','Buyers','Close'];\n\n"
          if 'function friendlyError(code,status)' not in s:
            if marker not in s:
              raise SystemExit('Could not find STEPS marker')
            s = s.replace(marker, marker + helper + '\n')

          old = "if(!r.ok){const e=new Error(d.message||d.error||`Server error ${r.status}`);e.code=d.error;throw e}"
          new = "if(!r.ok){const e=new Error(d.message||friendlyError(d.error,r.status)||`Server error ${r.status}`);e.code=d.error;throw e}"
          s = s.replace(old, new)

          old_brief = "  <p class=\"lede\">There is no score, rank, grade or hidden correct allocation. You will find out what happened, not how you \"did.\"</p>\n  ${sessionGate()}${nav({backOk:false,disabled:blocked()})}`);"
          new_brief = "  <p class=\"lede\">There is no score, rank, grade or hidden correct allocation. You will find out what happened, not how you \"did.\"</p>\n  <p class=\"hint\" style=\"margin-top:12px\">This sim assumes you have read the briefing packet your instructor posted before class.</p>\n  ${sessionGate()}${nav({backOk:false,disabled:blocked()})}`);"
          if 'briefing packet your instructor posted before class' not in s:
            if old_brief not in s:
              raise SystemExit('Could not find brief block to patch')
            s = s.replace(old_brief, new_brief)

          p.write_text(s)
      - name: Commit source HTML
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sim03/public/index.html sim03/public/instructor.html
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Finalize sim03 HTML source"
          git push origin HEAD:fix/sim03-materialize-source
