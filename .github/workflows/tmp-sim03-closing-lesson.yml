name: tmp-sim03-closing-lesson
on:
  push:
    branches: [content/sim03-closing-lesson]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/sim03-closing-lesson
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply closing lesson patch
        run: python .github/scripts/sim03_closing_lesson_patch.py
      - name: Assert scope
        run: |
          git diff --exit-code HEAD -- sim03/config/thresholds.json sim03/lib/scenario.js sim03/api/outcome.js sim03/api/session.js sim03/public/instructor.html
      - name: Run Sim03 tests
        run: npm --prefix sim03 test
      - name: Build Sim03
        run: npm --prefix sim03 run build
      - name: Run platform integration check
        run: node platform/tools/check-sim03-integration.js
      - name: Parse student browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('sim03/public/index.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>', text)
          assert scripts
          for i,s in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'sim03-closing-{i}.js'
              p.write_text(s)
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Assert closing lesson gating and print behavior
        run: |
          grep -q 'function closingLesson()' sim03/api/finish.js
          grep -q 'What this run was teaching you' sim03/api/finish.js
          grep -q 'closingLesson: closingLesson()' sim03/api/finish.js
          grep -q 'function closingLessonHTML()' sim03/public/index.html
          grep -q 'closingLesson=done.closingLesson' sim03/public/index.html
          grep -q 'run-complete' sim03/public/index.html
          grep -q 'header,.actions,.team,.run-complete' sim03/public/index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('sim03/public/index.html').read_text()
          # Lesson HTML is only inserted in the finished branch, after the reflection cards.
          finished=s.index('if(S.finished){')
          lesson=s.index('${closingLessonHTML()}', finished)
          reflections=s.index('Your reflections', finished)
          banner=s.index('run-complete', reflections)
          assert reflections < lesson < banner
          # The server-authored lesson text itself is not shipped in student HTML.
          assert 'You spent two years making choices before you knew which consequences would matter.' not in s
          PY
      - name: Commit closing lesson
        run: |
          git config user.name 'OneSmarterInc Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sim03/api/finish.js sim03/public/index.html sim03/build.js
          git diff --cached --quiet && exit 0
          git commit -m 'End Midland with a closing lesson'
          git push origin HEAD:content/sim03-closing-lesson
