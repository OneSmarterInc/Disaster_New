name: tmp-faculty-results-polish

on:
  push:
    branches: ['fix/faculty-results-polish']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/faculty-results-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Polish faculty result handling
        run: python .github/scripts/faculty_results_polish.py
      - name: Commit patch
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add platform/api/faculty.js platform/public/faculty.html platform/tools/check-faculty-student-results.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish faculty result visibility and course matching"
          git push origin HEAD:fix/faculty-results-polish
