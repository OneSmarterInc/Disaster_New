name: tmp-sim03-clear-team-management
on:
  push:
    branches: [ui/sim03-clear-team-management]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/sim03-clear-team-management
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply team-management clarity patch
        run: python .github/scripts/sim03_clear_team_management.py
      - name: Prove team engine and gameplay are untouched
        run: |
          git diff --exit-code HEAD -- \
            sim03/api/session.js sim03/lib/store.js sim03/lib/scenario.js \
            sim03/config/thresholds.json sim03/api/outcome.js sim03/api/finish.js \
            sim03/lib/closingLesson.js sim03/lib/guard.js sim03/api/health.js \
            sim03/public/launch.html platform/api/launch.js
      - name: Verify clear instructor controls
        run: |
          grep -Fq 'Who is together, and who leads?' sim03/public/instructor.html
          grep -Fq 'Captain · commits for team' sim03/public/instructor.html
          grep -Fq 'Make captain' sim03/public/instructor.html
          grep -Fq 'Create a new team…' sim03/public/instructor.html
          grep -Fq "action:'set_captain'" sim03/public/instructor.html
          grep -Fq "action:'group'" sim03/public/instructor.html
          grep -Fq 'Students who enter the same team name join the same group. One member will be the captain.' sim03/public/index.html
          ! grep -Fq 'class="cap"' sim03/public/instructor.html
          ! grep -Fq '<option value="">Keep</option>' sim03/public/instructor.html
      - name: Run Sim03 tests
        run: npm --prefix sim03 test
      - name: Run Sim03 build guards
        run: npm --prefix sim03 run build
      - name: Run platform integration
        run: node platform/tools/check-sim03-integration.js
      - name: Parse browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ['sim03/public/index.html','sim03/public/instructor.html']:
              text=Path(name).read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text)
              assert scripts, name
              for n,src in enumerate(scripts):
                  p=Path(tempfile.gettempdir())/f"{Path(name).stem}-{n}.js"
                  p.write_text(src)
                  subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit tested UI change
        run: |
          git config user.name 'OneSmarterInc Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sim03/public/instructor.html sim03/public/index.html sim03/build.js
          git diff --cached --quiet && exit 0
          git commit -m 'Make Sim03 team setup obvious'
          git push origin HEAD:ui/sim03-clear-team-management
