name: tmp-faculty-multiple-runs
on:
  push:
    branches: ['fix/faculty-multiple-run-counts']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/faculty-multiple-run-counts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply faculty multiple-run patch
        run: python .github/scripts/faculty_multiple_runs.py
      - name: Run faculty result checks
        working-directory: platform
        run: |
          node tools/check-faculty-student-results.js
          node tools/check-sim03-integration.js
      - name: Commit updated platform source
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add platform
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Track repeated student runs in faculty views"
          git push origin HEAD:fix/faculty-multiple-run-counts
