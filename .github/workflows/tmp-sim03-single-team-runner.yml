name: tmp-sim03-single-team-runner
on:
  push:
    branches: [feat/sim03-single-team-runner]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sim03-single-team-runner
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply single-runner patch
        run: python .github/scripts/sim03_single_team_runner.py
      - name: Assert unrelated Sim03 behavior untouched
        run: |
          git diff --exit-code HEAD -- \
            sim03/config/thresholds.json \
            sim03/lib/scenario.js \
            sim03/lib/store.js \
            sim03/lib/guard.js \
            sim03/lib/launch.js \
            sim03/lib/closingLesson.js \
            sim03/api/config.js \
            sim03/api/finish.js \
            sim03/api/health.js \
            platform/api/launch.js \
            platform/api/complete.js
      - name: Verify only intended source files changed
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'sim03/api/session.js','sim03/api/outcome.js','sim03/public/index.html',
            'sim03/public/instructor.html','sim03/tools/team-flow-check.js','sim03/tools/team-handler-check.js'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).split())
          unexpected=changed-allowed
          assert not unexpected, f'unexpected changed files: {sorted(unexpected)}'
          assert allowed <= changed, f'missing intended changes: {sorted(allowed-changed)}'
          PY
      - name: Run Sim03 tests
        run: npm --prefix sim03 test
      - name: Run Sim03 build guards
        run: npm --prefix sim03 run build
      - name: Run platform integration
        run: node platform/tools/check-sim03-integration.js
      - name: Parse student and instructor browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for rel in ['sim03/public/index.html','sim03/public/instructor.html']:
              text=Path(rel).read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text)
              assert scripts, rel
              for n,code in enumerate(scripts):
                  p=Path(tempfile.gettempdir())/(Path(rel).stem+f'-{n}.js')
                  p.write_text(code)
                  subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Explicit single-runner assertions
        run: |
          grep -q "case 'claim_lead':" sim03/api/session.js
          grep -q "team_lead_locked" sim03/api/session.js
          grep -q "team_lead_only" sim03/api/outcome.js
          grep -q "I will run this team" sim03/public/index.html
          grep -q "This browser will not advance through Midland" sim03/public/index.html
          grep -q "Submit my reflection" sim03/public/index.html
          grep -q "Students decide which one member runs the simulation" sim03/public/instructor.html
      - name: Commit tested change
        run: |
          git config user.name 'OneSmarterInc Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sim03/api/session.js sim03/api/outcome.js sim03/public/index.html sim03/public/instructor.html sim03/tools/team-flow-check.js sim03/tools/team-handler-check.js
          git diff --cached --quiet && exit 0
          git commit -m 'Make one student the Sim03 team runner'
          git push origin HEAD:feat/sim03-single-team-runner
