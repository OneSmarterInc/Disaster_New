name: Simulation audit checks
on:
  pull_request:
    paths:
      - 'platform/**'
      - 'sim/**'
      - 'sim-02/**'
      - 'sim03/**'
      - 'sim-plus-01/**'
      - 'tools/**'
      - '.github/workflows/simulation-audit-checks.yml'
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'sim/**'
      - 'sim-02/**'
      - 'sim03/**'
      - 'sim-plus-01/**'
      - 'tools/**'
      - '.github/workflows/simulation-audit-checks.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Non-destructive registration and identity inventory
        run: |
          node platform/tools/register-check.js
          node platform/tools/sim-identity-check.js
          node sim-plus-01/test/identity.test.js
      - name: Original Disaster and Relay regression checks
        run: |
          for dir in sim sim-02; do (cd "$dir" && for check in tools/*-check.js; do node "$check"; done); done
          node platform/tools/protocol-check.js
          node tools/full-flow-check.js
          node tools/health-security-check.js
