name: tmp-sim03-team-ui-followup
on:
  push:
    branches: ['fix/sim03-team-ui-followup']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim03-team-ui-followup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply team UI follow-up
        run: python .github/scripts/sim03_team_ui_followup.py
      - name: Run Sim03 guards
        working-directory: sim03
        run: node build.js
      - name: Commit team UI source
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sim03
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish Sim03 non-captain team screens"
          git push origin HEAD:fix/sim03-team-ui-followup
