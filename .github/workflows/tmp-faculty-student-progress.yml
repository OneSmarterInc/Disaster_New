name: tmp-faculty-student-progress

on:
  push:
    branches: ['feature/faculty-student-progress-results']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/faculty-student-progress-results
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch faculty student progress and results
        shell: python
        run: |
          from pathlib import Path

          p=Path('platform/api/faculty.js')
          s=p.read_text()
          old="""        const roster = await s`\n          SELECT e.id AS enrolment_id, e.paid, e.paid_at, e.paid_note, e.dropped, e.created_at,\n                 u.id AS student_id, u.name, u.email, u.last_seen_at,\n                 (SELECT count(*) FROM launches l WHERE l.user_id = u.id AND l.course_id = e.course_id) AS launches\n          FROM enrolments e JOIN users u ON u.id = e.student_id\n          WHERE e.course_id = ${course.id}\n          ORDER BY e.dropped, u.name`;\n"""
          new="""        const roster = await s`\n          SELECT e.id AS enrolment_id, e.paid, e.paid_at, e.paid_note, e.dropped, e.created_at,\n                 u.id AS student_id, u.name, u.email, u.last_seen_at,\n                 (SELECT count(DISTINCT l.sim_id) FROM launches l\n                   WHERE l.user_id = u.id AND l.course_id = e.course_id AND l.as_role = 'student') AS started,\n                 (SELECT count(DISTINCT c2.sim_id) FROM completions c2\n                   WHERE c2.user_id = u.id\n                     AND (c2.course_id = e.course_id OR (c2.course_id IS NULL AND EXISTS (\n                       SELECT 1 FROM launches l2 WHERE l2.user_id = u.id AND l2.course_id = e.course_id\n                         AND l2.sim_id = c2.sim_id AND l2.as_role = 'student'\n                     )))) AS finished\n          FROM enrolments e JOIN users u ON u.id = e.student_id\n          WHERE e.course_id = ${course.id}\n          ORDER BY e.dropped, u.name`;\n"""
          if old not in s:
              if new not in s: raise SystemExit('course roster query marker missing')
          else:
              s=s.replace(old,new,1)

          marker="""      case 'update_course': {\n"""
          endpoint="""      // Student-centric progress across every simulation in one course. This is\n      // intentionally lazy-loaded from the roster so a large class does not pull every\n      // completion/transcript until the faculty member asks to see one student.\n      case 'student_results': {\n        await ensureTranscripts(s);\n        const course = await ownCourse(s, me.id, String(b.courseId || ''));\n        if (!course) return res.status(404).json({ error: 'no_such_course' });\n        const studentId = String(b.studentId || '');\n        const enrol = (await s`\n          SELECT e.*, u.name, u.email FROM enrolments e\n          JOIN users u ON u.id = e.student_id\n          WHERE e.course_id = ${course.id} AND e.student_id = ${studentId}`)[0];\n        if (!enrol) return res.status(404).json({ error: 'no_such_student' });\n\n        const rows = await s`\n          SELECT si.id AS sim_id, si.number, si.title, si.minutes,\n                 (SELECT count(*) FROM launches l\n                   WHERE l.user_id = ${studentId} AND l.course_id = ${course.id}\n                     AND l.sim_id = si.id AND l.as_role = 'student') AS starts,\n                 (SELECT count(*) FROM completions c3\n                   WHERE c3.user_id = ${studentId} AND c3.sim_id = si.id\n                     AND (c3.course_id = ${course.id} OR (c3.course_id IS NULL AND EXISTS (\n                       SELECT 1 FROM launches l3 WHERE l3.user_id = ${studentId}\n                         AND l3.course_id = ${course.id} AND l3.sim_id = si.id AND l3.as_role = 'student'\n                     )))) AS completions,\n                 cp.completed_at, cp.duration_seconds, cp.summary, cp.metrics,\n                 tr.recorded_at AS transcript_recorded_at, tr.envelope AS transcript\n          FROM course_sims cs\n          JOIN sims si ON si.id = cs.sim_id\n          LEFT JOIN LATERAL (\n            SELECT * FROM completions c2\n            WHERE c2.user_id = ${studentId} AND c2.sim_id = si.id\n              AND (c2.course_id = ${course.id} OR c2.course_id IS NULL)\n            ORDER BY (c2.course_id = ${course.id}) DESC, c2.completed_at DESC LIMIT 1\n          ) cp ON true\n          LEFT JOIN LATERAL (\n            SELECT recorded_at, envelope FROM transcripts t\n            WHERE t.user_id = ${studentId} AND t.sim_id = si.id\n              AND (t.course_id = ${course.id} OR t.course_id IS NULL)\n            ORDER BY (t.course_id = ${course.id}) DESC, t.recorded_at DESC LIMIT 1\n          ) tr ON true\n          WHERE cs.course_id = ${course.id}\n          ORDER BY si.number NULLS LAST, cs.added_at`;\n\n        return res.status(200).json({\n          course: { id: course.id, title: course.title },\n          student: { id: enrol.student_id, name: enrol.name, email: enrol.email, dropped: enrol.dropped },\n          rows\n        });\n      }\n\n"""
          if "case 'student_results':" not in s:
              if marker not in s: raise SystemExit('faculty endpoint insertion marker missing')
              s=s.replace(marker,endpoint+marker,1)
          p.write_text(s)

          p=Path('platform/public/faculty.html')
          s=p.read_text()
          old="""  view:'home', tab:'crs', data:null, simsOverview:null, course:null, progress:null,\n"""
          new="""  view:'home', tab:'crs', data:null, simsOverview:null, course:null, progress:null, studentResults:null,\n"""
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('faculty state marker missing')

          old="""async function openProgress(courseId, simId) {\n  try { F.progress = await api('/api/faculty', { action:'sim_progress', courseId, simId }); F.view = 'played'; F.err = null; }\n  catch (e) { F.err = e.message; }\n  render();\n}\n"""
          new="""async function openProgress(courseId, simId) {\n  try { F.progress = await api('/api/faculty', { action:'sim_progress', courseId, simId }); F.view = 'played'; F.err = null; }\n  catch (e) { F.err = e.message; }\n  render();\n}\nasync function openStudentResults(courseId, studentId) {\n  try { F.studentResults = await api('/api/faculty', { action:'student_results', courseId, studentId }); F.view = 'student-results'; F.err = null; }\n  catch (e) { F.err = e.message; }\n  render();\n}\n"""
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('openProgress marker missing')

          old="""  if (F.view === 'played' && F.progress) return renderPlayed();\n  if (F.view === 'course' && F.course) return renderCourse();\n"""
          new="""  if (F.view === 'played' && F.progress) return renderPlayed();\n  if (F.view === 'student-results' && F.studentResults) return renderStudentResults();\n  if (F.view === 'course' && F.course) return renderCourse();\n"""
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('render view marker missing')

          old="""      <thead><tr><th style=\"width:30px\"></th><th style=\"width:28%\">Student</th><th style=\"width:1%\">Access</th><th>Note</th>\n        <th class=\"num\">Joined</th><th class=\"num\">Played</th><th class=\"act\"></th></tr></thead>\n"""
          new="""      <thead><tr><th style=\"width:30px\"></th><th style=\"width:26%\">Student</th><th style=\"width:1%\">Access</th><th>Note</th>\n        <th class=\"num\">Joined</th><th class=\"num\">Started</th><th class=\"num\">Finished</th><th class=\"act\"></th></tr></thead>\n"""
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('roster header marker missing')

          old="""        <td data-l=\"Joined\" class=\"num\">${when(r.created_at)}</td>\n        <td data-l=\"Played\" class=\"num\">${r.launches || 0}</td>\n        <td data-l=\"\" class=\"act\">\n"""
          new="""        <td data-l=\"Joined\" class=\"num\">${when(r.created_at)}</td>\n        <td data-l=\"Started\" class=\"num\">${r.started || 0}</td>\n        <td data-l=\"Finished\" class=\"num\">${r.finished || 0}</td>\n        <td data-l=\"\" class=\"act\">\n          <button class=\"btn sm\" data-student-results=\"${esc(r.student_id)}\">Results</button>\n"""
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('roster data marker missing')

          s=s.replace("<tr><td colspan=\"7\" class=\"empty\">${roster.length ? 'Nobody matches that.' : 'Nobody has joined yet. Share the link above.'}</td></tr>", "<tr><td colspan=\"8\" class=\"empty\">${roster.length ? 'Nobody matches that.' : 'Nobody has joined yet. Share the link above.'}</td></tr>",1)

          marker="""  app.querySelectorAll('[data-prog]').forEach(b => b.onclick = () => openProgress(course.id, b.dataset.prog));\n"""
          extra=marker+"""  app.querySelectorAll('[data-student-results]').forEach(b => b.onclick = () => openStudentResults(course.id, b.dataset.studentResults));\n"""
          if "data-student-results]').forEach" not in s:
              if marker not in s: raise SystemExit('roster wiring marker missing')
              s=s.replace(marker,extra,1)

          marker="""/* ── who has played ─────────────────────────────────────────────────────── */\nfunction renderPlayed() {\n"""
          view="""/* ── one student's progress/results across the course ───────────────────── */\nfunction renderStudentResults() {\n  const { course, student, rows } = F.studentResults;\n  const started = rows.filter(r => Number(r.starts) > 0).length;\n  const finished = rows.filter(r => r.completed_at).length;\n  const mins = s => s ? Math.round(s/60) + ' min' : '—';\n  app.innerHTML = `\n    <div class=\"crumb\"><a id=\"backCourse\">← ${esc(course.title)}</a></div>\n    <div class=\"head\"><div><h1>${esc(student.name)}</h1><div class=\"sub\" style=\"font-size:12px;margin-top:5px\">${esc(student.email)}</div></div></div>\n    <div class=\"strip\">\n      <div class=\"cell\"><div class=\"n\">${rows.length}</div><div class=\"l\">Simulations</div></div>\n      <div class=\"cell\"><div class=\"n\">${started}</div><div class=\"l\">Started</div></div>\n      <div class=\"cell\"><div class=\"n\">${finished}</div><div class=\"l\">Finished</div></div>\n    </div>\n    <div class=\"section\"><span>Results</span><span style=\"font-family:var(--serif);text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink3)\">Latest result from each simulation</span></div>\n    <div class=\"panel\"><div class=\"tablewrap\"><table>\n      <thead><tr><th style=\"width:27%\">Simulation</th><th style=\"width:13%\">Status</th><th>What came back</th></tr></thead>\n      <tbody>${rows.length ? rows.map(r => {\n        const m = r.metrics || {};\n        const status = r.completed_at ? dot('ok','finished') : Number(r.starts) > 0 ? dot('warn','started') : dot('off','not started');\n        let summary = '';\n        if (r.summary) {\n          const raw = String(r.summary);\n          try {\n            const parsed = JSON.parse(raw);\n            if (parsed && typeof parsed === 'object') summary = `<details style=\"margin-top:10px\"><summary>Simulation summary</summary><pre style=\"white-space:pre-wrap;font:12px/1.5 var(--mono);margin-top:8px\">${esc(JSON.stringify(parsed,null,2))}</pre></details>`;\n            else summary = `<div class=\"sub\" style=\"margin-top:8px;white-space:pre-wrap\">${esc(raw)}</div>`;\n          } catch { summary = `<div class=\"sub\" style=\"margin-top:8px;white-space:pre-wrap\">${esc(raw)}</div>`; }\n        }\n        return `<tr>\n          <td data-l=\"Simulation\" style=\"vertical-align:top\"><div class=\"nm\">${esc(simLabel(r))}</div><div class=\"sub\">${Number(r.starts)||0} launch${Number(r.starts)===1?'':'es'}${Number(r.completions)>1?' · '+r.completions+' completions':''}</div></td>\n          <td data-l=\"Status\" style=\"vertical-align:top\">${status}${r.completed_at?`<div class=\"sub\" style=\"margin-top:5px\">${when(r.completed_at)} · ${mins(r.duration_seconds)}</div>`:''}</td>\n          <td data-l=\"What came back\" style=\"vertical-align:top\">\n            ${Object.keys(m).length ? `<div class=\"metrics\">${Object.entries(m).map(([k,v]) => `<div><span>${esc(k)}</span><b>${esc(typeof v==='object'?JSON.stringify(v):v)}</b></div>`).join('')}</div>` : ''}\n            ${summary}\n            ${r.transcript ? renderTranscript(r.transcript, r.transcript_recorded_at) : ''}\n            ${!Object.keys(m).length && !r.summary && !r.transcript ? `<span class=\"dim\" style=\"font-size:13.5px\">${r.completed_at ? 'Finished, but this simulation reported no result detail.' : Number(r.starts)>0 ? 'Started but has not reached the end yet.' : 'Not started.'}</span>` : ''}\n          </td>\n        </tr>`;\n      }).join('') : '<tr><td colspan=\"3\" class=\"empty\">No simulations are attached to this course.</td></tr>'}</tbody>\n    </table></div></div>`;\n  document.getElementById('backCourse').onclick = () => openCourse(course.id);\n}\n\n"""+marker
          if 'function renderStudentResults()' not in s:
              if marker not in s: raise SystemExit('student results view insertion marker missing')
              s=s.replace(marker,view,1)

          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "OneSmarterInc Bot"
          git config user.email "actions@users.noreply.github.com"
          git add platform/api/faculty.js platform/public/faculty.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show student-wise progress and results to faculty"
          git push origin HEAD:feature/faculty-student-progress-results
