name: tmp-sim03-single-runner-hardening
on:
  push:
    branches: [feat/sim03-single-team-runner]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sim03-single-team-runner
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply hardening patch
        run: python .github/scripts/sim03_single_runner_hardening.py
      - name: Run Sim03 tests
        run: npm --prefix sim03 test
      - name: Run Sim03 build guards
        run: npm --prefix sim03 run build
      - name: Run platform integration
        run: node platform/tools/check-sim03-integration.js
      - name: Parse browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          for rel in ['sim03/public/index.html','sim03/public/instructor.html']:
              text=Path(rel).read_text(); scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text); assert scripts
              for n,code in enumerate(scripts):
                  p=Path(tempfile.gettempdir())/f'sim03-single-runner-{n}.js';p.write_text(code);subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Assert runner-first contract
        run: |
          grep -q "team_run_not_complete" sim03/api/session.js
          grep -q "team_run_not_complete" sim03/api/finish.js
          grep -q "your team can decide which one student will run the simulation" sim03/public/index.html
          grep -q "Only one browser runs this simulation" sim03/public/index.html
      - name: Assert unrelated files untouched by hardening
        run: |
          git diff --exit-code HEAD -- sim03/config/thresholds.json sim03/lib/scenario.js sim03/api/health.js platform/api/launch.js
      - name: Commit hardening
        run: |
          git config user.name 'OneSmarterInc Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sim03/api/session.js sim03/api/finish.js sim03/public/index.html sim03/tools/team-flow-check.js sim03/tools/team-handler-check.js
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce runner-first team reflections'
          git push origin HEAD:feat/sim03-single-team-runner
