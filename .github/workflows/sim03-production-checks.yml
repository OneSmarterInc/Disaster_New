name: Sim03 production checks
on:
  pull_request:
    paths:
      - 'sim-03/**'
      - '.github/workflows/sim03-production-checks.yml'
  push:
    branches: [main]
    paths:
      - 'sim-03/**'
      - '.github/workflows/sim03-production-checks.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim-03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run playtest
