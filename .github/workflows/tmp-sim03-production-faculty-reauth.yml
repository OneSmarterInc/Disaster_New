name: tmp-sim03-production-faculty-reauth
on:
  push:
    branches: [fix/sim03-production-faculty-reauth]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim03-production-faculty-reauth
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/sim03_production_faculty_reauth.py
      - name: Verify scope
        run: |
          git diff --exit-code HEAD -- sim03/api/session.js sim03/lib/store.js sim03/config/thresholds.json sim03/lib/scenario.js sim03/api/outcome.js sim03/api/finish.js platform/api/launch.js
      - name: Verify intended source markers
        run: |
          grep -q "platform+'/api/launch?'" sim03/public/index.html
          grep -q "opened without RapidSims faculty authorization" sim03/public/instructor.html
          grep -q "direct instructor page cannot create without faculty authorization" platform/tools/sim03-account-entry-browser-check.js
          ! grep -q "location.assign(BASE+'/instructor.html#lt='" sim03/public/index.html
      - name: Run Sim03 unit and build checks
        run: |
          npm --prefix sim03 test
          npm --prefix sim03 run build
      - name: Run platform integration
        run: node platform/tools/check-sim03-integration.js
      - name: Parse changed browser JavaScript
        run: |
          node --check platform/tools/sim03-account-entry-browser-check.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ['sim03/public/index.html','sim03/public/instructor.html']:
              text=Path(name).read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text)
              assert scripts, name
              for i,code in enumerate(scripts):
                  p=Path(tempfile.gettempdir())/f'{Path(name).stem}-{i}.js'
                  p.write_text(code)
                  subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit fix
        run: |
          git config user.name 'OneSmarterInc Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sim03/public/index.html sim03/public/instructor.html platform/tools/sim03-account-entry-browser-check.js
          git diff --cached --quiet && exit 0
          git commit -m 'Harden Midland faculty session authorization flow'
          git push origin HEAD:fix/sim03-production-faculty-reauth
