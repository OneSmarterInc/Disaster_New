</style></head><body><header><h1>Midland Equipment</h1><div class="sub">Instructor view · RapidSim 03</div><span id="hs" class="status"></span></header><main id="app" class="page"></main><script>
const app=document.getElementById('app');function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}
const BASE=(location.pathname.match(/^\/sim-?\d+/)||[''])[0];
const FACULTY_TOKEN_KEY='m03-faculty-lt';
const incomingLT=new URLSearchParams(location.hash.slice(1)).get('lt')||new URLSearchParams(location.search).get('lt')||null;
let LT=incomingLT||sessionStorage.getItem(FACULTY_TOKEN_KEY)||null;
if(incomingLT)sessionStorage.setItem(FACULTY_TOKEN_KEY,incomingLT);
if(incomingLT){let p=new URLSearchParams(location.search);p.delete('lt');history.replaceState(null,'',location.pathname+(p.toString()?'?'+p:''))}
const savedCode=(location.hash||'').replace('#','')||localStorage.getItem('m03-faculty-session')||'';let facultyCode='',mode='',code='',state=null,poll=null,error='',aSel='',bSel='',presentIndex=0,advancedOpen=false;
let draftName='Midland Equipment',draftResume=savedCode,busy=false,authProblem=false,courseChoices=[],renewing=null;
const launchPreference=new URLSearchParams(location.search).get('play');
if(['team','individual'].includes(launchPreference))mode=launchPreference;
const FACULTY_COURSE_KEY='m03-faculty-course';
const PLATFORM_LAUNCH_PATH='/api/launch';
function attr(value){return esc(value).replaceAll('"','&quot;')}
const facultyDashboard=BASE?'/faculty.html':'https://rapidsims.flexee.org/faculty.html';
function tokenInfo(token){try{return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(token.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))))}catch{return null}}
// This metadata only selects a class for reauthorization. The platform checks
// its signed-in user and course ownership; the sim still verifies the signature.
let facultyCourse=new URLSearchParams(location.search).get('course')||tokenInfo(LT)?.course||sessionStorage.getItem(FACULTY_COURSE_KEY)||'';
function rememberCourse(value){facultyCourse=String(value||'');if(facultyCourse)sessionStorage.setItem(FACULTY_COURSE_KEY,facultyCourse);else sessionStorage.removeItem(FACULTY_COURSE_KEY);const u=new URL(location.href);if(facultyCourse)u.searchParams.set('course',facultyCourse);else u.searchParams.delete('course');history.replaceState(null,'',u.pathname+u.search+u.hash)}
if(incomingLT)rememberCourse(tokenInfo(incomingLT)?.course||'');
function captureDraft(){draftName=document.getElementById('name')?.value??draftName;draftResume=document.getElementById('resumeCode')?.value??draftResume;facultyCode=document.getElementById('fc')?.value.trim()??facultyCode}
function recoveryLink(){return `<div class="actions"><a class="btn" id="facultyRecovery" href="${esc(facultyDashboard+(facultyCourse?'?course='+encodeURIComponent(facultyCourse):''))}" target="_blank" rel="noopener">Open faculty dashboard</a></div>`}
async function renewFaculty(){
  if(renewing)return renewing;
  renewing=(async()=>{
    if(!BASE)throw new Error('Open this session from your RapidSims faculty dashboard, or enter your configured standalone facilitator code.');
    const q=new URLSearchParams({sim:'rapid-03-midland',mode:'session',format:'json'});if(facultyCourse)q.set('course',facultyCourse);
    const r=await fetch(PLATFORM_LAUNCH_PATH+'?'+q,{credentials:'same-origin',cache:'no-store'});let d={};try{d=await r.json()}catch{}
    if(d.error==='course_selection_required'){courseChoices=Array.isArray(d.courses)?d.courses:[];throw new Error('Choose the course for this session, then try again.')}
    if(r.status===401)throw new Error('Sign in to your faculty account from the dashboard, then return here and try again. Your session details have been kept.');
    if(!r.ok)throw new Error(d.message||'Unable to renew faculty access. Open your faculty dashboard and try again.');
    let token=null;try{const u=new URL(d.url,location.origin);token=new URLSearchParams(u.hash.slice(1)).get('lt')||u.searchParams.get('lt')}catch{}
    const info=tokenInfo(token);
    if(!info||info.sim!=='rapid-03-midland'||!['faculty','faculty_preview'].includes(info.role)||info.mode!=='session')throw new Error('Sign in with a faculty account to create or manage a class session.');
    LT=token;sessionStorage.setItem(FACULTY_TOKEN_KEY,LT);rememberCourse(info.course||'');courseChoices=[];
  })();
  try{return await renewing}finally{renewing=null}
}
function showAuthProblem(message){authProblem=true;error=message;clearInterval(poll);const box=document.getElementById('faculty-error');if(box)box.innerHTML=notice(message,true)+recoveryLink()}

function safeToRerender(){const el=document.activeElement;return !el||el.readOnly||el.disabled||!['INPUT','TEXTAREA','SELECT'].includes(el.tagName)}
function captureUiState(){const adv=document.querySelector('details.advanced');if(adv)advancedOpen=adv.open}
async function api(x){
  async function send(){const usedToken=LT,h={'Content-Type':'application/json'};if(usedToken)h['x-launch-token']=usedToken;const r=await fetch(BASE+'/api/session',{method:'POST',headers:h,body:JSON.stringify({...x,facultyCode,launchToken:usedToken})});let d={};try{d=await r.json()}catch{}return {r,d,usedToken}}
  if(!facultyCode&&(!LT||(BASE&&tokenInfo(LT)?.mode!=='session'))){try{await renewFaculty()}catch(e){showAuthProblem(e.message);throw e}}
  let result=await send();
  if(result.d.error==='faculty_authorization_required'&&!facultyCode){
    try{
      // Another overlapping poll may already have renewed this token.
      if(LT===result.usedToken){await renewFaculty()}
      result=await send();
    }catch(e){showAuthProblem(e.message);throw e}
  }
  const {r,d}=result;
  if(!r.ok){
    if(d.error==='faculty_authorization_required'){
      const message=facultyCode?'That facilitator code was not accepted. Check the code, or open the session from your faculty dashboard.':'The simulation could not verify your renewed faculty access. Open your faculty dashboard and try again. If it continues, the platform and simulation launch configuration needs checking.';
      sessionStorage.removeItem(FACULTY_TOKEN_KEY);LT=null;showAuthProblem(message);throw new Error(message);
    }
    throw new Error(d.message||d.error||`Server error ${r.status}`);
  }
  if(authProblem){authProblem=false;error='';const box=document.getElementById('faculty-error');if(box)box.innerHTML=''}
  return d;
}
const notice=(s,b=false)=>`<div class="notice ${b?'bad':''}">${esc(s)}</div>`;const vals=o=>Object.values(o||{}).filter(Boolean);function stablePeople(list){return list.slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)||String(a.name||'').localeCompare(String(b.name||''))||String(a.id||'').localeCompare(String(b.id||'')))}const participants=()=>stablePeople(vals(state?.participants)),runs=()=>vals(state?.runs).sort((a,b)=>String(a.runId||'').localeCompare(String(b.runId||'')));
function render(){document.getElementById('hs').textContent=state?`${state.session.state} · ${state.session.mode}`:'';code?consoleView():createView()}
function createView(){app.innerHTML=`<div class="ey">New facilitated session</div><h2>Choose how this room will play.</h2><p class="lede">Individual and team are both first-class modes. There is deliberately no default.</p>${error?notice(error,true):''}${authProblem?recoveryLink():''}<div class="grid"><section class="card"><h3>Session</h3><div class="field"><label>Class / session name</label><input id="name" value="${attr(draftName)}"></div><div class="field"><label>Play mode — required</label><div class="modes"><div class="mode ${mode==='individual'?'on':''}" data-mode="individual"><b>Individual</b><span>Every student commits a portfolio.</span></div><div class="mode ${mode==='team'?'on':''}" data-mode="team"><b>Team</b><span>Students join unassigned; you create teams, then each team decides who will run the simulation.</span></div></div></div>${courseChoices.length?`<div class="field"><label for="facultyCourse">Course for this session</label><select id="facultyCourse"><option value="">Choose course</option>${courseChoices.map(c=>`<option value="${attr(c.id)}" ${facultyCourse===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div>`:''}${LT?notice('Faculty authorization received from RapidSims.'):`${notice(BASE?'Your signed-in faculty account will be checked when you create or resume a session. A separate code is not needed.':'Open the faculty dashboard to use your account, or enter your configured standalone facilitator code.')}<div class="field"><label for="fc">Standalone facilitator code (code-based access only)</label><input id="fc" type="password" value="${attr(facultyCode)}" autocomplete="off"></div>`}<div class="actions"><button class="btn pri" id="create" ${mode&&!busy?'':'disabled'}>${busy?'Please wait…':'Create session'}</button></div><div class="field"><label>Resume session code</label><input id="resumeCode" maxlength="5" value="${attr(draftResume)}" placeholder="ABCDE"></div><div class="actions"><button class="btn" id="resumeBtn" ${busy?'disabled':''}>Resume session</button></div></section><section class="card"><h3>Instructor flow</h3><p>1. Create the room. 2. Share the student link. 3. Wait until students show as joined. 4. Auto split teams. 5. Choose one team lead / runner per team and Start.</p>${notice(mode==='team'?'Team mode is selected from your course page. Groups are created only here by faculty, not by students.':'Individual mode gives every student their own run.')}</section></div>`;document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{if(busy)return;captureDraft();mode=x.dataset.mode;render()});document.getElementById('create').onclick=create;document.getElementById('resumeBtn').onclick=resumeSession;const choice=document.getElementById('facultyCourse');if(choice)choice.onchange=()=>rememberCourse(choice.value)}
async function create(){if(busy)return;captureDraft();busy=true;error='';render();try{const d=await api({action:'create',name:draftName.trim(),mode});code=d.session.code;location.hash=code;localStorage.setItem('m03-faculty-session',code);state={session:d.session,participants:{},runs:{},defaultThresholds:d.session.thresholds};startPoll()}catch(e){error=e.message}finally{busy=false;render()}}
async function resumeSession(){if(busy)return;captureDraft();const v=(draftResume||'').trim().toUpperCase();if(!v){error='Enter the five-character session code to resume.';render();return}busy=true;error='';render();try{const next=await api({action:'faculty_state',code:v});code=v;state=next;location.hash=code;localStorage.setItem('m03-faculty-session',code);startPoll()}catch(e){error=e.message;code=''}finally{busy=false;render()}}

let enrolmentData=null,enrolmentError='',enrolmentBusy=false,enrolmentFetched=0,enrolmentCode='';

function plural(n,w){return `${n} ${w}${n===1?'':'s'}`}
function nameList(list,limit=5){const arr=(list||[]).map(x=>x&&x.name).filter(Boolean);return arr.slice(0,limit).join(', ')+(arr.length>limit?` +${arr.length-limit} more`:'')}
function suggestedTeams(n){n=Number(n||0);if(n<=1)return 1;return Math.min(n,Math.max(2,Math.ceil(n/4)))}
function courseStats(){
  const data=enrolmentCode===code?enrolmentData:null,students=data?.students||[],joinedNow=participants(),joinedIds=new Set(joinedNow.map(p=>p.id));
  const released=students.filter(p=>p.accessReleased),joined=students.filter(p=>joinedIds.has(p.participantId));
  return {data,students,released,joined,waitingReleased:students.filter(p=>p.accessReleased&&!joinedIds.has(p.participantId)),waitingAccess:students.filter(p=>!p.accessReleased),joinedIds,joinedNow};
}
function flowPanel(s,ps,rs){
  const st=courseStats(),released=st.students.length?st.released.length:ps.length,waiting=st.waitingReleased.length,groups=teamGroups(ps),ready=teamReadiness(ps),done=rs.filter(r=>r.done).length;
  const joinText=st.students.length?`${ps.length} in this session${waiting?`; ${waiting} released but not joined`:''}`:`${ps.length} in this session`;
  return `<section class="card full flow-card"><div class="meta">Faculty guide</div><h3>Run the class in five steps</h3><div class="flow-steps">
    <div class="flow-step ${released?'done':'wait'}"><b>1. Release access</b><span>${released||0} released. Use the course button if anyone still needs access.</span></div>
    <div class="flow-step ${ps.length?'done':'wait'}"><b>2. Students open link</b><span>${esc(joinText)}. Only these names can be put into teams.</span></div>
    <div class="flow-step ${groups.length?'done':'wait'}"><b>3. Create groups</b><span>${groups.length?plural(groups.length,'team'):'Use Auto split after students join.'}</span></div>
    <div class="flow-step ${ready.ok?'done':'wait'}"><b>4. Choose runner</b><span>${ready.ok?'Each team has one runner/team lead.':'Pick one runner inside each team.'}</span></div>
    <div class="flow-step ${s.state!=='lobby'||done?'done':'wait'}"><b>5. Start and results</b><span>${done?plural(done,'run')+' complete':s.state==='lobby'?'Start after teams are ready.':'Results fill in below as teams finish.'}</span></div>
  </div>${waiting?notice(`${esc(nameList(st.waitingReleased))} ${waiting===1?'has':'have'} access but ${waiting===1?'has':'have'} not opened the student link yet, so ${waiting===1?'that name is':'those names are'} not available in team dropdowns.`,true):''}</section>`;

function currentAction(s,ps,rs){
  const st=courseStats(),ready=teamReadiness(ps),done=rs.filter(r=>r.done).length;
  if(s.state==='closed')return 'Session closed. Review results or export CSV.';
  if(s.mode==='team'){
    if(!ps.length)return 'Share the student link. Students must open it before teams can be created.';
    if(st.waitingReleased.length)return `${st.waitingReleased.length} released student${st.waitingReleased.length===1?' has':'s have'} not joined yet. They will not show in team dropdowns until they open the link.`;
    if(ready.unassigned.length)return 'Create teams from the joined students, or use Auto split teams.';
    if(ready.missingLead.length)return 'Choose one team lead / runner inside each team.';
    if(s.state==='lobby')return 'Teams are ready. Click Start when the class is ready.';
    if(!done)return 'The team lead / runner advances each group run. Other students see a read-only message.';
    return 'Group results are ready below.';

}

async function saveCal(){let thresholds={};document.querySelectorAll('.th').forEach(x=>thresholds[x.dataset.k]=Number(x.value));try{await api({action:'calibrate',code,thresholds});await refresh()}catch(e){alert(e.message)}}
function exportCsv(){const cols=['participant','team','run','strategic_view','y1_run','y1_uptime','y1_capacity','y1_connect','y1_features','y2_run','y2_uptime','y2_capacity','y2_connect','y2_features','year3_band','buyer_carrolton','buyer_ridge_hollow','buyer_corven','reflection_1','reflection_2'];const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const out=[];const rs=runs();if(state?.session?.mode==='team'){participants().forEach((p,i)=>{const r=rs.find(x=>x.runId===p.groupId)||{},mine=r.reflections?.[r.completedBy]||{reflection1:r.reflection1,reflection2:r.reflection2};out.push([p.name,p.teamLabel||p.groupId,i+1,r.strategicView,r.year1?.run,r.year1?.uptime,r.year1?.capacity,r.year1?.connect,r.year1?.features,r.year2?.run,r.year2?.uptime,r.year2?.capacity,r.year2?.connect,r.year2?.features,r.outcomes?.year3?.band,r.outcomes?.buyers?.carrolton?.interest,r.outcomes?.buyers?.ridge_hollow?.interest,r.outcomes?.buyers?.corven?.interest,mine.reflection1,mine.reflection2].map(q).join(','))})}else{rs.forEach((r,i)=>out.push(['','',i+1,r.strategicView,r.year1?.run,r.year1?.uptime,r.year1?.capacity,r.year1?.connect,r.year1?.features,r.year2?.run,r.year2?.uptime,r.year2?.capacity,r.year2?.connect,r.year2?.features,r.outcomes?.year3?.band,r.outcomes?.buyers?.carrolton?.interest,r.outcomes?.buyers?.ridge_hollow?.interest,r.outcomes?.buyers?.corven?.interest,r.reflection1,r.reflection2].map(q).join(',')))}const nl=String.fromCharCode(10),blob=new Blob([[cols.join(','),...out].join(nl)],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`midland-${code}.csv`;a.click();URL.revokeObjectURL(a.href)}render();
