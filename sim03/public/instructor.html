<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Midland Equipment — Instructor View</title><style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{--n:#0E1524;--p:#161E2E;--p2:#1D2637;--l:#2B3548;--l2:#3A4659;--b:#E8E4DA;--d:#8C95A8;--dd:#616B7E;--a:#F0A63C;--g:#75A98C;--r:#CE7C8D;--s:'Newsreader',Georgia,serif;--m:'IBM Plex Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--b);font-family:var(--s);line-height:1.5}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--l);background:rgba(14,21,36,.95)}header h1{font-size:18px;font-weight:500;margin:0 auto 0 0}.sub,.meta,.ey{font:10px var(--m);letter-spacing:.13em;text-transform:uppercase;color:var(--dd)}.ey{color:var(--a);margin-bottom:8px}.page{width:min(1280px,calc(100% - 32px));margin:auto;padding:34px 0 70px}h2{font-size:34px;font-weight:400;line-height:1.1;margin:0 0 12px}h3{font-size:22px;font-weight:400;margin:8px 0 10px}.lede{font-size:18px;color:#cbc8c0;max-width:800px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:24px}.card{grid-column:span 6;border:1px solid var(--l);background:var(--p);padding:18px}.full{grid-column:1/-1}.third{grid-column:span 4}.btn{border:1px solid var(--l2);padding:9px 13px;font:10.5px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--d)}.btn:hover{border-color:var(--b);color:var(--b)}.pri{background:var(--a);border-color:var(--a);color:#191206;font-weight:600}.danger{border-color:#7d4553;color:#d9a1ae}.btn:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.field{margin-top:14px}.field label{display:block;font:10px var(--m);letter-spacing:.11em;text-transform:uppercase;color:var(--dd);margin-bottom:6px}.field input,.field select,td input{width:100%;background:var(--n);border:1px solid var(--l2);padding:8px 9px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{border:1px solid var(--l2);padding:13px;cursor:pointer}.mode.on{border-color:var(--a);background:rgba(240,166,60,.07)}.mode b{display:block}.mode span{font-size:13px;color:var(--d)}.notice{border-left:2px solid var(--a);background:rgba(240,166,60,.05);padding:10px 13px;margin:14px 0;color:#cbc8c0}.bad{border-left-color:var(--r);color:#e1afba}.code{font:600 46px var(--m);color:var(--a);letter-spacing:.08em}.status{font:10px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--g)}table{width:100%;border-collapse:collapse;margin-top:11px}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}th{font:9px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--dd)}td{font-size:14px;color:#cbc8c0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{border:1px solid var(--l);background:var(--p2);padding:12px}.kpi b{display:block;font:600 26px var(--m);color:var(--a)}.kpi span{font:9px var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--dd)}.dist{display:grid;gap:9px}.drow{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}.bars{display:flex;gap:4px;align-items:flex-end;height:58px}.bar{flex:1;min-width:20px;border:1px solid #6d5228;background:rgba(240,166,60,.24);position:relative}.bar b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:10px var(--m);color:var(--d)}.bar span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:8px var(--m);color:var(--dd)}.scatter{position:relative;height:320px;margin:22px 14px 32px 38px;border-left:1px solid var(--l2);border-bottom:1px solid var(--l2)}.dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--a);border:2px solid var(--n);transform:translate(-50%,50%)}.axis{position:absolute;font:9px var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--dd)}.x{bottom:-27px;left:50%;transform:translateX(-50%)}.y{left:-36px;top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:left top}.bands{display:grid;gap:7px}.band{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:8px 0}.band b{font:600 20px var(--m);color:var(--a)}.warn{color:var(--r)!important}.contrast{display:grid;grid-template-columns:1fr 1fr;gap:10px}.runbox{border:1px solid var(--l);background:var(--p2);padding:14px}.sentence{font-size:17px;font-style:italic;margin:9px 0}.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.mini div{text-align:center;border:1px solid var(--l);padding:7px 3px}.mini b{display:block;font:600 16px var(--m);color:var(--a)}.mini span{font:7px var(--m);text-transform:uppercase;color:var(--dd)}.thresholds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.presentbar{display:flex;gap:8px;align-items:center;margin:12px 0}.present{position:fixed;inset:0;z-index:50;background:var(--n);padding:5vh 6vw;overflow:auto}.present .card{display:none;border:0;background:transparent;padding:0}.present .card.present-on{display:block!important}.present h2{font-size:64px}.present h3{font-size:44px}.present .scatter{height:58vh}.dotcount{position:absolute;transform:translate(-50%,50%);display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--a);color:#191206;font:600 11px var(--m);border:2px solid var(--n)}@media(max-width:900px){.card,.third{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)}.contrast,.thresholds,.modes{grid-template-columns:1fr}}
</style></head><body><header><h1>Midland Equipment</h1><div class="sub">Instructor view · RapidSim 03</div><span id="hs" class="status"></span></header><main id="app" class="page"></main><script>
const app=document.getElementById('app');function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}
const BASE=(location.pathname.match(/^\/sim-?\d+/)||[''])[0];let LT=(location.hash+location.search).match(/lt=([^&]+)/);LT=LT?decodeURIComponent(LT[1]):null;if(LT){let p=new URLSearchParams(location.search);p.delete('lt');history.replaceState(null,'',location.pathname+(p.toString()?'?'+p:''))}
const savedCode=(location.hash||'').replace('#','')||localStorage.getItem('m03-faculty-session')||'';let facultyCode='',mode='',code='',state=null,poll=null,error='',aSel='',bSel='',presentIndex=0;
function safeToRerender(){const el=document.activeElement;return !el||!['INPUT','TEXTAREA','SELECT'].includes(el.tagName)}
async function api(x){const h={'Content-Type':'application/json'};if(LT)h['x-launch-token']=LT;const r=await fetch(BASE+'/api/session',{method:'POST',headers:h,body:JSON.stringify({...x,facultyCode,launchToken:LT})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||d.error||`Server error ${r.status}`);return d}
const notice=(s,b=false)=>`<div class="notice ${b?'bad':''}">${esc(s)}</div>`;const vals=o=>Object.values(o||{}).filter(Boolean),participants=()=>vals(state?.participants),runs=()=>vals(state?.runs);
function render(){document.getElementById('hs').textContent=state?`${state.session.state} · ${state.session.mode}`:'';code?consoleView():createView()}
function createView(){app.innerHTML=`<div class="ey">New facilitated session</div><h2>Choose how this room will play.</h2><p class="lede">Individual and team are both first-class modes. There is deliberately no default.</p>${error?notice(error,true):''}<div class="grid"><section class="card"><h3>Session</h3><div class="field"><label>Class / session name</label><input id="name" value="Midland Equipment"></div><div class="field"><label>Play mode — required</label><div class="modes"><div class="mode ${mode==='individual'?'on':''}" data-mode="individual"><b>Individual</b><span>Every student commits a portfolio.</span></div><div class="mode ${mode==='team'?'on':''}" data-mode="team"><b>Team</b><span>Faculty groups participants; one captain commits.</span></div></div></div><div class="field"><label>Facilitator code, if required</label><input id="fc" type="password"></div><div class="actions"><button class="btn pri" id="create" ${mode?'':'disabled'}>Create session</button></div><div class="field"><label>Resume session code</label><input id="resumeCode" maxlength="5" value="${esc(savedCode)}" placeholder="ABCDE"></div><div class="actions"><button class="btn" id="resumeBtn">Resume session</button></div></section><section class="card"><h3>Instructor surface</h3><p>Join code, teams, captains, calibration, live progress, Year 1 distributions, Year 3 bands, Connect vs Uptime, anonymous contrasting runs, opening views and CSV export.</p>${notice(mode==='team'?'Students name their own teams when they join. You can move anyone or hand off captaincy at any time.':'Thresholds can change while this session is in the lobby. They lock when play starts.')}</section></div>`;document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{mode=x.dataset.mode;render()});document.getElementById('create').onclick=create;document.getElementById('resumeBtn').onclick=resumeSession}
async function create(){facultyCode=document.getElementById('fc').value.trim();try{let d=await api({action:'create',name:document.getElementById('name').value.trim(),mode});code=d.session.code;location.hash=code;localStorage.setItem('m03-faculty-session',code);state={session:d.session,participants:{},runs:{},defaultThresholds:d.session.thresholds};startPoll();render()}catch(e){error=e.message;render()}}
async function resumeSession(){facultyCode=document.getElementById('fc')?.value.trim()||facultyCode;const v=(document.getElementById('resumeCode')?.value||savedCode||'').trim().toUpperCase();if(!v)return;code=v;location.hash=code;localStorage.setItem('m03-faculty-session',code);try{state=await api({action:'faculty_state',code});startPoll();render()}catch(e){error=e.message;code='';render()}}
function startPoll(){clearInterval(poll);poll=setInterval(refresh,2000);refresh()}async function refresh(){if(!code)return;try{state=await api({action:'faculty_state',code});if(!document.body.classList.contains('present')&&safeToRerender())render()}catch(e){error=e.message}}
function consoleView(){const s=state.session,ps=participants(),rs=runs(),done=rs.filter(r=>r.done).length,join=location.origin+BASE+'/?session='+encodeURIComponent(code);app.innerHTML=`<div class="ey">Live session</div><div class="grid"><section class="card third"><div class="meta">Join code</div><div class="code">${esc(code)}</div><div class="field"><input id="join" value="${esc(join)}" readonly></div><div class="actions"><button class="btn" id="copy">Copy join link</button></div></section><section class="card third"><div class="meta">Mode</div><h3>${s.mode==='team'?'Team':'Individual'}</h3><p>${s.mode==='team'?'Students self-select teams at join. You can move members or hand off captaincy at any time.':'Each participant owns one run.'}</p></section><section class="card third"><div class="meta">State</div><h3>${esc(s.state)}${s.paused?' · paused':''}</h3><div class="actions">${controls(s)}</div></section><section class="card full"><div class="kpis"><div class="kpi"><b>${ps.length}</b><span>joined</span></div><div class="kpi"><b>${rs.length}</b><span>runs</span></div><div class="kpi"><b>${done}</b><span>complete</span></div><div class="kpi"><b>${rs.filter(r=>r.outcomes?.year3?.calibrationGap||r.outcomes?.year3?.band==='unresolved_calibration').length}</b><span>calibration gaps</span></div></div></section>${s.mode==='team'?teams(ps,s):''}${calibrate(s)}<div class="presentbar"><button class="btn pri" id="presentBtn">Present debrief</button><span class="meta">Projector mode · arrow keys page panels</span></div>${analytics(rs)}</div>`;wire()}
function controls(s){if(s.state==='lobby')return '<button class="btn pri" data-control="start">Start</button>';if(s.state==='running'&&!s.paused)return '<button class="btn" data-control="pause">Pause</button><button class="btn danger" data-control="close">Close</button>';if(s.state==='running'&&s.paused)return '<button class="btn pri" data-control="resume">Resume</button><button class="btn danger" data-control="close">Close</button>';return ''}
function teams(ps,s){const groups=[...new Set(ps.map(p=>p.groupId).filter(Boolean))];return `<section class="card full"><div class="meta">Team roster</div><h3>Teams and captains</h3><p>Students name their own teams at join. Faculty can move a student or hand off captaincy before or after start.</p>${ps.length?`<table><thead><tr><th>Participant</th><th>Team</th><th>Captain</th><th>Move</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.teamLabel||p.groupId||'Solo')}</td><td><input type="radio" name="cap-${esc(p.groupId||p.id)}" class="cap" data-pid="${p.id}" ${p.isCaptain?'checked':''}></td><td><select class="move" data-pid="${p.id}"><option value="">Keep</option>${groups.filter(g=>g!==p.groupId).map(g=>`<option value="${esc(g)}">${esc((ps.find(x=>x.groupId===g)?.teamLabel)||g)}</option>`).join('')}<option value="__solo__">Solo</option></select></td></tr>`).join('')}</tbody></table>`:notice('Waiting for participants to join.')}</section>`}
function calibrate(s){const t=s.thresholds||state.defaultThresholds||{},L={year1ConnectStrong:'Year 1 Connect strong ≥',heatUptimeStrong:'Heat wave Uptime strong ≥',heatUptimeMiddle:'Heat wave middle starts at ≥',competitorConnectStrong:'Competitor strong ≥',competitorConnectPilotMin:'Competitor pilot min',competitorConnectPilotMax:'Competitor pilot max',year3ConnectStrong:'Year 3 Connect strong ≥',year3CapacityStrong:'Year 3 Capacity strong ≥',year3ConnectPilotMin:'Year 3 pilot Connect min',year3ConnectPilotMax:'Year 3 pilot Connect max'};return `<section class="card full"><div class="meta">Calibration</div><h3>Outcome thresholds</h3><p>Stored with this session so they can change between sections without a deploy.</p><div class="thresholds">${Object.keys(L).map(k=>`<div class="field"><label>${esc(L[k])}</label><input class="th" data-k="${k}" type="number" min="0" max="6" value="${Number(t[k]??0)}" ${s.state!=='lobby'?'disabled':''}></div>`).join('')}</div><div class="actions"><button class="btn" id="saveCal" ${s.state!=='lobby'?'disabled':''}>Save calibration</button></div>${notice('Calibration note: Connect at the strong threshold with Capacity below the strong threshold is shown to students with the nearest authored pilot narrative and flagged here for review.')}</section>`}
function analytics(rs){return `<section class="card full"><div class="meta">Projector view</div><h2>What the room chose</h2><p class="lede">Debrief cue: the annual cap is the wall. Every million above Run displaced an architecture choice somewhere else.</p>${distribution(rs)}</section><section class="card"><div class="meta">Year 3 bands</div><h3>Where portfolios landed</h3>${bands(rs)}</section><section class="card"><div class="meta">Connect vs Uptime</div><h3>The argument in two axes</h3>${scatter(rs)}</section><section class="card full"><div class="meta">Contrasting runs</div><h3>Two anonymous positions side by side</h3>${contrast(rs)}</section><section class="card full"><div class="meta">Opening views + export</div><h3>What they said the company should become</h3>${sentences(rs)}<div class="actions"><button class="btn" id="export" ${rs.length?'':'disabled'}>Export CSV</button></div></section>`}
function distribution(rs){let q=rs.filter(r=>r.year1);if(!q.length)return notice('No Year 1 allocations submitted yet.');return `<div class="dist">${['run','uptime','capacity','connect','features'].map(k=>{let max=k==='run'?9:3,c=Array(max+1).fill(0);q.forEach(r=>c[r.year1[k]]++);let peak=Math.max(1,...c);return `<div class="drow"><div class="meta">${k}</div><div class="bars">${c.map((n,i)=>`<div class="bar" style="height:${Math.max(4,n/peak*48)}px"><b>${n||''}</b><span>${i}</span></div>`).join('')}</div></div>`}).join('')}</div>`}
function bands(rs){let c={strong:0,pilot:0,weak:0},gaps=0;rs.forEach(r=>{let b=r.outcomes?.year3?.band;if(b)c[b]=(c[b]||0)+1;if(r.outcomes?.year3?.calibrationGap)gaps++});return `<div class="bands">${Object.entries(c).map(([k,n])=>`<div class="band"><span>${esc(k)}</span><b>${n}</b></div>`).join('')}${gaps?`<div class="band"><span class="warn">calibration review</span><b class="warn">${gaps}</b></div>`:''}</div>`}
function scatter(rs){const raw=rs.filter(r=>r.outcomes?.year3?.cumulative).map(r=>r.outcomes.year3.cumulative);if(!raw.length)return notice('No Year 3 outcomes yet.');const groups={};raw.forEach(c=>{const k=`${c.connect}:${c.uptime}`;(groups[k]||={c,n:0}).n++});const p=Object.values(groups);return `<div class="scatter"><span class="axis x">Cumulative Connect →</span><span class="axis y">Cumulative Uptime →</span>${p.map(x=>{const size=18+Math.min(34,(x.n-1)*6);return `<span class="dotcount" aria-label="${x.n} runs at Connect ${x.c.connect}, Uptime ${x.c.uptime}" style="width:${size}px;height:${size}px;left:${x.c.connect/6*100}%;bottom:${x.c.uptime/6*100}%">${x.n}</span>`}).join('')}</div>`}
function mini(a){return `<div class="mini">${['run','uptime','capacity','connect','features'].map(k=>`<div><b>${a[k]}</b><span>${k}</span></div>`).join('')}</div>`}function runBox(r,n){return r?`<div class="runbox"><div class="meta">Anonymous run ${n}</div><div class="sentence">${esc(r.strategicView||'No opening sentence submitted.')}</div>${r.year1?mini(r.year1):''}<p>Year 3: ${esc(r.outcomes?.year3?.band||'not reached')}</p></div>`:'<div class="runbox">—</div>'}
function contrast(rs){if(!rs.length)return notice('No runs available.');if(!aSel)aSel=rs[0].runId;if(!bSel)bSel=rs[Math.min(1,rs.length-1)].runId;let opts=rs.map((r,i)=>`<option value="${esc(r.runId)}">Run ${i+1}</option>`).join(''),a=rs.find(r=>r.runId===aSel)||rs[0],b=rs.find(r=>r.runId===bSel)||rs[0];return `<div class="actions"><select id="as">${opts}</select><select id="bs">${opts}</select></div><div class="contrast">${runBox(a,rs.indexOf(a)+1)}${runBox(b,rs.indexOf(b)+1)}</div>`}
function sentences(rs){
  const x=rs.filter(r=>r.strategicView);
  if(!x.length)return notice('No opening sentences submitted yet.');
  return `<div class="contrast">${x.map((r,i)=>`<div class="runbox"><div class="meta">Anonymous run ${i+1}</div><div class="sentence">${esc(r.strategicView)}</div>${r.year1?mini(r.year1):'<p>Year 1 not submitted.</p>'}</div>`).join('')}</div>`;
}
function wire(){document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(document.getElementById('join').value);document.querySelectorAll('[data-control]').forEach(b=>b.onclick=async()=>{try{await api({action:'control',code,set:b.dataset.control});await refresh()}catch(e){alert(e.message)}});document.querySelectorAll('.cap').forEach(x=>x.onchange=async()=>{if(!x.checked)return;try{await api({action:'set_captain',code,participantId:x.dataset.pid});await refresh()}catch(e){alert(e.message)}});document.querySelectorAll('.move').forEach(x=>x.onchange=async()=>{if(!x.value)return;const assign={[x.dataset.pid]:x.value};try{await api({action:'group',code,assign});await refresh()}catch(e){alert(e.message)}});let sc=document.getElementById('saveCal');if(sc)sc.onclick=saveCal;let aa=document.getElementById('as'),bb=document.getElementById('bs');if(aa){aa.value=aSel;aa.onchange=()=>{aSel=aa.value;render()}}if(bb){bb.value=bSel;bb.onchange=()=>{bSel=bb.value;render()}}let ex=document.getElementById('export');if(ex)ex.onclick=exportCsv;let pb=document.getElementById('presentBtn');if(pb)pb.onclick=startPresent}
function startPresent(){document.body.classList.add('present');const cards=[...document.querySelectorAll('#app .card')].filter(x=>/Projector view|Year 3 bands|Connect vs Uptime|Contrasting runs/.test(x.textContent));if(!cards.length)return;presentIndex=Math.min(presentIndex,cards.length-1);const show=()=>{cards.forEach((c,i)=>c.classList.toggle('present-on',i===presentIndex))};show();const key=e=>{if(!document.body.classList.contains('present'))return;if(e.key==='Escape'){document.body.classList.remove('present');cards.forEach(c=>c.classList.remove('present-on'));document.removeEventListener('keydown',key);return}if(e.key==='ArrowRight'||e.key==='ArrowDown'){presentIndex=(presentIndex+1)%cards.length;show()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){presentIndex=(presentIndex-1+cards.length)%cards.length;show()}};document.addEventListener('keydown',key)}
async function saveCal(){let thresholds={};document.querySelectorAll('.th').forEach(x=>thresholds[x.dataset.k]=Number(x.value));try{await api({action:'calibrate',code,thresholds});await refresh()}catch(e){alert(e.message)}}
function exportCsv(){const cols=['participant','team','run','strategic_view','y1_run','y1_uptime','y1_capacity','y1_connect','y1_features','y2_run','y2_uptime','y2_capacity','y2_connect','y2_features','year3_band','reflection_1','reflection_2'];const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const out=[];const rs=runs();if(state?.session?.mode==='team'){participants().forEach((p,i)=>{const r=rs.find(x=>x.runId===p.groupId)||{},mine=r.reflections?.[p.id]||{};out.push([p.name,p.teamLabel||p.groupId,i+1,r.strategicView,r.year1?.run,r.year1?.uptime,r.year1?.capacity,r.year1?.connect,r.year1?.features,r.year2?.run,r.year2?.uptime,r.year2?.capacity,r.year2?.connect,r.year2?.features,r.outcomes?.year3?.band,mine.reflection1,mine.reflection2].map(q).join(','))})}else{rs.forEach((r,i)=>out.push(['','',i+1,r.strategicView,r.year1?.run,r.year1?.uptime,r.year1?.capacity,r.year1?.connect,r.year1?.features,r.year2?.run,r.year2?.uptime,r.year2?.capacity,r.year2?.connect,r.year2?.features,r.outcomes?.year3?.band,r.reflection1,r.reflection2].map(q).join(',')))}const nl=String.fromCharCode(10),blob=new Blob([[cols.join(','),...out].join(nl)],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`midland-${code}.csv`;a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
