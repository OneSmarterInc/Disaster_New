}.mode.on{border-color:var(--a);background:rgba(240,166,60,.07)}.mode b{display:block}.mode span{font-size:13px;color:var(--d)}.notice{border-left:2px solid var(--a);background:rgba(240,166,60,.05);padding:10px 13px;margin:14px 0;color:#cbc8c0}.bad{border-left-color:var(--r);color:#e1afba}.code{font:600 46px var(--m);color:var(--a);letter-spacing:.08em}.status{font:10px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--g)}table{width:100%;border-collapse:collapse;margin-top:11px}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}th{font:9px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--dd)}td{font-size:14px;color:#cbc8c0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{border:1px solid var(--l);background:var(--p2);padding:12px}.kpi b{display:block;font:600 26px var(--m);color:var(--a)}.kpi span{font:9px var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--dd)}.dist{display:grid;gap:9px}.drow{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}.bars{display:flex;gap:4px;align-items:flex-end;height:58px}.bar{flex:1;min-width:20px;border:1px solid #6d5228;background:rgba(240,166,60,.24);position:relative}.bar b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:10px var(--m);color:var(--d)}.bar span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:8px var(--m);color:var(--dd)}.scatter{position:relative;height:320px;margin:22px 14px 32px 38px;border-left:1px solid var(--l2);border-bottom:1px solid var(--l2)}.dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--a);border:2px solid var(--n);transform:translate(-50%,50%)}.axis{position:absolute;font:9px var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--dd)}.x{bottom:-27px;left:50%;transform:translateX(-50%)}.y{left:-36px;top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:left top}.bands{display:grid;gap:7px}.band{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:8px 0}.band b{font:600 20px var(--m);color:var(--a)}.band.data-room{border-left:2px solid var(--x);padding-left:10px}.band.data-room span,.band.data-room b{color:var(--x)}.buyer-dist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.buyer-dist .runbox h4{margin:0 0 8px;font-size:18px;font-weight:400}.interest-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:6px 0}.interest-row span{font:9px var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--dd)}.interest-row b{font:600 16px var(--m);color:var(--a)}.buyer-find{margin-top:12px;border-left:2px solid var(--x);padding:10px 12px;background:rgba(111,168,214,.06)}.warn{color:var(--r)!important}.contrast{display:grid;grid-template-columns:1fr 1fr;gap:10px}.runbox{border:1px solid var(--l);background:var(--p2);padding:14px}.sentence{font-size:17px;font-style:italic;margin:9px 0}.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.mini div{text-align:center;border:1px solid var(--l);padding:7px 3px}.mini b{display:block;font:600 16px var(--m);color:var(--a)}.mini span{font:7px var(--m);text-transform:uppercase;color:var(--dd)}.thresholds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.team-tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.team-tool{border:1px solid var(--l);background:var(--p2);padding:14px}.team-tool .field{margin-top:10px}.team-tool-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.team-tool-row .field{flex:1;min-width:120px}.team-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.team-card{border:1px solid var(--l2);background:var(--p2);padding:15px}.team-head{display:grid;grid-template-columns:1fr minmax(180px,.8fr);gap:12px;align-items:start}.team-head h3{margin:2px 0 0}.team-members{display:grid;gap:7px;margin-top:13px}.member-row{display:grid;grid-template-columns:1fr minmax(160px,.7fr);gap:10px;align-items:center;border-top:1px solid var(--l);padding-top:8px}.member-name b{display:block;font-weight:500;color:var(--b)}.member-name span{font:9px var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--dd)}.unassigned-block{border:1px solid #7d4553;background:rgba(206,124,141,.05);padding:14px;margin-top:14px}.unassigned-block h4{font-size:18px;font-weight:400;margin:0 0 8px}.unassigned-row{display:grid;grid-template-columns:1fr minmax(180px,.7fr);gap:10px;align-items:center;border-top:1px solid var(--l);padding:8px 0}.team-ready{border-left-color:var(--g)}.presentbar{display:flex;gap:8px;align-items:center;margin:12px 0}.present{position:fixed;inset:0;z-index:50;background:var(--n);padding:5vh 6vw;overflow:auto}.present .card{display:none;border:0;background:transparent;padding:0}.present .card.present-on{display:block!important}.present h2{font-size:64px}.present h3{font-size:44px}.present .scatter{height:58vh}.dotcount{position:absolute;transform:translate(-50%,50%);display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--a);color:#191206;font:600 11px var(--m);border:2px solid var(--n)}@media(max-width:900px){.card,.third{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)}.contrast,.thresholds,.modes,.team-tools,.team-board{grid-template-columns:1fr}.team-head,.member-row,.unassigned-row{grid-template-columns:1fr}}
</style></head><body><header><h1>Midland Equipment</h1><div class="sub">Instructor view · RapidSim 03</div><span id="hs" class="status"></span></header><main id="app" class="page"></main><script>
const app=document.getElementById('app');function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}
const BASE=(location.pathname.match(/^\/sim-?\d+/)||[''])[0];
const FACULTY_TOKEN_KEY='m03-faculty-lt';
const incomingLTMatch=(location.hash+location.search).match(/lt=([^&]+)/);
const incomingLT=incomingLTMatch?decodeURIComponent(incomingLTMatch[1]):null;
let LT=incomingLT||sessionStorage.getItem(FACULTY_TOKEN_KEY)||null;
if(incomingLT)sessionStorage.setItem(FACULTY_TOKEN_KEY,incomingLT);
if(incomingLT){let p=new URLSearchParams(location.search);p.delete('lt');history.replaceState(null,'',location.pathname+(p.toString()?'?'+p:''))}
const savedCode=(location.hash||'').replace('#','')||localStorage.getItem('m03-faculty-session')||'';let facultyCode='',mode='',code='',state=null,poll=null,error='',aSel='',bSel='',presentIndex=0;
function safeToRerender(){const el=document.activeElement;return !el||!['INPUT','TEXTAREA','SELECT'].includes(el.tagName)}
async function api(x){const h={'Content-Type':'application/json'};if(LT)h['x-launch-token']=LT;const r=await fetch(BASE+'/api/session',{method:'POST',headers:h,body:JSON.stringify({...x,facultyCode,launchToken:LT})});let d={};try{d=await r.json()}catch{}if(!r.ok){if(d.error==='faculty_authorization_required'&&LT){sessionStorage.removeItem(FACULTY_TOKEN_KEY);LT=null;throw new Error('Your faculty authorization has expired. Return to RapidSims and click Run a session again.')}throw new Error(d.message||d.error||`Server error ${r.status}`)}return d}
const notice=(s,b=false)=>`<div class="notice ${b?'bad':''}">${esc(s)}</div>`;const vals=o=>Object.values(o||{}).filter(Boolean),participants=()=>vals(state?.participants),runs=()=>vals(state?.runs);
function render(){document.getElementById('hs').textContent=state?`${state.session.state} · ${state.session.mode}`:'';code?consoleView():createView()}
function createView(){app.innerHTML=`<div class="ey">New facilitated session</div><h2>Choose how this room will play.</h2><p class="lede">Individual and team are both first-class modes. There is deliberately no default.</p>${error?notice(error,true):''}<div class="grid"><section class="card"><h3>Session</h3><div class="field"><label>Class / session name</label><input id="name" value="Midland Equipment"></div><div class="field"><label>Play mode — required</label><div class="modes"><div class="mode ${mode==='individual'?'on':''}" data-mode="individual"><b>Individual</b><span>Every student commits a portfolio.</span></div><div class="mode ${mode==='team'?'on':''}" data-mode="team"><b>Team</b><span>Students join unassigned; you create teams and choose one team lead.</span></div></div></div>${LT?notice('Faculty authorization received from RapidSims.'):'<div class="field"><label>Facilitator code, if required</label><input id="fc" type="password"></div>'}<div class="actions"><button class="btn pri" id="create" ${mode?'':'disabled'}>Create session</button></div><div class="field"><label>Resume session code</label><input id="resumeCode" maxlength="5" value="${esc(savedCode)}" placeholder="ABCDE"></div><div class="actions"><button class="btn" id="resumeBtn">Resume session</button></div></section><section class="card"><h3>Instructor surface</h3><p>Join code, teams, captains, calibration, live progress, Year 1 distributions, Year 3 bands, Connect vs Uptime, anonymous contrasting runs, opening views and CSV export.</p>${notice(mode==='team'?'In Team mode, students join unassigned. You assign teams and choose one team lead for each team before starting.':'Thresholds can change while this session is in the lobby. They lock when play starts.')}</section></div>`;document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{mode=x.dataset.mode;render()});document.getElementById('create').onclick=create;document.getElementById('resumeBtn').onclick=resumeSession}
async function create(){facultyCode=document.getElementById('fc')?.value.trim()||'';try{let d=await api({action:'create',name:document.getElementById('name').value.trim(),mode});code=d.session.code;location.hash=code;localStorage.setItem('m03-faculty-session',code);state={session:d.session,participants:{},runs:{},defaultThresholds:d.session.thresholds};startPoll();render()}catch(e){error=e.message;render()}}
async function resumeSession(){facultyCode=document.getElementById('fc')?.value.trim()||facultyCode;const v=(document.getElementById('resumeCode')?.value||savedCode||'').trim().toUpperCase();if(!v)return;code=v;location.hash=code;localStorage.setItem('m03-faculty-session',code);try{state=await api({action:'faculty_state',code});startPoll();render()}catch(e){error=e.message;code='';render()}}
function startPoll(){clearInterval(poll);poll=setInterval(refresh,2000);refresh()}async function refresh(){if(!code)return;try{state=await api({action:'faculty_state',code});if(!document.body.classList.contains('present')&&safeToRerender())render()}catch(e){error=e.message}}
function consoleView(){const s=state.session,ps=participants(),rs=runs(),done=rs.filter(r=>r.done).length,join=location.origin+BASE+'/?session='+encodeURIComponent(code);app.innerHTML=`<div class="ey">Live session</div><div class="grid"><section class="card third"><div class="meta">Join code</div><div class="code">${esc(code)}</div><div class="field"><input id="join" value="${esc(join)}" readonly></div><div class="actions"><button class="btn" id="copy">Copy join link</button></div></section><section class="card third"><div class="meta">Mode</div><h3>${s.mode==='team'?'Team':'Individual'}</h3><p>${s.mode==='team'?'Students join unassigned. You create teams, move members, and choose one team lead per team.':'Each participant owns one run.'}</p></section><section class="card third"><div class="meta">State</div><h3>${esc(s.state)}${s.paused?' · paused':''}</h3><div class="actions">${controls(s)}</div></section><section class="card full"><div class="kpis"><div class="kpi"><b>${ps.length}</b><span>joined</span></div><div class="kpi"><b>${rs.length}</b><span>runs</span></div><div class="kpi"><b>${done}</b><span>complete</span></div><div class="kpi"><b>${rs.filter(r=>r.outcomes?.year3?.band==='data_no_room').length}</b><span>data without room</span></div></div></section>${s.mode==='team'?teams(ps,s):''}${calibrate(s)}${readiness(s)}<div class="presentbar"><button class="btn pri" id="presentBtn">Present debrief</button><span class="meta">Projector mode · arrow keys page panels</span></div>${analytics(rs)}</div>`;wire()}
function teamGroups(ps){const by={};ps.filter(p=>p&&p.groupId).forEach(p=>{const g=by[p.groupId]||(by[p.groupId]={groupId:p.groupId,label:p.teamLabel||String(p.groupId).replace(/^team:/,'')||'Team',members:[]});if(p.teamLabel)g.label=p.teamLabel;g.members.push(p)});return Object.values(by).sort((a,b)=>String(a.label).localeCompare(String(b.label)))}
function teamReadiness(ps){const unassigned=ps.filter(p=>p&&!p.groupId),groups=teamGroups(ps),missingLead=groups.filter(g=>!g.members.some(m=>m.isCaptain));return {unassigned,groups,missingLead,ok:ps.length>0&&unassigned.length===0&&groups.length>0&&missingLead.length===0}}
function controls(s){if(s.state==='lobby'){if(s.mode==='team'){const ready=teamReadiness(participants());return `<button class="btn pri" data-control="start" ${ready.ok?'':'disabled'}>Start</button>`}return '<button class="btn pri" data-control="start">Start</button>'}if(s.state==='running'&&!s.paused)return '<button class="btn" data-control="pause">Pause</button><button class="btn danger" data-control="close">Close</button>';if(s.state==='running'&&s.paused)return '<button class="btn pri" data-control="resume">Resume</button><button class="btn danger" data-control="close">Close</button>';return ''}
function teamTargetOptions(groups,current){return `<option value="">Keep</option>${groups.filter(g=>g.groupId!==current).map(g=>`<option value="${esc(g.groupId)}">${esc(g.label)}</option>`).join('')}<option value="__unassigned__">Unassigned</option>`}
function teams(ps,s){const info=teamReadiness(ps),groups=info.groups,lobby=s.state==='lobby';let readiness='';if(!ps.length)readiness=notice('Waiting for students to join. Start will become available after teams are assigned.',true);else if(info.unassigned.length)readiness=notice(`${info.unassigned.length} student${info.unassigned.length===1?' is':'s are'} still unassigned. Assign everyone before Start.`,true);else if(info.missingLead.length)readiness=notice(`${info.missingLead.length} team${info.missingLead.length===1?' needs':'s need'} a team lead before Start.`,true);else readiness=`<div class="notice team-ready">${groups.length} team${groups.length===1?' is':'s are'} ready. Every student is assigned and every team has one lead.</div>`;const candidates=(info.unassigned.length?info.unassigned:ps).slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));const tool=`<div class="team-tools"><div class="team-tool"><div class="meta">Quick setup</div><h3>Auto split teams</h3><div class="team-tool-row"><div class="field"><label>Number of teams</label><input id="teamCount" type="number" min="1" max="${Math.max(1,ps.length)}" value="${Math.min(Math.max(1,Math.ceil(ps.length/4)),4)}"></div><button class="btn" id="autoSplit" ${!lobby||!ps.length?'disabled':''}>Auto split teams</button></div><p>Evenly distributes everyone who has joined. You can move people and change leads afterwards.</p></div><div class="team-tool"><div class="meta">Manual setup</div><h3>Create team</h3><div class="field"><label>Team name</label><input id="newTeamName" maxlength="40" placeholder="Team 1"></div><div class="field"><label>First member</label><select id="newTeamMember"><option value="">Choose student</option>${candidates.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div><div class="actions"><button class="btn" id="createTeam" ${!lobby||!ps.length?'disabled':''}>Create team</button></div></div></div>`;const unassigned=info.unassigned.length?`<div class="unassigned-block"><h4>Unassigned students · ${info.unassigned.length}</h4>${info.unassigned.map(p=>`<div class="unassigned-row"><div class="member-name"><b>${esc(p.name)}</b><span>Not assigned</span></div><select class="assign-member" data-pid="${esc(p.id)}" ${groups.length?'':'disabled'}><option value="">Assign to…</option>${groups.map(g=>`<option value="${esc(g.groupId)}">${esc(g.label)}</option>`).join('')}</select></div>`).join('')}</div>`:'';const cards=groups.map(g=>{const lead=g.members.find(m=>m.isCaptain);return `<div class="team-card"><div class="team-head"><div><div class="meta">Team</div><h3>${esc(g.label)}</h3></div><div class="field"><label>Team lead</label><select class="team-lead" data-gid="${esc(g.groupId)}">${g.members.map(m=>`<option value="${esc(m.id)}" ${m.isCaptain?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div></div><div class="team-members">${g.members.map(m=>`<div class="member-row"><div class="member-name"><b>${esc(m.name)}</b><span>${m.isCaptain?'Team lead':'Member'}</span></div><select class="move-member" data-pid="${esc(m.id)}">${teamTargetOptions(groups,g.groupId)}</select></div>`).join('')}</div><div class="actions"><button class="btn rename-team" data-gid="${esc(g.groupId)}" data-label="${esc(g.label)}">Rename team</button></div></div>`}).join('');return `<section class="card full"><div class="meta">Team allocation</div><h3>Who is on each team, and who leads it?</h3><p>Students only join the session. You control team membership and select exactly one team lead for each team.</p>${readiness}${tool}${unassigned}${cards?`<div class="team-board">${cards}</div>`:''}</section>`}
function calibrate(s){const t=s.thresholds||state.defaultThresholds||{},L={year1ConnectStrong:'Year 1 Connect strong ≥',heatUptimeStrong:'Heat wave Uptime strong ≥',heatUptimeMiddle:'Heat wave middle starts at ≥',competitorConnectStrong:'Competitor strong ≥',competitorConnectPilotMin:'Competitor pilot min',competitorConnectPilotMax:'Competitor pilot max',year3ConnectStrong:'Year 3 Connect strong ≥',year3CapacityStrong:'Year 3 Capacity strong ≥',year3ConnectPilotMin:'Year 3 pilot Connect min',year3ConnectPilotMax:'Year 3 pilot Connect max'};return `<section class="card full"><div class="meta">Calibration</div><h3>Outcome thresholds</h3><p>Stored with this session so they can change between sections without a deploy.</p><div class="thresholds">${Object.keys(L).map(k=>`<div class="field"><label>${esc(L[k])}</label><input class="th" data-k="${k}" type="number" min="0" max="6" value="${Number(t[k]??0)}" ${s.state!=='lobby'?'disabled':''}></div>`).join('')}</div><div class="actions"><button class="btn" id="saveCal" ${s.state!=='lobby'?'disabled':''}>Save calibration</button></div>${notice('Year 3 treats strong Connect with sub-strong Capacity as its own authored outcome: Data without room to run it.')}</section>`}
function readiness(s){const t=s.thresholds||state.defaultThresholds||{},y3=Number(t.year3ConnectStrong??5);return `<section class="card full"><div class="meta">Classroom readiness</div><h3>First-section decisions and debrief notes</h3><div class="contrast"><div class="runbox"><div class="meta">Year 3 Connect threshold</div><p><b>Current session: ${y3}</b>. First-section baseline: keep 5. If you intentionally lower strong Connect to 4, set Year 3 pilot max to 3 before saving.</p></div><div class="runbox"><div class="meta">Perfect-run debrief</div><p>They did not necessarily ship nothing visible. The stronger answer is: they built an architecture that passed every test, but almost all discretionary investment went into connectivity, resilience and capacity. At most $2M could have gone into visible Features. The management problem is that much of what made the architecture work was hard for the CEO to see until later consequences arrived.</p></div></div><div class="notice"><b>Before class:</b> post the briefing packet about one week out. Also run one real facilitated Team-mode rehearsal with 2–3 devices so platform launch, Upstash session state, captain commits, completion reporting and the instructor console are exercised together.</div></section>`}
function analytics(rs){return `<section class="card full"><div class="meta">Projector view</div><h2>What the room chose</h2><p class="lede">Debrief cue: the annual cap is the wall. Every million above Run displaced an architecture choice somewhere else.</p>${distribution(rs)}</section><section class="card"><div class="meta">Year 3 bands</div><h3>Where portfolios landed</h3>${bands(rs)}</section><section class="card"><div class="meta">Connect vs Uptime</div><h3>The argument in two axes</h3>${scatter(rs)}</section><section class="card full"><div class="meta">Buyer interest</div><h3>Three buyers, three different answers</h3>${buyerInterest(rs)}</section><section class="card full"><div class="meta">Contrasting runs</div><h3>Two anonymous positions side by side</h3>${contrast(rs)}</section><section class="card full"><div class="meta">Opening views + export</div><h3>What they said the company should become</h3>${sentences(rs)}<div class="actions"><button class="btn" id="export" ${rs.length?'':'disabled'}>Export CSV</button></div></section>`}
function distribution(rs){let q=rs.filter(r=>r.year1);if(!q.length)return notice('No Year 1 allocations submitted yet.');return `<div class="dist">${['run','uptime','capacity','connect','features'].map(k=>{let max=k==='run'?9:3,c=Array(max+1).fill(0);q.forEach(r=>c[r.year1[k]]++);let peak=Math.max(1,...c);return `<div class="drow"><div class="meta">${k}</div><div class="bars">${c.map((n,i)=>`<div class="bar" style="height:${Math.max(4,n/peak*48)}px"><b>${n||''}</b><span>${i}</span></div>`).join('')}</div></div>`}).join('')}</div>`}
function bands(rs){const c={strong:0,data_no_room:0,pilot:0,weak:0},labels={strong:'strong',data_no_room:'Data without room to run it',pilot:'pilot',weak:'weak'};rs.forEach(r=>{const b=r.outcomes?.year3?.band;if(Object.prototype.hasOwnProperty.call(c,b))c[b]++});return `<div class="bands">${Object.entries(c).map(([k,n])=>`<div class="band ${k==='data_no_room'?'data-room':''}"><span>${esc(labels[k])}</span><b>${n}</b></div>`).join('')}</div>`}
function buyerInterest(rs){const names=[['carrolton','Carrolton Systems'],['ridge_hollow','Ridge Hollow Partners'],['corven','Corven Building Systems']];const cards=names.map(([key,name])=>{const c={high:0,qualified:0,low:0};rs.forEach(r=>{const v=r.outcomes?.buyers?.[key]?.interest;if(v)c[v]=(c[v]||0)+1});return `<div class="runbox"><h4>${esc(name)}</h4>${['high','qualified','low'].map(k=>`<div class="interest-row"><span>${k}</span><b>${c[k]||0}</b></div>`).join('')}</div>`}).join('');const matches=rs.map((r,i)=>({r,i})).filter(x=>x.r.outcomes?.buyers?.corven?.interest==='high'&&x.r.outcomes?.buyers?.ridge_hollow?.interest==='low');return `<div class="buyer-dist">${cards}</div><div class="buyer-find"><div class="meta">Debate finder · Corven high / Ridge Hollow low</div>${matches.length?`<div class="actions">${matches.map(x=>`<button class="btn buyer-run" data-run="${esc(x.r.runId)}">Anonymous run ${x.i+1}</button>`).join('')}</div>`:'<p>No run has landed there yet.</p>'}</div>`}
function scatter(rs){const raw=rs.filter(r=>r.outcomes?.year3?.cumulative).map(r=>r.outcomes.year3.cumulative);if(!raw.length)return notice('No Year 3 outcomes yet.');const groups={};raw.forEach(c=>{const k=`${c.connect}:${c.uptime}`;(groups[k]||={c,n:0}).n++});const p=Object.values(groups);return `<div class="scatter"><span class="axis x">Cumulative Connect →</span><span class="axis y">Cumulative Uptime →</span>${p.map(x=>{const size=18+Math.min(34,(x.n-1)*6);return `<span class="dotcount" aria-label="${x.n} runs at Connect ${x.c.connect}, Uptime ${x.c.uptime}" style="width:${size}px;height:${size}px;left:${x.c.connect/6*100}%;bottom:${x.c.uptime/6*100}%">${x.n}</span>`}).join('')}</div>`}
function mini(a){return `<div class="mini">${['run','uptime','capacity','connect','features'].map(k=>`<div><b>${a[k]}</b><span>${k}</span></div>`).join('')}</div>`}function runBox(r,n){return r?`<div class="runbox"><div class="meta">Anonymous run ${n}</div><div class="sentence">${esc(r.strategicView||'No opening sentence submitted.')}</div>${r.year1?mini(r.year1):''}<p>Year 3: ${esc(r.outcomes?.year3?.band||'not reached')}</p></div>`:'<div class="runbox">—</div>'}
function contrast(rs){if(!rs.length)return notice('No runs available.');if(!aSel)aSel=rs[0].runId;if(!bSel)bSel=rs[Math.min(1,rs.length-1)].runId;let opts=rs.map((r,i)=>`<option value="${esc(r.runId)}">Run ${i+1}</option>`).join(''),a=rs.find(r=>r.runId===aSel)||rs[0],b=rs.find(r=>r.runId===bSel)||rs[0];return `<div class="actions"><select id="as">${opts}</select><select id="bs">${opts}</select></div><div class="contrast">${runBox(a,rs.indexOf(a)+1)}${runBox(b,rs.indexOf(b)+1)}</div>`}
function sentences(rs){
  const x=rs.filter(r=>r.strategicView);
  if(!x.length)return notice('No opening sentences submitted yet.');
  return `<div class="contrast">${x.map((r,i)=>`<div class="runbox"><div class="meta">Anonymous run ${i+1}</div><div class="sentence">${esc(r.strategicView)}</div>${r.year1?mini(r.year1):'<p>Year 1 not submitted.</p>'}</div>`).join('')}</div>`;
}
function wire(){document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(document.getElementById('join').value);document.querySelectorAll('[data-control]').forEach(b=>b.onclick=async()=>{try{await api({action:'control',code,set:b.dataset.control});await refresh()}catch(e){alert(e.message)}});document.querySelectorAll('.team-lead').forEach(x=>x.onchange=async()=>{try{await api({action:'set_captain',code,participantId:x.value});await refresh()}catch(e){alert(e.message)}});document.querySelectorAll('.move-member,.assign-member').forEach(x=>x.onchange=async()=>{if(!x.value)return;try{await api({action:'group',code,assign:{[x.dataset.pid]:x.value}});await refresh()}catch(e){alert(e.message)}});const auto=document.getElementById('autoSplit');if(auto)auto.onclick=async()=>{const n=Math.max(1,Math.min(participants().length,Number(document.getElementById('teamCount')?.value||1))),sorted=participants().slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)),assign={};sorted.forEach((p,i)=>assign[p.id]=`Team ${(i%n)+1}`);try{await api({action:'group',code,assign});await refresh()}catch(e){alert(e.message)}};const createTeam=document.getElementById('createTeam');if(createTeam)createTeam.onclick=async()=>{const label=(document.getElementById('newTeamName')?.value||'').trim(),pid=document.getElementById('newTeamMember')?.value||'';if(!label)return alert('Enter a team name.');if(!pid)return alert('Choose the first member of the team.');if(teamGroups(participants()).some(g=>g.label.trim().toLowerCase()===label.toLowerCase()))return alert('That team name is already in use.');try{await api({action:'group',code,assign:{[pid]:label}});await refresh()}catch(e){alert(e.message)}};document.querySelectorAll('.rename-team').forEach(b=>b.onclick=async()=>{const label=window.prompt('Rename team',b.dataset.label||'');if(label===null||!label.trim())return;try{await api({action:'rename_team',code,groupId:b.dataset.gid,teamLabel:label.trim()});await refresh()}catch(e){alert(e.message)}});let sc=document.getElementById('saveCal');if(sc)sc.onclick=saveCal;let aa=document.getElementById('as'),bb=document.getElementById('bs');if(aa){aa.value=aSel;aa.onchange=()=>{aSel=aa.value;render()}}if(bb){bb.value=bSel;bb.onchange=()=>{bSel=bb.value;render()}}document.querySelectorAll('.buyer-run').forEach(b=>b.onclick=()=>{aSel=b.dataset.run;render()});let ex=document.getElementById('export');if(ex)ex.onclick=exportCsv;let pb=document.getElementById('presentBtn');if(pb)pb.onclick=startPresent}
function startPresent(){document.body.classList.add('present');const cards=[...document.querySelectorAll('#app .card')].filter(x=>/Projector view|Year 3 bands|Connect vs Uptime|Buyer interest|Contrasting runs/.test(x.textContent));if(!cards.length)return;presentIndex=Math.min(presentIndex,cards.length-1);const show=()=>{cards.forEach((c,i)=>c.classList.toggle('present-on',i===presentIndex))};show();const key=e=>{if(!document.body.classList.contains('present'))return;if(e.key==='Escape'){document.body.classList.remove('present');cards.forEach(c=>c.classList.remove('present-on'));document.removeEventListener('keydown',key);return}if(e.key==='ArrowRight'||e.key==='ArrowDown'){presentIndex=(presentIndex+1)%cards.length;show()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){presentIndex=(presentIndex-1+cards.length)%cards.length;show()}};document.addEventListener('keydown',key)}
async function saveCal(){let thresholds={};document.querySelectorAll('.th').forEach(x=>thresholds[x.dataset.k]=Number(x.value));try{await api({action:'calibrate',code,thresholds});await refresh()}catch(e){alert(e.message)}}
function exportCsv(){const cols=['participant','team','run','strategic_view','y1_run','y1_uptime','y1_capacity','y1_connect','y1_features','y2_run','y2_uptime','y2_capacity','y2_connect','y2_features','year3_band','buyer_carrolton','buyer_ridge_hollow','buyer_corven','reflection_1','reflection_2'];const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const out=[];const rs=runs();if(state?.session?.mode==='team'){participants().forEach((p,i)=>{const r=rs.find(x=>x.runId===p.groupId)||{},mine=r.reflections?.[p.id]||{};out.push([p.name,p.teamLabel||p.groupId,i+1,r.strategicView,r.year1?.run,r.year1?.uptime,r.year1?.capacity,r.year1?.connect,r.year1?.features,r.year2?.run,r.year2?.uptime,r.year2?.capacity,r.year2?.connect,r.year2?.features,r.outcomes?.year3?.band,r.outcomes?.buyers?.carrolton?.interest,r.outcomes?.buyers?.ridge_hollow?.interest,r.outcomes?.buyers?.corven?.interest,mine.reflection1,mine.reflection2].map(q).join(','))})}else{rs.forEach((r,i)=>out.push(['','',i+1,r.strategicView,r.year1?.run,r.year1?.uptime,r.year1?.capacity,r.year1?.connect,r.year1?.features,r.year2?.run,r.year2?.uptime,r.year2?.capacity,r.year2?.connect,r.year2?.features,r.outcomes?.year3?.band,r.outcomes?.buyers?.carrolton?.interest,r.outcomes?.buyers?.ridge_hollow?.interest,r.outcomes?.buyers?.corven?.interest,r.reflection1,r.reflection2].map(q).join(',')))}const nl=String.fromCharCode(10),blob=new Blob([[cols.join(','),...out].join(nl)],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`midland-${code}.csv`;a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
