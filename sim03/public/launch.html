<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening Midland Equipment…</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E1524;color:#E8E4DA;font-family:Georgia,serif}.box{max-width:560px;padding:28px}.ey{font:11px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#F0A63C}h1{font-weight:400}.muted{color:#8C95A8}</style></head><body><div class="box"><div class="ey">Flexee RapidSim 03</div><h1>Opening Midland Equipment…</h1><p class="muted">Routing you to the right simulation surface.</p></div><script>
const BASE=(location.pathname.match(/^\/sim-?\d+/)||[''])[0];
const raw=location.hash+location.search,match=raw.match(/lt=([^&]+)/);let launch=null,token=match?decodeURIComponent(match[1]):null;
if(token){try{launch=JSON.parse(atob(token.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')))}catch{launch=null}}
const faculty=launch&&(launch.role==='faculty'||launch.role==='faculty_preview')&&launch.mode==='session';
const params=new URLSearchParams(location.search);params.delete('lt');const q=params.toString();
const target=faculty?'/instructor.html':'/index.html';
location.replace(BASE+target+(q?'?'+q:'')+(token?'#lt='+encodeURIComponent(token):(location.hash||'')));
</script></body></html>
