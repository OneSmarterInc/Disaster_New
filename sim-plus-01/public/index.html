<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why Don’t They Have Any Patience? — RapidSims+</title>
<style>
:root{--paper:#f3f3ef;--card:#fff;--ink:#171914;--muted:#697064;--line:#d6d8d0;--accent:#b65f00;--ok:#2f7454;--bad:#9a312c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 Georgia,serif}
header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(24px,calc((100vw - 1180px)/2));justify-content:space-between}
.brand{font-weight:700}.brand i{color:var(--accent);font-weight:400}.mono,.eyebrow,button,label,.timer{font:12px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.11em;text-transform:uppercase}
main{max-width:1180px;margin:auto;padding:38px 24px 80px}.eyebrow{color:var(--muted);margin-bottom:9px}h1{font-size:42px;line-height:1.05;margin:0 0 12px;font-weight:400}h2{font-size:25px;font-weight:400;margin:0 0 14px}.lede{max-width:760px;font-size:20px;color:#42483f}
.card{background:var(--card);border:1px solid var(--line);padding:24px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.choice{cursor:pointer;text-align:left;background:#fff;border:1px solid var(--line);padding:20px}.choice:hover,.choice:focus{border-color:var(--accent)}button{border:1px solid var(--line);background:#fff;padding:12px 16px;cursor:pointer;color:var(--ink)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.timer{font-size:18px;color:var(--accent);white-space:nowrap}.bar{height:5px;background:#ddd;margin:14px 0 24px}.bar>i{display:block;height:100%;background:var(--ok)}
.chat{max-height:430px;overflow:auto;border:1px solid var(--line);background:#fff;padding:20px}.turn{margin:0 0 22px}.turn .who{font:11px ui-monospace,monospace;text-transform:uppercase;color:var(--muted);letter-spacing:.1em}.turn .q{color:var(--muted);margin:5px 0}.turn .a{font-size:18px;margin-top:5px;white-space:pre-wrap}
.ask{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}textarea,input,select{width:100%;border:1px solid var(--line);background:#fff;padding:13px;font:16px Georgia,serif}textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.report-row{display:grid;grid-template-columns:minmax(240px,1fr) 210px;gap:18px;align-items:center;padding:17px 0;border-bottom:1px solid var(--line)}.note{font-size:14px;color:var(--muted)}.error{border-left:3px solid var(--bad);padding:12px;color:var(--bad);background:#fff}.outcome{border-left:3px solid var(--accent);padding-left:16px;margin:20px 0}.hidden{display:none!important}
.narrow{max-width:800px;margin:auto}.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}.step{font-size:10px;color:var(--muted)}.step.current{color:var(--accent);border-color:var(--accent)}.pull{border-left:3px solid var(--accent);padding:14px 18px;background:#fff8ed}.notes{background:#20262e;color:#e7ecf5;border:1px solid #343d47}.notes h3{padding:14px 18px;margin:0;border-bottom:1px solid #343d47;font:11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em}.notes pre{padding:18px;margin:0;white-space:pre-wrap;font:12px/1.8 ui-monospace,monospace}.flag{color:#ffc46b}.chartbox{background:#fff;border:1px solid var(--line);padding:17px 20px}.chartbox h3{margin:0 0 7px;font:12px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em}.fields{display:flex;gap:25px;flex-wrap:wrap;font:12px ui-monospace,monospace;color:var(--muted)}.unknown{color:var(--accent)}.arrow{text-align:center;color:var(--accent);padding:7px}.instruments{display:flex;gap:14px;margin:20px 0}.instrument{flex:1;background:#fff;border:1px solid var(--line);padding:15px 18px}.instrument strong{font:27px ui-monospace,monospace}.desk{background:#20262e;border:1px solid #343d47;min-height:260px;display:flex;align-items:center;justify-content:center}.sheetwrap{position:relative;width:330px;height:190px}.sheet{position:absolute;inset:0;background:#e8e6de;color:#2a2c26;padding:15px 17px;font:11px/1.8 ui-monospace,monospace;box-shadow:0 8px 26px #0006}.sheet.under{transform:translate(16px,13px) rotate(1.6deg);opacity:0;transition:opacity .5s}.sheet.under.show{opacity:1}.sheethead{font-weight:bold;border-bottom:1px solid #888;padding-bottom:5px;margin-bottom:7px}.sheetrow{display:flex;justify-content:space-between}.observation-entry{margin-top:22px}
@media(max-width:700px){.grid,.report-row{grid-template-columns:1fr}h1{font-size:34px}.topline{display:block}.timer{margin-top:10px}.ask{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand">Flexee <i>RapidSims+</i></div><div class="mono">Individual simulation</div></header>
<main id="app"><div class="card">Loading your session…</div></main>
<script>
'use strict';
const app=document.getElementById('app');
const hash=new URLSearchParams(location.hash.slice(1));
const launch=hash.get('lt')||sessionStorage.getItem('simplus_lt')||'';
if(launch){sessionStorage.setItem('simplus_lt',launch);history.replaceState(null,'',location.pathname+location.search)}
let runId=localStorage.getItem('simplus_run');
if(!runId){runId=crypto.randomUUID();localStorage.setItem('simplus_run',runId)}
const prefix=location.pathname.startsWith('/simplus01')?'/simplus01':location.pathname.startsWith('/sim03')?'/sim03':'';
const API=prefix+'/api';
let state=null,reportRows=null,introStep=0,observationTimer=null;
let observationSeconds=Number(sessionStorage.getItem('simplus_observation'))||null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(path,body){
 const headers={'content-type':'application/json','x-run-id':runId};
 if(launch)headers['x-launch-token']=launch;
 const r=await fetch(API+path,{method:'POST',headers,body:JSON.stringify({...body,runId})});
 let data={};try{data=await r.json()}catch{}
 if(!r.ok){const e=new Error(data.detail||data.error||'Request failed');e.data=data;throw e}
 return data
}
function error(e){app.insertAdjacentHTML('afterbegin','<div class="error">'+esc(e.message)+'</div>')}
function render(){
 if(!state)return;
 if(state.state==='choosing')return sessionStorage.getItem('simplus_intro_done')==='1'?choose():intro();
 sessionStorage.setItem('simplus_intro_done','1');
 if(['open','closed','sealed'].includes(state.state))return interview();
 if(state.state==='finished')return report();
}
const INTRO=[
 {k:'Setting',h:'Wexford Benefit Administrators',b:'<p class="lede">Wexford administers dental benefits for self-funded employers. Around twelve hundred claims arrive every working day.</p><div class="card">Wexford is replacing its claims platform. The vendor’s configuration team starts in six weeks.</div><p>The platform must be configured against how work actually happens—every handoff, wait, output, and return.</p><p class="note">That documentation does not exist.</p>'},
 {k:'Assignment',h:'You have two days.',b:'<p class="lede">You are responsible for documenting the front end, from claim arrival to adjudication.</p><div class="pull">Nobody told you what to look for. Somebody simply has to write down the old way before the new platform replaces it.</div><div class="card"><div class="eyebrow">The configuration team needs</div>Every handoff and wait · every output and recipient · every provider contact · every chart detail you cannot verify.</div>'},
 {k:'Field notes',h:'Somebody was here before you.',b:'<p>The vendor sent an analyst last spring. Two things survive: her field notes and a partial chart.</p><div class="notes"><h3>Field notes — Wexford, front end</h3><pre>MAIL ROOM — Ray\n  releases 09:00 and 14:00 ONLY\n  fax conversion rule: <span class="flag">ASK SOMEONE ELSE</span>\n\nLOG DESK — Terry\n  every non-electronic claim posted to a sheet\n  <span class="flag">WHAT IS IT FOR — not established</span>\n\nNEXT DESK\n  someone checks claims before adjudication\n  nothing recorded.</pre></div>'},
 {k:'Chart',h:'Blank fields were never established.',b:'<div class="chartbox"><h3>Claim arrives</h3><div class="fields"><span>Owner: Mail room</span><span>Timing: 09:00 and 14:00</span></div></div><div class="arrow">↓</div><div class="chartbox"><h3>Receipt log</h3><div class="fields"><span class="unknown">Purpose: Not established</span><span>Owner: Log desk</span><span class="unknown">Received by: Not established</span></div></div><div class="arrow">↓</div><div class="chartbox"><h3>Step not documented</h3><span class="note">A step exists here. Nothing was recorded.</span></div><div class="arrow">↓</div><div class="chartbox">Adjudication — out of scope</div>'}
];
function intro(){const s=INTRO[introStep];app.innerHTML='<div class="narrow"><div class="steps">'+INTRO.map((x,i)=>'<button class="step '+(i===introStep?'current':'')+'" data-step="'+i+'">'+x.k+'</button>').join('')+'</div><div class="eyebrow">'+s.k+'</div><h1>'+s.h+'</h1>'+s.b+'<div class="actions">'+(introStep?'<button id="back">Back</button>':'')+'<button class="primary" id="continue">'+(introStep===INTRO.length-1?'Begin observation':'Continue')+'</button></div></div>';app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{introStep=+b.dataset.step;intro()});const back=document.getElementById('back');if(back)back.onclick=()=>{introStep--;intro()};document.getElementById('continue').onclick=()=>{if(introStep<INTRO.length-1){introStep++;intro()}else observation()}}
const CLAIMS=[['WX-40221','Ridgefield Dental','D2740 D0220',12],['WX-40222','Chapin Family Dental','D1110',12],['WX-40223','Sound View Ortho','D8080',12],['WX-40224','Ridgefield Dental','D2391 D0274',105],['WX-40225','Brookmere Dental','D1110 D0120',12],['WX-40226','Chapin Family Dental','D2150',12],['WX-40227','Harkness Perio','D4341',12],['WX-40228','Sound View Ortho','D8670',12],['WX-40229','Brookmere Dental','D0150 D1206',12],['WX-40230','Ridgefield Dental','D2740',12],['WX-40231','Elmcrest Dental','D7140 D7140',132],['WX-40232','Harkness Perio','D4910',12],['WX-40233','Chapin Family Dental','D1110',12],['WX-40234','Brookmere Dental','D2392',12],['WX-40235','Sound View Ortho','D8090',12],['WX-40236','Elmcrest Dental','D0210',12],['WX-40237','Ridgefield Dental','D2391 D0274',159],['WX-40238','Chapin Family Dental','D1206',12],['WX-40239','Harkness Perio','D4341 D0180',12],['WX-40240','Brookmere Dental','D1110',12]];
function sheet(c,under){return '<div class="sheet '+(under?'under':'')+'"><div class="sheethead">'+c[0]+'</div><div class="sheetrow"><span>Provider</span><b>'+c[1]+'</b></div><div class="sheetrow"><span>Procedures</span><b>'+c[2]+'</b></div><div class="sheetrow"><span>Status</span><b>Review</b></div></div>'}
function observation(){let elapsed=0,idx=0,remaining=CLAIMS[0][3],done=0;app.innerHTML='<div class="narrow"><div class="eyebrow">Ten minutes</div><h1>Watch. Don’t interrupt.</h1><p class="lede">Ruth Kessler is working through a batch. Her interview comes later, on a separate clock.</p><div class="instruments"><div class="instrument"><div class="eyebrow">Elapsed</div><strong id="clock">0:00</strong></div><div class="instrument"><div class="eyebrow">Claims completed</div><strong id="count">0</strong></div></div><div class="desk" id="desk"></div><p class="note" id="obsnote">Nothing is being timed for you.</p><div class="card observation-entry hidden" id="entry"><div class="eyebrow">Vendor’s chart — first-pass review</div><p>The Timing field was never established. Record what you observed.</p><div class="ask"><input id="estimate" type="number" min="1" placeholder="seconds per claim"><button class="primary" id="record">Record and continue</button></div></div></div>';const desk=document.getElementById('desk');const show=()=>{const c=CLAIMS[idx];desk.innerHTML='<div class="sheetwrap">'+sheet(c,true)+sheet(c,false)+'</div>';if(c[3]>60)setTimeout(()=>document.querySelector('.sheet.under')?.classList.add('show'),9000)};show();clearInterval(observationTimer);observationTimer=setInterval(()=>{elapsed++;remaining--;document.getElementById('clock').textContent=Math.floor(elapsed/60)+':'+String(elapsed%60).padStart(2,'0');if(remaining<=0){done++;document.getElementById('count').textContent=done;idx++;if(idx>=CLAIMS.length){clearInterval(observationTimer);desk.innerHTML='<span class="mono">Batch complete</span>';document.getElementById('obsnote').textContent='The batch is done. Ten minutes, twenty claims.';document.getElementById('entry').classList.remove('hidden');document.getElementById('estimate').focus();document.getElementById('record').onclick=()=>{const v=Number(document.getElementById('estimate').value);if(!v)return;observationSeconds=v;sessionStorage.setItem('simplus_observation',String(v));sessionStorage.setItem('simplus_intro_done','1');choose()};return}remaining=CLAIMS[idx][3];show()}},1000)}
function choose(){
 clearInterval(observationTimer);
 app.innerHTML='<div class="eyebrow">The assignment</div><h1>Document the front end before it is rebuilt.</h1><p class="lede">You have three fixed appointments. Each lasts fifteen minutes and there are no second visits. Choose a legal sequence, then decide what each minute is worth.</p><div class="card"><h2>Select your appointment order</h2><div class="grid">'+state.orders.map((o,i)=>'<button class="choice" data-order="'+i+'"><span class="eyebrow">Available route '+(i+1)+'</span><br>'+o.people.map((p,n)=>(n+1)+'. '+esc(p.name)+' — '+esc(p.role)).join('<br>')+'</button>').join('')+'</div></div>';
 app.querySelectorAll('[data-order]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{state=await call('/session',{action:'choose',order:state.orders[+b.dataset.order].ids});render()}catch(e){error(e);b.disabled=false}})
}
function interview(){
 const pct=Math.max(0,Math.min(100,(state.remaining/state.budget)*100));
 const exchanges=state.exchanges||[];
 const sealed=state.state==='sealed',closed=state.state==='closed';
 app.innerHTML='<div class="eyebrow">Appointment '+esc(state.window.index)+' of '+esc(state.window.of)+' · '+esc(state.window.label)+'</div><div class="topline"><div><h1>'+esc(state.source.name)+'</h1><p class="lede">'+esc(state.source.role)+'</p></div><div class="timer">'+Math.floor(state.remaining/60)+':'+String(state.remaining%60).padStart(2,'0')+' remaining</div></div><div class="bar"><i style="width:'+pct+'%"></i></div>'+
 '<div class="chat">'+(exchanges.length?exchanges.map(x=>'<div class="turn"><div class="who">You</div><div class="q">'+esc(x.question)+'</div><div class="who">'+esc(state.source.name)+'</div><div class="a">'+esc(x.answer)+'</div></div>').join(''):'<div class="note">The appointment has begun. Ask what you need to understand the work.</div>')+'</div>'+
 (!closed&&!sealed?'<div class="ask"><textarea id="question" maxlength="400" placeholder="Ask one clear question…"></textarea><button class="primary" id="ask">Ask</button></div>':'')+
 '<div class="actions">'+(!closed&&!sealed?'<button id="leave">End appointment early</button><button id="break">End today’s meeting</button>':'')+
 (closed?'<button class="primary" id="next">Continue to next appointment</button>':'')+
 (sealed?'<span class="note">This appointment is sealed. Return during the next class meeting to continue.</span>':'')+'</div>';
 const ask=document.getElementById('ask');if(ask)ask.onclick=async()=>{const q=document.getElementById('question').value.trim();if(!q)return;ask.disabled=true;try{state=await call('/ask',{question:q});render();app.querySelector('.chat').scrollTop=999999}catch(e){error(e);ask.disabled=false}};
 const leave=document.getElementById('leave');if(leave)leave.onclick=async()=>{if(confirm('End this appointment? Unused time cannot be recovered.')){state=await call('/session',{action:'leave'});render()}};
 const br=document.getElementById('break');if(br)br.onclick=async()=>{if(confirm('Seal this appointment and end today’s meeting?')){state=await call('/session',{action:'break'});render()}};
 const next=document.getElementById('next');if(next)next.onclick=async()=>{state=await call('/session',{action:'next'});render()};
}
async function report(){
 if(!reportRows){try{const f=await call('/report',{action:'form'});reportRows=f.rows}catch(e){return error(e)}}
 app.innerHTML='<div class="eyebrow">Configuration report</div><h1>Your findings become the build instructions.</h1><p class="lede">Choose one disposition for every row. If the evidence is incomplete, say so. Your root-cause note is required and will be read by the instructor.</p><form class="card" id="form">'+reportRows.map(r=>'<div class="report-row"><div><h2>'+esc(r.label)+'</h2><div class="note">'+esc(r.chartNote)+'</div></div><div><select required name="'+esc(r.id)+'"><option value="">Select disposition…</option><option value="automate">Automate</option><option value="keep">Keep</option><option value="eliminate">Eliminate</option><option value="cannot_assess">Cannot assess</option></select><textarea required minlength="15" name="'+esc(r.id)+'_why" placeholder="Why? Cite what you learned."></textarea></div></div>').join('')+'<label for="root">Root cause</label><textarea id="root" required placeholder="What is driving the problem, and what evidence supports your conclusion?"></textarea><div class="actions"><button class="primary" type="submit">File report</button></div></form>';
 document.getElementById('form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;const fd=new FormData(e.target),submission={rows:{},rootCause:document.getElementById('root').value.trim()};reportRows.forEach(r=>submission.rows[r.id]={disposition:fd.get(r.id),justification:fd.get(r.id+'_why')});try{const result=await call('/report',{submission,observationSeconds});outcomes(result)}catch(err){error(err);btn.disabled=false}};
}
function outcomes(result){
 app.innerHTML='<div class="eyebrow">Configuration returned</div><h1>The report has consequences.</h1><p class="lede">'+(result.harmFired?'One decision removed judgment the process depended on.':'Your decisions did not trigger the central harm.')+'</p><div class="card">'+result.consequences.map(c=>'<div class="outcome"><div class="eyebrow">'+esc(c.label)+' · '+esc(c.disposition)+'</div><h2>'+esc(c.configured)+'</h2><p>'+esc(c.consequence)+'</p></div>').join('')+'</div><p class="note">Your completion and instructor transcript have been sent to the faculty view.</p>';
 sessionStorage.removeItem('simplus_intro_done');sessionStorage.removeItem('simplus_observation');
}
(async()=>{try{state=await call('/session',{action:'state'});render()}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div><p>If you launched from a course, return there and open the simulation again.</p>'}})();
</script>
</body></html>
