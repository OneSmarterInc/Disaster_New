<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RapidSim+ 01 — opening sequence preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1524; --panel:#141D30; --panel2:#18223A; --line:#243149;
  --ink:#E7ECF5; --dim:#8896AC; --faint:#5C6B85; --amber:#E8A33D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.62;
  -webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

.top{border-bottom:1px solid var(--line);padding:14px 26px;
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--faint)}
.title{font-size:22px;margin-top:2px}
.steps{display:flex;gap:6px}
.step{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);border:1px solid var(--line);
  padding:7px 11px;background:transparent;cursor:pointer;border-radius:2px}
.step[aria-current=true]{color:var(--amber);border-color:var(--amber)}
.step.done{color:var(--dim)}

.stage{max-width:760px;margin:0 auto;padding:38px 26px 90px}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint);margin-bottom:12px}
h1{font-size:29px;font-weight:400;line-height:1.25;margin:0 0 18px;letter-spacing:-.01em}
p{margin:0 0 15px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:24px 26px;margin-bottom:18px}
.dim{color:var(--dim)}
.pull{border-left:2px solid var(--amber);padding-left:16px;margin:22px 0}

ul.cover{list-style:none;padding:0;margin:8px 0 0}
ul.cover li{padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--line);
  font-size:16px}
ul.cover li:last-child{border-bottom:0}
ul.cover li::before{content:"—";position:absolute;left:0;color:var(--faint)}

/* field notes: a different object from everything else on screen */
.notes{background:#101828;border:1px solid var(--line);border-radius:3px;
  padding:0;margin-bottom:18px;overflow:hidden}
.notes-h{border-bottom:1px solid var(--line);padding:13px 20px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.notes pre{font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.85;
  color:#C4D0E4;margin:0;padding:22px 24px;white-space:pre-wrap}
.notes .q{color:var(--amber)}
.notes .last{color:var(--faint);font-style:italic}

/* chart */
.box{background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:17px 20px;margin-bottom:0}
.box h3{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;margin:0 0 6px;color:var(--ink)}
.box .sub{font-size:15px;color:var(--dim);margin-bottom:13px}
.fields{display:flex;gap:34px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:11px}
.f-l{color:var(--faint);letter-spacing:.06em;display:block;margin-bottom:3px}
.f-v{color:var(--dim)}
.f-v.blank{color:var(--amber)}
.arrow{text-align:center;color:var(--amber);font-size:15px;padding:7px 0}
.terminus{text-align:center;border:1px dashed var(--line);border-radius:3px;
  padding:15px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.chart-note{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);
  margin-bottom:16px}

/* order choice */
.opt{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:3px;padding:16px 19px;margin-bottom:10px;cursor:pointer;color:var(--ink);
  font-family:"Newsreader",serif;font-size:17px}
.opt:hover{border-color:var(--amber)}
.opt .when{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);display:block;margin-bottom:5px}

.nav{max-width:760px;margin:0 auto;padding:0 26px 60px;display:flex;
  justify-content:space-between;gap:12px}
button.go{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;background:var(--amber);color:#0E1524;
  border:1px solid var(--amber);border-radius:2px;padding:13px 22px;cursor:pointer}
button.back{background:transparent;color:var(--dim);border-color:var(--line)}
button:focus-visible,.step:focus-visible,.opt:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hidden{display:none}
@media(max-width:640px){.steps{display:none}h1{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="brand">RapidSim+ · Wexford Benefit Administrators</div>
    <div class="title">Why Don’t They Have Any Patience?</div>
  </div>
  <div class="steps" id="steps"></div>
</div>

<div class="stage" id="stage"></div>
<div class="nav">
  <button class="go back" id="back">Back</button>
  <button class="go" id="next">Continue</button>
</div>

<script>
const SCREENS = [
{
  kicker:'The setting',
  h1:'Wexford Benefit Administrators',
  html:`
  <p>Wexford administers dental benefits for self-funded employers — companies that pay
  their own claims and hire someone else to run them. About four hundred plans, a little
  over two hundred staff, one building outside Hartford.</p>
  <p>Around twelve hundred claims arrive every working day. A dentist’s office sends one
  in, somebody at Wexford works out whether the plan covers it and what it pays, and money
  moves. Most of it is routine. Almost all of it is paper, or was until fairly recently.</p>
  <div class="panel">
    <p style="margin-bottom:0">Wexford is replacing its claims platform. The contract is
    signed, the vendor’s configuration team starts in six weeks, and the go-live date has
    been circulated.</p>
  </div>
  <p>A platform cannot be configured against a description of how work is <em>supposed</em>
  to happen. It has to be built against how the work actually happens — every handoff,
  every wait, everything that leaves the building and comes back.</p>
  <p class="dim">That documentation does not exist. Nobody has ever had a reason to write
  it down.</p>`
},
{
  kicker:'Your assignment',
  h1:'You have two days.',
  html:`
  <p>You are an analyst at Wexford. You have been pulled off your own work to produce the
  front-end documentation — from the moment a claim arrives to the moment it reaches
  adjudication.</p>
  <div class="pull">
    <p style="margin-bottom:0">You were given the assignment in a four-minute conversation.
    Nobody told you what to look for, because as far as anyone here is concerned there is
    nothing to look for. There is a migration, and somebody has to write down how the old
    way works before the new way replaces it.</p>
  </div>
  <div class="panel">
    <div class="kicker" style="margin-bottom:6px">The configuration team has asked that you cover</div>
    <ul class="cover">
      <li>Every point where a claim changes hands or waits</li>
      <li>What each step produces, and who receives it</li>
      <li>Every point where the submitting provider is contacted, or contacts Wexford</li>
      <li>Anything on the chart you cannot verify</li>
    </ul>
  </div>`
},
{
  kicker:'What has already been done',
  h1:'Somebody was here before you.',
  html:`
  <p>The vendor sent an analyst last spring to start the mapping. She spent one morning
  here, walked the front end, and left. Whatever was supposed to bring her back never did.</p>
  <p class="dim">Two things survive from that morning. Her field notes, and the partial
  chart somebody typed up from them.</p>
  <div class="notes">
    <div class="notes-h">Field notes — Wexford, front end · L. Marchetti, platform config. · Tues am.</div>
<pre>MAIL ROOM — w/ Ray
  post arrives 8:00 + 11:30, stacks on table
  fax server running all day, prints on arrival
  releases 09:00 and 14:00 ONLY. nothing between.
  ~300 post / ~400 fax out to conversion vendor /
    ~150 fax done here / ~350 clearinghouse
  clearinghouse never comes through this room at all

  <span class="q">?? some faxes go OUT to the vendor, some done here
     asked twice, no rule. ASK SOMEONE ELSE</span>

LOG DESK — Terry
  every non-electronic claim posted to a sheet
  date / provider / patient / control no.
  6 batches. takes most of his day.
  <span class="q">WHAT IS IT FOR — didn't get to this</span>

NEXT DESK
  someone checks claims before adjudication
  ran out of morning. nothing recorded.

<span class="last">─── back Thurs to finish ───</span></pre>
  </div>`
},
{
  kicker:'What has already been done',
  h1:'The chart typed up from those notes.',
  html:`
  <p class="chart-note">Prepared during the earlier engagement. Blank fields were never established.</p>
  <div class="box">
    <h3>Claim arrives</h3>
    <div class="sub">Post · fax to outside conversion vendor · fax converted here · clearinghouse</div>
    <div class="fields">
      <div><span class="f-l">Purpose</span><span class="f-v">Intake</span></div>
      <div><span class="f-l">Owner</span><span class="f-v">Mail room</span></div>
      <div><span class="f-l">Timing</span><span class="f-v">Releases 09:00 and 14:00</span></div>
    </div>
  </div>
  <div class="arrow">↓</div>
  <div class="box">
    <h3>Receipt log</h3>
    <div class="sub">All non-electronic claims posted to a spreadsheet before onward routing</div>
    <div class="fields">
      <div><span class="f-l">Purpose</span><span class="f-v blank">Not established</span></div>
      <div><span class="f-l">Owner</span><span class="f-v">Log desk</span></div>
      <div><span class="f-l">Received by</span><span class="f-v blank">Not established</span></div>
      <div><span class="f-l">Timing</span><span class="f-v">Approx. 6 hours/day</span></div>
    </div>
  </div>
  <div class="arrow">↓</div>
  <div class="box">
    <h3>Step not documented</h3>
    <div class="sub">A step exists here. The morning ran out before anything was recorded.</div>
  </div>
  <div class="arrow">↓</div>
  <div class="terminus">Adjudication — out of scope</div>`
},
{
  kicker:'Your access',
  h1:'Three appointments. Fifteen minutes each.',
  html:`
  <p>Karen in operations arranged them, and was pleasant and immovable about it. These are
  people with a day’s work waiting, she said, and they are doing you a favour. There are no
  second visits.</p>
  <p class="dim">She could only make two orders work.</p>
  <button class="opt"><span class="when">09:00 Terry · 09:35 Ray · 10:10 Ruth</span>
    Terry Voss first, then Ray Duffy, then Ruth Kessler.</button>
  <button class="opt"><span class="when">09:00 Ruth · 09:35 Terry · 10:10 Ray</span>
    Ruth Kessler first, then Terry Voss, then Ray Duffy.</button>
  <p class="dim" style="margin-top:16px">Ruth is in a plan review mid-morning, and Ray does
  not come off the floor until the second slot.</p>
  <p style="margin-top:26px">Down the corridor, a fax machine is going.</p>`
}
];

const LABELS = ['Setting','Assignment','Field notes','Chart','Access'];
let i = 0;

function render(){
  const s = SCREENS[i];
  document.getElementById('stage').innerHTML =
    '<div class="kicker">'+s.kicker+'</div><h1>'+s.h1+'</h1>'+s.html;
  document.getElementById('steps').innerHTML = LABELS.map((l,n)=>
    '<button class="step'+(n<i?' done':'')+'" aria-current="'+(n===i)+'" data-n="'+n+'">'+l+'</button>'
  ).join('');
  document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{i=+b.dataset.n;render();});
  document.getElementById('back').style.visibility = i? 'visible':'hidden';
  document.getElementById('next').textContent = i===SCREENS.length-1 ? 'Begin observation' : 'Continue';
  document.getElementById('next').style.visibility = i===SCREENS.length-1 ? 'hidden':'visible';
  window.scrollTo(0,0);
}
document.getElementById('next').onclick=()=>{ if(i<SCREENS.length-1){i++;render();} };
document.getElementById('back').onclick=()=>{ if(i>0){i--;render();} };
render();
</script>
</body>
</html>
