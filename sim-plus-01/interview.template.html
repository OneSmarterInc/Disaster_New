<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RapidSim+ 01 — interview window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1524;--panel:#141D30;--panel2:#18223A;--line:#243149;--ink:#E7ECF5;
--dim:#8896AC;--faint:#5C6B85;--amber:#E8A33D;--spend:#3E5A78;--spend2:#547A9E;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.62}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.top{border-bottom:1px solid var(--line);padding:13px 26px;display:flex;
justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.22em;
text-transform:uppercase;color:var(--faint)}
.title{font-size:20px;margin-top:2px}
.note{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;
color:var(--faint);border:1px dashed var(--line);padding:6px 10px;border-radius:2px;max-width:330px}

.shell{display:flex;gap:0;min-height:calc(100vh - 62px)}
.rail{width:236px;flex:none;border-right:1px solid var(--line);padding:24px 20px}
.rail h4{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.18em;
text-transform:uppercase;color:var(--faint);margin:0 0 14px;font-weight:500}
.who{padding:12px 0;border-bottom:1px solid var(--line)}
.who .n{font-size:16px}
.who .r{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
color:var(--faint);margin-top:2px}
.who .t{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
color:var(--faint);margin-top:5px}
.who.now .n{color:var(--amber)}
.who.now .t{color:var(--amber)}
.who.past{opacity:.4}
.rail .fine{font-family:"IBM Plex Mono",monospace;font-size:10px;line-height:1.7;
color:var(--faint);margin-top:20px}

.main{flex:1;min-width:0;padding:24px 30px 60px;max-width:820px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:9px}
.head .n{font-size:25px}
.head .r{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
text-transform:uppercase;color:var(--faint)}
.clock{font-family:"IBM Plex Mono",monospace;font-size:22px;font-variant-numeric:tabular-nums;
color:var(--ink)}
.clock.low{color:var(--amber)}

/* Spend ledger. Each question leaves a block sized by what it cost.
   No colour here carries meaning about the KIND of question — the only
   distinction is how much of the window it consumed. */
.ledger{display:flex;height:26px;border:1px solid var(--line);border-radius:2px;
overflow:hidden;background:#0B1120;margin-bottom:7px}
.seg{background:var(--spend);border-right:1px solid #0B1120;transition:width .35s ease;
position:relative}
.seg:nth-child(even){background:var(--spend2)}
.seg .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
background:var(--ink);color:#0E1524;font-family:"IBM Plex Mono",monospace;font-size:10px;
padding:4px 7px;border-radius:2px;white-space:nowrap;opacity:0;pointer-events:none;z-index:5}
.seg:hover .tip{opacity:1}
.ledger-key{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
color:var(--faint);margin-bottom:26px}

.ex{margin-bottom:24px;padding-left:15px;border-left:1px solid var(--line)}
.q{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--dim);
margin-bottom:9px;line-height:1.55;display:flex;justify-content:space-between;gap:14px}
.q .cost{color:var(--faint);white-space:nowrap}
.a{font-size:17.5px;line-height:1.65;white-space:pre-wrap}
.blank{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:11.5px;
letter-spacing:.08em}

.ask{display:flex;gap:9px;margin-top:22px}
input[type=text]{flex:1;font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--ink);
background:#0B1120;border:1px solid var(--line);border-radius:2px;padding:13px 14px}
input:focus{outline:2px solid var(--amber);outline-offset:1px}
button{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
letter-spacing:.16em;text-transform:uppercase;background:var(--amber);color:#0E1524;
border:0;border-radius:2px;padding:13px 22px;cursor:pointer}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.sub{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);margin-top:11px}
.sub a{color:var(--faint)}
.over{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--amber);
border-top:1px solid var(--line);padding-top:20px;margin-top:26px}
@media(max-width:820px){.shell{flex-direction:column}.rail{width:auto;border-right:0;
border-bottom:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <div><div class="brand">RapidSim+ · Wexford · appointment</div>
  <div class="title" id="ttl">Interview</div></div>
  <div class="note">Preview build. The bank and contracts are inlined here — production keeps
  all of it server-side.</div>
</div>

<div class="shell">
  <div class="rail">
    <h4>Today</h4>
    <div id="rail"></div>
    <div class="fine">Fifteen minutes each.<br>No second visits.</div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
/*__ENGINE__*/
</script>

<script>
(function(){
  var session = null;
  var TIMES = ['09:00 – 09:15','09:35 – 09:50','10:10 – 10:25'];
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function mmss(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

  function chooser(){
    document.getElementById('ttl').textContent = 'Choose your order';
    document.getElementById('rail').innerHTML = '';
    document.getElementById('main').innerHTML =
      '<p>Karen could only make two orders work.</p>' +
      feasibleOrderings().map(function(o){
        return '<p><button data-o="'+o.join(',')+'">'+
          o.map(function(id){ return SOURCES[id].name; }).join('  →  ')+'</button></p>';
      }).join('');
    document.querySelectorAll('[data-o]').forEach(function(b){
      b.onclick=function(){ session=new Session().chooseOrder(b.dataset.o.split(',')); render(); };
    });
  }

  function rail(){
    document.getElementById('rail').innerHTML = session.order.map(function(id,i){
      var c=SOURCES[id];
      var cls = i===session.windowIndex ? 'who now' : (i<session.windowIndex ? 'who past':'who');
      return '<div class="'+cls+'"><div class="n">'+esc(c.name)+'</div>'+
        '<div class="r">'+esc(c.role)+'</div><div class="t">'+TIMES[i]+'</div></div>';
    }).join('');
  }

  function render(){
    var id = session.currentSourceId;
    if (!id){ done(); return; }
    var c = SOURCES[id], w = WINDOWS[session.windowIndex];
    document.getElementById('ttl').textContent = c.name;
    rail();

    var rows = session.transcript.filter(function(t){ return t.window===w.id; });

    // Every block is the same family of colour. Nothing about a block
    // tells the participant what KIND of question it was, and the
    // question that closes a source looks exactly like every other.
    var segs = rows.map(function(t){
      return '<div class="seg" style="width:'+(t.spent/WINDOW_SECONDS*100)+'%">'+
        '<span class="tip">'+mmss(t.spent)+' spent</span></div>';
    }).join('');

    var body = rows.map(function(t){
      return '<div class="ex"><div class="q"><span>'+esc(t.question)+'</span>'+
        '<span class="cost">'+mmss(t.spent)+'</span></div>'+
        '<div class="a">'+esc(t.answer)+'</div></div>';
    }).join('');

    var over = session.remaining<=0;
    var low = session.remaining<=180;

    document.getElementById('main').innerHTML =
      '<div class="head"><div><div class="n">'+esc(c.name)+'</div>'+
      '<div class="r">'+esc(c.role)+' · '+TIMES[session.windowIndex]+'</div></div>'+
      '<div class="clock'+(low?' low':'')+'">'+mmss(Math.max(0,session.remaining))+'</div></div>'+
      '<div class="ledger">'+segs+'</div>'+
      '<div class="ledger-key">each block is one question</div>'+
      (body || '<div class="blank">She is waiting.</div>') +
      (over
        ? '<div class="over">The appointment is over. '+esc(c.name)+' has gone back to work.<br><br>'+
          '<button id="next">'+(session.windowIndex<2?'Next appointment':'Write the report')+'</button></div>'
        : '<div class="ask"><input type="text" id="q" placeholder="Ask something" autocomplete="off">'+
          '<button id="ask">Ask</button></div>'+
          '<div class="sub">'+rows.length+' asked · '+
          '<a href="#" id="leave">leave early</a></div>');

    var i=document.getElementById('q');
    if(i){
      i.focus();
      var fire=function(){ var v=i.value.trim(); if(!v) return; session.ask(v); render(); };
      document.getElementById('ask').onclick=fire;
      i.onkeydown=function(e){ if(e.key==='Enter') fire(); };
      document.getElementById('leave').onclick=function(e){
        e.preventDefault(); session.remaining=0; render(); };
    }
    var n=document.getElementById('next');
    if(n) n.onclick=function(){ session.advanceWindow(); render(); };
  }

  function done(){
    document.getElementById('ttl').textContent='Appointments finished';
    rail();
    var sp=[...new Set(session.transcript.filter(function(t){
      return t.bucket==='SENDER_PERSPECTIVE'; }).map(function(t){ return SOURCES[t.sourceId].name; }))];
    document.getElementById('main').innerHTML =
      '<div class="head"><div class="n">That is all the access you have.</div></div>'+
      '<p class="dim">Three appointments, '+session.transcript.length+' questions. '+
      'Next you write the report the configuration team builds against.</p>'+
      '<div class="over">Instructor only — not shown to participants:<br>'+
      'sender perspective reached: '+(sp.join(', ')||'nobody')+'<br>'+
      'Ruth ended: '+(session.posture.ruth||'—').toLowerCase()+'</div>';
  }

  chooser();
})();
</script>
</body>
</html>
