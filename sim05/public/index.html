<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Would You Approve This?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --night:#0E1524;--panel:#161E2E;--raise:#1D2637;--line:#2B3548;--line2:#3A4659;
  --bone:#E8E4DA;--soft:#C9C6BE;--dim:#8C95A8;--dimmer:#616B7E;
  --amber:#F0A63C;--amberDeep:#8A6427;--rose:#CE7C8D;
  --serif:'Newsreader',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--night);color:var(--bone)}
body{font-family:var(--serif);font-size:17px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.hidden{display:none!important}

header{display:flex;align-items:center;gap:24px;padding:16px 28px;border-bottom:1px solid var(--line)}
.brand{margin-right:auto;font-size:18px;font-weight:500}
.brand small{display:block;font:12px var(--mono);color:var(--dimmer);font-weight:400}
.track{display:flex;gap:4px;align-items:center}
.track span{width:34px;height:6px;background:var(--line)}
.track span.now{background:var(--amber)}
.track span.ship{background:var(--soft)}
.track span.decl{background:transparent;border:1px solid var(--soft)}
.clock{font:600 26px var(--mono);color:var(--amber);min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
.clock small{display:block;font:400 11px var(--mono);color:var(--dimmer);text-align:right}

main{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:44px 0 80px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:44px;align-items:start}
.lead{max-width:62ch}
.kicker{font:13px var(--mono);color:var(--amber);margin-bottom:12px}
h1.request{font-size:clamp(28px,3.4vw,40px);font-weight:400;line-height:1.18;letter-spacing:-.01em;margin-bottom:22px}
h2{font-size:30px;font-weight:400;line-height:1.2;margin-bottom:18px}
p.body{color:var(--soft);margin-bottom:14px}
.facts{margin:26px 0 30px;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:180px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.facts dt{font:13px var(--mono);color:var(--dim);padding-top:3px}
.facts dd{color:var(--bone)}

.decide{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);padding:13px 26px;font:500 15px var(--mono);color:var(--bone);transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--soft)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1A1206}
.btn.pri:hover{background:#FFB94E}
.btn:disabled{opacity:.45;cursor:not-allowed}
.confirm{border:1px solid var(--amberDeep);background:rgba(240,166,60,.07);padding:18px 20px;max-width:560px}
.confirm p{margin-bottom:14px}
.note{border-left:2px solid var(--line2);padding:12px 16px;color:var(--soft);margin:18px 0;max-width:62ch}
.note.warn{border-left-color:var(--amber)}
.note.bad{border-left-color:var(--rose);color:#E3B9C2}

.outcome{font-size:24px;margin-bottom:6px}
.outcome small{display:block;font:13px var(--mono);color:var(--dim);margin-top:4px}
.cost{border:1px solid var(--line2);padding:18px 20px;margin-top:22px;max-width:62ch}
.cost h3{font:500 13px var(--mono);color:var(--dim);margin-bottom:8px}

/* Dana's file: the one element that carries the sim. */
.file{border:1px solid var(--line2);background:var(--panel);position:sticky;top:24px}
.file-head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.file-head .who{font-size:22px}
.file-head .meta{font:12px var(--mono);color:var(--dim);margin-top:2px}
.file-head .title{font:12px var(--mono);color:var(--amber);margin-top:12px}
.file ol{list-style:none}
.file li{padding:14px 20px;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.55;color:var(--soft)}
.file li:last-child{border-bottom:0}
.file li .lab{display:flex;justify-content:space-between;gap:10px;font:12px var(--mono);color:var(--dim);margin-bottom:5px}
.file li.new{box-shadow:inset 3px 0 0 var(--amber);color:var(--bone)}
.file li.new .lab .tag{color:var(--amber)}
.file .empty{padding:18px 20px;color:var(--dimmer);font-style:italic}
@media (prefers-reduced-motion:no-preference){.file li.new{animation:arrive .6s ease-out}}
@keyframes arrive{from{background:rgba(240,166,60,.14)}to{background:transparent}}

.ending{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}
.ending h3{font:500 13px var(--mono);color:var(--amber);margin-bottom:12px}
.ending ul{list-style:none;border-top:1px solid var(--line)}
.ending li{padding:14px 0;border-bottom:1px solid var(--line);color:var(--soft)}
.ending li b{display:block;font:500 12px var(--mono);color:var(--dim);margin-bottom:4px}
.decisions{margin-top:36px;border-top:1px solid var(--line)}
.decisions div{display:grid;grid-template-columns:34px 1fr auto auto;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.decisions .n{font:13px var(--mono);color:var(--dimmer)}
.decisions .d{font:13px var(--mono);color:var(--bone)}
.decisions .mv{font:12px var(--mono);color:var(--dim)}

.join{max-width:460px}
.field{margin-top:18px}
.field label{display:block;font:13px var(--mono);color:var(--dim);margin-bottom:6px}
.field input{width:100%;background:var(--night);border:1px solid var(--line2);padding:12px 13px}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}.file{position:static}
  .ending{grid-template-columns:1fr}
  header{flex-wrap:wrap;padding:14px 18px}.track span{width:22px}
  .facts div{grid-template-columns:1fr;gap:4px}
}
</style>
</head>
<body>
<header>
  <div class="brand">Would You Approve This?<small id="sub">Loopwell</small></div>
  <div class="track" id="track" aria-hidden="true"></div>
  <div class="clock" id="clock" aria-live="off"></div>
</header>
<main id="app" aria-live="polite"></main>
<script>
const BASE=(location.pathname.match(/^\/sim-?\d+/)||[''])[0];
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fill=(t,v)=>String(t).replace(/\{(\w+)\}/g,(_,k)=>k in v?v[k]:'');

function entryParam(k){return new URLSearchParams(location.hash.slice(1)).get(k)||new URLSearchParams(location.search).get(k)}
let ACCESS_CODE=entryParam('code')||sessionStorage.getItem('m05-access')||null;
if(ACCESS_CODE)sessionStorage.setItem('m05-access',ACCESS_CODE);
const LAUNCH_TOKEN=entryParam('lt')||null;
let LAUNCH=null;
if(LAUNCH_TOKEN){try{LAUNCH=JSON.parse(atob(LAUNCH_TOKEN.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')))}catch{}}
const INITIAL_SESSION=(new URLSearchParams(location.search).get('session')||'').toUpperCase();
if(LAUNCH_TOKEN||entryParam('code')){
  const keep=new URLSearchParams(location.search);keep.delete('lt');keep.delete('code');
  history.replaceState(null,'',location.pathname+(keep.toString()?'?'+keep.toString():''));
}

let CFG=null;
const S={code:INITIAL_SESSION,pid:'',session:null,view:null,shown:'',confirming:null,busy:false,error:'',
  syncedAt:0,remaining:0,poll:null,tick:null,reported:false,solo:false};

function friendly(code){return({
  session_not_running:CFG?.copy.waitingForStart,session_paused:CFG?.copy.paused,
  round_closed:'That round has closed.',no_round_open:'No round is open right now.',
  already_decided:'You have already decided this round.',team_not_assigned:CFG?.copy.waitingForTeam,
  teams_locked:'This team session has already started. Ask your instructor to add you to the next one.',
  session_closed:CFG?.copy.sessionClosed,no_such_session:'That session code was not found. Check it with your instructor.',
  name_required:'Enter your name to join.',platform_signin_required:'Open this session from RapidSims to join it.'
})[code]||''}

async function request(path,payload,method='POST'){
  const headers={'Content-Type':'application/json'};
  if(LAUNCH_TOKEN)headers['x-launch-token']=LAUNCH_TOKEN;
  else if(ACCESS_CODE)headers['x-access-code']=ACCESS_CODE;
  const opt={method,headers};if(method!=='GET')opt.body=JSON.stringify(payload||{});
  const r=await fetch(BASE+path,opt);let d={};try{d=await r.json()}catch{}
  if(!r.ok){const e=new Error(d.message||friendly(d.error)||`Server error ${r.status}`);e.code=d.error;throw e}
  return d;
}
const sessionApi=p=>request('/api/session',p);

async function init(){
  try{CFG=await request('/api/config',null,'GET')}
  catch(e){
    if(INITIAL_SESSION&&['access_code_required','access_code_not_configured','launch_token_invalid'].includes(e.code)){
      location.replace(BASE+'/api/join?session='+encodeURIComponent(INITIAL_SESSION));return;
    }
    if(e.code==='access_code_required'&&!LAUNCH_TOKEN){
      sessionStorage.removeItem('m05-access');
      app.innerHTML=`<div class="note bad">An access code is required to open this simulation.</div><button class="btn pri" id="acc">Enter access code</button>`;
      document.getElementById('acc').onclick=()=>location.assign(BASE+'/launch.html');return;
    }
    app.innerHTML=`<div class="note bad">${esc(e.message)}</div><button class="btn" onclick="location.reload()">Try again</button>`;return;
  }
  if(S.code){
    if(LAUNCH?.sub){
      try{const d=await sessionApi({action:'join',code:S.code});S.pid=d.participantId;localStorage.setItem('m05-pid',S.pid)}
      catch(e){S.error=e.message;return renderJoin()}
    }else{
      S.pid=localStorage.getItem('m05-pid')||'';
      if(!S.pid)return renderJoin();
    }
    try{await poll()}catch{S.pid='';localStorage.removeItem('m05-pid');return renderJoin()}
  }else{
    // Direct launch: one private run with its own clock, resumed on refresh.
    const soloKey='m05-solo'+(LAUNCH?.sub?':'+LAUNCH.sub:'');
    let saved=null;try{saved=JSON.parse(sessionStorage.getItem(soloKey)||'null')}catch{}
    S.solo=true;
    if(saved){S.code=saved.code;S.pid=saved.pid;try{await poll()}catch{saved=null}}
    if(!saved){
      try{const d=await sessionApi({action:'solo'});S.code=d.code;S.pid=d.participantId;sessionStorage.setItem(soloKey,JSON.stringify({code:S.code,pid:S.pid}));await poll()}
      catch(e){app.innerHTML=`<div class="note bad">${esc(e.message)}</div>`;return}
    }
  }
  S.poll=setInterval(()=>poll().catch(()=>{}),2000);
  S.tick=setInterval(tickClock,250);
}

function renderJoin(){
  app.innerHTML=`<section class="join"><h2>Join the session</h2>
  <p class="body">Enter your name and the code on your instructor's screen.</p>
  ${S.error?`<div class="note bad">${esc(S.error)}</div>`:''}
  <div class="field"><label for="jn">Name</label><input id="jn" autocomplete="name" value="${esc(LAUNCH?.name||'')}" ${LAUNCH?.sub?'readonly':''}></div>
  <div class="field"><label for="jc">Session code</label><input id="jc" maxlength="5" autocomplete="off" value="${esc(S.code)}"></div>
  <div class="decide" style="margin-top:20px"><button class="btn pri" id="jb">Join session</button></div></section>`;
  document.getElementById('jb').onclick=join;
}
async function join(){
  const name=document.getElementById('jn').value.trim(),code=document.getElementById('jc').value.trim().toUpperCase();
  try{
    const d=await sessionApi({action:'join',code,name,participantId:localStorage.getItem('m05-pid')||undefined});
    S.code=code;S.pid=d.participantId;localStorage.setItem('m05-pid',S.pid);S.error='';
    const q=new URLSearchParams(location.search);q.set('session',code);history.replaceState(null,'',location.pathname+'?'+q);
    await poll();clearInterval(S.poll);S.poll=setInterval(()=>poll().catch(()=>{}),2000);clearInterval(S.tick);S.tick=setInterval(tickClock,250);
  }catch(e){S.error=e.message;renderJoin()}
}

async function poll(){
  const d=await sessionApi({action:'state',code:S.code,participantId:S.pid});
  S.session=d.session;S.view=d.view;S.syncedAt=performance.now();S.remaining=d.view.clock.remaining;
  const key=JSON.stringify([d.session.state,d.session.paused,d.view.clock.phase,d.view.clock.round,d.view.rounds,d.view.ending,d.view.canVote,d.view.team]);
  if(key!==S.shown){S.shown=key;if(!d.view.canVote)S.confirming=null;render()}
  if(d.view.ending&&LAUNCH_TOKEN&&!S.reported){S.reported=true;request('/api/finish',{code:S.code,participantId:S.pid}).catch(()=>{S.reported=false})}
}

function tickClock(){
  const v=S.view,el=document.getElementById('clock');if(!v){el.innerHTML='';return}
  const c=v.clock;
  if(['lobby','closed'].includes(c.phase)||S.session?.state==='closed'){el.innerHTML='';return}
  const left=c.paused?S.remaining:Math.max(0,S.remaining-(performance.now()-S.syncedAt)/1000);
  const m=Math.floor(left/60),s=Math.floor(left%60);
  const label=c.phase==='briefing'?fill(CFG.copy.roundOpensIn,{n:1}):c.phase==='decide'?CFG.copy.roundClosesIn:c.phase==='reveal'?(c.round<5?fill(CFG.copy.roundOpensIn,{n:c.round+1}):CFG.copy.endingIn):'';
  el.innerHTML=c.phase==='ending'?'':`${m}:${String(s).padStart(2,'0')}<small>${esc(c.paused?'Paused':label)}</small>`;
}

function track(){
  const v=S.view,cells=[];
  for(let n=1;n<=5;n++){
    const r=v.rounds[n-1],res=r&&r.result;
    let cls='';if(res)cls=res.decision==='decline'?'decl':'ship';else if(v.clock.round===n&&v.clock.phase==='decide')cls='now';
    cells.push(`<span class="${cls}"></span>`);
  }
  document.getElementById('track').innerHTML=cells.join('');
  document.getElementById('sub').textContent=S.view.team?`Loopwell · ${S.view.team.label||'Your team'}`:'Loopwell';
}

function file(picture,changed,added){
  const c=CFG.customer;
  const items=picture&&picture.length?`<ol>${picture.map(p=>`<li class="${changed&&changed.includes(p.id)?'new':''}"><div class="lab"><span>${esc(p.label)}</span><span class="tag">${changed&&changed.includes(p.id)?esc(added&&added.includes(p.id)?CFG.copy.newMarker:CFG.copy.updatedMarker)+' · ':''}${esc(CFG.copy.levelWords[p.level]||'')}</span></div>${esc(p.text)}</li>`).join('')}</ol>`:`<div class="empty">${esc(CFG.copy.revealEmpty)}</div>`;
  return `<aside class="file" aria-label="${esc(CFG.copy.revealHeading)}"><div class="file-head"><div class="who">${esc(c.name)}</div><div class="meta">${c.age} · ${esc(c.since)}</div><div class="title">${esc(CFG.copy.revealHeading)}</div></div>${items}</aside>`;
}
function latestPicture(){
  const done=S.view.rounds.filter(r=>r.result);
  return done.length?done[done.length-1].result.picture:[];
}
function outcomeWords(d){return CFG.copy.outcomeWords[d]||''}

function render(){
  const v=S.view,c=v.clock;track();tickClock();
  if(S.session.state==='closed'&&!v.ending){app.innerHTML=`<div class="note">${esc(CFG.copy.sessionClosed)}</div>`;return}
  if(c.phase==='lobby'){
    const wait=S.session.mode==='team'&&!v.team?.label?CFG.copy.waitingForTeam:CFG.copy.waitingForStart;
    app.innerHTML=`<div class="lead"><div class="kicker">Session ${esc(S.session.code)}</div><h2>You're in.</h2><p class="body">${esc(wait)}</p></div>`;return;
  }
  const paused=c.paused?`<div class="note warn">${esc(CFG.copy.paused)}</div>`:'';
  if(v.ending)return renderEnding(paused);
  if(c.phase==='briefing'){
    const paras=CFG.briefing.individual.map(p=>`<p class="body">${esc(p)}</p>`).join('');
    const team=S.session.mode==='team'?`<p class="body">${esc(CFG.briefing.teamExtra)}</p>`:'';
    app.innerHTML=`<div class="layout"><div class="lead">${paused}<div class="kicker">Before round 1</div><h2>${esc(CFG.briefing.heading)}</h2>${paras}${team}</div>${file([],[])}</div>`;return;
  }
  const r=v.rounds[c.round-1];
  if(c.phase==='decide')return renderDecide(r,paused);
  renderReveal(r,paused);
}

function requestBlock(r){
  return `<div class="kicker">Round ${r.n} of 5 · ${esc(r.title)}</div><h1 class="request">${esc(r.request)}</h1>
  <dl class="facts"><div><dt>Why the team wants it</dt><dd>${esc(r.reason)}</dd></div><div><dt>What it adds</dt><dd>${esc(r.adds)}</dd></div></dl>`;
}
function renderDecide(r,paused){
  const v=S.view,team=S.session.mode==='team';let act='';
  if(r.myVote){
    act=`<div class="note">${team?'You voted to '+esc(r.myVote)+'. ':''}${esc(team?CFG.copy.votedTeam:CFG.copy.votedIndividual)}</div>`;
  }else if(S.confirming){
    const ap=S.confirming==='approve';
    act=`<div class="confirm" role="group" aria-label="Confirm your decision"><p>${esc(ap?CFG.copy.confirmApprove:CFG.copy.confirmDecline)}</p>
    <div class="decide"><button class="btn pri" id="yes">${ap?'Confirm approval':'Confirm decline'}</button><button class="btn" id="no">Go back</button></div></div>`;
  }else{
    act=`<div class="decide"><button class="btn pri" id="ap" ${v.canVote?'':'disabled'}>${esc(CFG.copy.decide.approve)}</button><button class="btn" id="dc" ${v.canVote?'':'disabled'}>${esc(CFG.copy.decide.decline)}</button></div>`;
  }
  const err=S.error?`<div class="note bad">${esc(S.error)}</div>`:'';
  app.innerHTML=`<div class="layout"><div class="lead">${paused}${requestBlock(r)}${act}${err}</div>${file(latestPicture(),[])}</div>`;
  const ap=document.getElementById('ap'),dc=document.getElementById('dc'),yes=document.getElementById('yes'),no=document.getElementById('no');
  if(ap)ap.onclick=()=>{S.confirming='approve';S.error='';render();document.getElementById('yes')?.focus()};
  if(dc)dc.onclick=()=>{S.confirming='decline';S.error='';render();document.getElementById('yes')?.focus()};
  if(no)no.onclick=()=>{S.confirming=null;render()};
  if(yes)yes.onclick=()=>vote(r.n,S.confirming);
}
async function vote(n,decision){
  if(S.busy)return;S.busy=true;
  try{const d=await sessionApi({action:'vote',code:S.code,participantId:S.pid,round:n,decision});S.view=d.view;S.error=''}
  catch(e){S.error=e.message}
  finally{S.busy=false;S.confirming=null;S.shown='';render()}
}
function renderReveal(r,paused){
  const res=r.result,team=S.session.mode==='team';
  const mine=team&&r.myVote?`<small>${esc(CFG.copy.yourVotes)}: ${esc(outcomeWords(r.myVote))}</small>`:'';
  const head=team?`${esc(CFG.copy.teamDecision)}: ${esc(outcomeWords(res.decision))}`:esc(outcomeWords(res.decision));
  const k=res.changed.length;
  const change=`<p class="note">${esc(k===0?CFG.copy.revealUnchanged:k===1?CFG.copy.revealChangedOne:fill(CFG.copy.revealChangedMany,{n:k}))}</p>`;
  const cost=res.cost?`<div class="cost"><h3>${esc(CFG.copy.costHeading)}</h3><p>${esc(res.cost)}</p></div>`:'';
  app.innerHTML=`<div class="layout"><div class="lead">${paused}<div class="kicker">Round ${r.n} of 5 · ${esc(r.title)}</div>
  <p class="outcome">${head}${mine}</p><p class="body" style="margin-top:14px">${esc(r.request)}</p>${change}${cost}</div>${file(res.picture,res.changed,res.added)}</div>`;
}
function renderEnding(paused){
  const e=S.view.ending,team=S.session.mode==='team';
  const knows=e.knows.length?e.knows.map(k=>`<li><b>${esc(k.label)} · ${esc(CFG.copy.levelWords[k.level])}</b>${esc(k.text)}</li>`).join(''):`<li>${esc(CFG.copy.revealEmpty)}</li>`;
  const missing=e.missing.length?e.missing.map(m=>`<li>${esc(m)}</li>`).join(''):`<li>${esc(CFG.copy.endingMissingEmpty)}</li>`;
  const rows=e.decisions.map(d=>`<div><span class="n">${d.round}</span><span>${esc(d.title)}</span><span class="d">${esc(outcomeWords(d.decision))}</span><span class="mv">${team&&d.myVote?esc(CFG.copy.yourVotes)+': '+esc(outcomeWords(d.myVote)):''}</span></div>`).join('');
  app.innerHTML=`${paused}<div class="kicker">${esc(CFG.customer.name)}</div><h2>${esc(CFG.copy.endingHeading)}</h2>
  <div class="ending"><section><h3>${esc(CFG.copy.endingKnows)}</h3><ul>${knows}</ul></section><section><h3>${esc(CFG.copy.endingMissing)}</h3><ul>${missing}</ul></section></div>
  <div class="decisions"><h3 style="font:500 13px var(--mono);color:var(--amber);margin:18px 0 8px">${esc(team?CFG.copy.teamDecision+'s':CFG.copy.yourDecisions)}</h3>${rows}</div>`;
}

init();
</script>
</body>
</html>
