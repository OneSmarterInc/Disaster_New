<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Do We Switch?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{--n:#0E1524;--p:#161E2E;--p2:#1D2637;--l:#2B3548;--l2:#3A4659;--b:#E8E4DA;--d:#8C95A8;--dd:#616B7E;--a:#F0A63C;--g:#75A98C;--r:#CE7C8D;--x:#6FA8D6;--s:'Newsreader',Georgia,serif;--m:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--b);font-family:var(--s);line-height:1.55}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--l);background:rgba(14,21,36,.96)}
header h1{font-size:18px;font-weight:500;margin:0 auto 0 0}
.m{font:10px var(--m);letter-spacing:.13em;text-transform:uppercase;color:var(--dd)}
.ey{font:10px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--a);margin-bottom:8px}
.clock{font:600 20px var(--m);color:var(--b)}.tick{font:600 20px var(--m);color:var(--r)}
.page{width:min(1100px,calc(100% - 32px));margin:auto;padding:28px 0 80px}
.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:18px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--l);background:var(--p);padding:18px;margin-bottom:16px}
h2{font-size:30px;font-weight:400;line-height:1.15;margin:0 0 12px}h3{font-size:20px;font-weight:400;margin:4px 0 10px}
p{margin:0 0 12px}.muted{color:var(--d)}
.btn{border:1px solid var(--l2);padding:10px 14px;font:11px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--d)}
.btn:hover{border-color:var(--b);color:var(--b)}.pri{background:var(--a);border-color:var(--a);color:#191206;font-weight:600}
.btn:disabled{opacity:.35;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.field{margin-top:12px}.field label{display:block;font:10px var(--m);letter-spacing:.11em;text-transform:uppercase;color:var(--dd);margin-bottom:6px}
.field input,textarea{width:100%;background:var(--n);border:1px solid var(--l2);padding:10px}
textarea{min-height:70px;resize:vertical}
.rep{border-left:2px solid var(--l2);padding:8px 0 8px 12px;margin-bottom:10px}.rep.new{border-left-color:var(--a);animation:f 1.2s}
@keyframes f{from{background:rgba(240,166,60,.12)}to{background:transparent}}
.rep .src{font:10px var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--dd)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{border:1px solid var(--l2);padding:14px;text-align:left;background:var(--p2)}
.choice button:hover{border-color:var(--a)}.choice b{display:block;font-weight:500;font-size:17px}.choice span{font-size:13px;color:var(--d)}
.notice{border-left:2px solid var(--a);background:rgba(240,166,60,.06);padding:10px 13px;margin:10px 0;color:#cbc8c0}
.bad{border-left-color:var(--r);color:#e1afba}
.modal{position:fixed;inset:0;z-index:20;background:rgba(6,10,18,.8);display:grid;place-items:center;padding:16px}
.doc{width:min(720px,100%);max-height:88vh;overflow:auto;background:#F4F1EA;color:#1d1d1d;padding:26px 28px;font-family:Georgia,serif}
.doc h4{margin:14px 0 4px;font-size:15px}.doc .sub{font-style:italic;color:#555;margin-bottom:12px}
.doc p{font-size:15px}.doc mark{background:#F6D38E}
.close{float:right;font:11px var(--m);letter-spacing:.1em;text-transform:uppercase;color:#555}
svg text{font-family:var(--m)}
@media(max-width:560px){.choice{grid-template-columns:1fr}.doc{padding:20px 18px}header{padding:10px 14px}}
.steps{display:flex;gap:6px;margin:0 0 14px}.steps i{flex:1;height:3px;background:var(--l2)}.steps i.on{background:var(--a)}
.wt p{font-size:18px}.left{font:10px var(--m);letter-spacing:.1em;color:var(--d)}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:7px 0}.kv b{font:600 16px var(--m);color:var(--a)}
</style>
</head>
<body>
<header><h1>Do We Switch?</h1><span class="m" id="phase"></span><span class="clock" id="clock"></span><span class="left" id="left"></span><span class="tick" id="tick"></span></header>
<main class="page" id="app"><p class="muted">Loading…</p></main>
<div id="modal"></div>
<script>
const BASE=(location.pathname.match(/^\/sim-?\d+/)||[''])[0];
const app=document.getElementById('app'),modal=document.getElementById('modal');
function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}
const hashLT=new URLSearchParams(location.hash.slice(1)).get('lt');
if(hashLT){sessionStorage.setItem('m06-lt',hashLT);history.replaceState(null,'',location.pathname+location.search)}
const LT=sessionStorage.getItem('m06-lt')||null;
const ACCESS=sessionStorage.getItem('m06-access')||'';
function tokenInfo(t){try{return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))))}catch{return null}}
const launch=LT?tokenInfo(LT):null;
let CODE=(new URLSearchParams(location.search).get('session')||'').toUpperCase();
let CFG=null,PID=null,state=null,seen=0,pending=null,revealed=null,poll=null,err='',sig='',offset=0,peekMode='';
let wtStep=0;
const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');
function headers(){const h={'Content-Type':'application/json'};if(LT)h['x-launch-token']=LT;else if(ACCESS)h['x-access-code']=ACCESS;return h}
async function api(action,extra={}){
  const r=await fetch(BASE+'/api/session',{method:'POST',headers:headers(),body:JSON.stringify({action,code:CODE,participantId:PID,launchToken:LT,...extra})});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok){const e=new Error(d.message||d.error||'Request failed');e.data=d;e.status=r.status;throw e}
  return d;
}
const pidKey=()=>'m06-pid-'+CODE, wtKey=()=>'m06-wt-'+CODE;
const wtDone=()=>localStorage.getItem(wtKey())==='1';
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.innerHTML){if(pending){pending=null;sig=''}modal.innerHTML='';refresh()}});

async function boot(){
  const r=await fetch(BASE+'/api/config',{headers:headers()});
  if(!r.ok){location.replace(BASE+'/launch.html'+location.search);return}
  CFG=await r.json();
  PID=localStorage.getItem(pidKey());
  if(CODE&&(PID||launch))return join();
  renderEntry();
}
const JOIN_ERR={session_ended:'The clock for this session has already ended.',team_name_required:'This is a team session. Enter your team name.',name_required:'Enter your name.',no_such_session:'No session with that code. Check it with your instructor.',session_closed:'That session is closed to new students.',invalid_session_code:'A session code is five letters and numbers.'};
function renderEntry(){
  const platform=!!launch;
  app.innerHTML=`<div class="card" style="max-width:560px"><div class="ey">Join your class session</div><h2>${esc(CFG.sim.title)}</h2>
  <p class="muted">${esc(CFG.sim.cardLine)}</p>
  <div class="field"><label for="code">Session code</label><input id="code" value="${esc(CODE)}" maxlength="5" autocomplete="off" autocapitalize="characters"></div>
  ${platform?'':'<div class="field"><label for="nm">Your name</label><input id="nm" maxlength="60" autocomplete="name"></div>'}
  <div class="field" id="teamf" ${peekMode==='team'?'':'hidden'}><label for="team">Team name</label><input id="team" maxlength="40"><p class="muted" style="font-size:14px;margin-top:6px">Everyone on your team types the same name.</p></div>
  <div class="row"><button class="btn pri" id="go">Join</button></div><div id="joinerr">${err?`<div class="notice bad">${esc(err)}</div>`:''}</div></div>`;
  const codeEl=document.getElementById('code');
  const peek=async()=>{const c=codeEl.value.trim().toUpperCase();if(!/^[A-Z2-9]{5}$/.test(c))return;CODE=c;try{const d=await api('peek');peekMode=d.mode;document.getElementById('teamf').hidden=d.mode!=='team'}catch{}};
  codeEl.addEventListener('input',peek);codeEl.addEventListener('blur',peek);if(CODE)peek();
  document.getElementById('go').onclick=async()=>{CODE=codeEl.value.trim().toUpperCase();PID=localStorage.getItem(pidKey());await join({name:document.getElementById('nm')?.value,teamName:document.getElementById('team').value})};
}
async function join(extra={}){
  try{
    const d=await api('join',{name:extra.name,teamName:extra.teamName});
    PID=d.participantId;localStorage.setItem(pidKey(),PID);err='';
    await refresh();clearInterval(poll);poll=setInterval(refresh,1500);
  }catch(e){
    err=JOIN_ERR[e.data?.error]||e.message;
    if(e.data?.error==='team_name_required')peekMode='team';
    renderEntry();
  }
}
// Local one-second clock between polls, anchored to the server's time.
setInterval(()=>{if(!state)return;const s=state.session;if(!s.startedAt||s.phase!=='playing')return;
  const left=Math.max(0,s.playMs-(Date.now()+offset-s.startedAt));
  document.getElementById('left').textContent=`${Math.floor(left/60000)}:${String(Math.floor(left%60000/1000)).padStart(2,'0')} left`;},1000);
async function refresh(){
  if(pending)return; // never repaint under someone typing a reason
  try{state=await api('state')}catch(e){if(e.status===403){localStorage.removeItem(pidKey());PID=null;clearInterval(poll);renderEntry()}return}
  const s=state.session,v=state.view;offset=s.serverNow-Date.now();
  document.getElementById('phase').textContent=s.phase==='lobby'?'Briefing':s.phase==='playing'?'Live':'Ended';
  document.getElementById('clock').textContent=s.phase==='lobby'?'':v.storyTime;
  document.getElementById('tick').textContent=s.phase==='lobby'?'':'Card sales lost '+fmt(v.lost);
  if(s.phase!=='playing')document.getElementById('left').textContent='';
  if(s.phase==='ended'){clearInterval(poll);return showReveal()}
  // Repaint only when something the student can see has changed.
  const next=[s.phase,v.reports.length,v.decision?.choice||'',v.status?.kind||'',state.me.mates,wtDone(),wtStep].join('|');
  if(next===sig)return;sig=next;render();
}
function docButtons(){return CFG.documents.map(d=>`<button class="btn" data-doc="${esc(d.id)}">${esc(d.title)}</button>`).join('')}
function wireDocs(){app.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.doc))}
function docHtml(d,highlight){return `<h3 style="margin:0">${esc(d.title)}</h3><div class="sub">${esc(d.subtitle)}</div>`+d.blocks.map(bl=>`${bl.heading?`<h4>${esc(bl.heading)}</h4>`:''}<p>${highlight&&bl.revealHighlight?`<mark>${esc(bl.text)}</mark>`:esc(bl.text)}</p>`).join('')}
function openDoc(id,docs=CFG.documents,highlight=false){
  const d=docs.find(x=>x.id===id);if(!d)return;
  modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="doc"><button class="close" id="cx">Close</button>${docHtml(d,highlight)}</div></div>`;
  const cx=document.getElementById('cx');cx.onclick=()=>modal.innerHTML='';cx.focus();
  if(!highlight)api('open_doc',{docId:id}).catch(()=>{});
}
function renderWalkthrough(){
  const W=CFG.walkthrough,w=W[wtStep],team=state.session.mode==='team';
  const live=state.session.phase==='playing'?'<div class="notice">The clock has started and reports are arriving. You can skip ahead.</div>':'';
  app.innerHTML=`<div class="card wt" style="max-width:680px">${live}<div class="steps">${W.map((_,i)=>`<i class="${i<=wtStep?'on':''}"></i>`).join('')}</div>
  <div class="ey">${wtStep+1} of ${W.length}</div><h2>${esc(w.title)}</h2>${w.text.map(t=>`<p>${esc(t)}</p>`).join('')}
  ${team&&w.teamNote?`<div class="notice">${esc(w.teamNote)}</div>`:''}
  <div class="row">${wtStep>0?'<button class="btn" id="back">Back</button>':''}<button class="btn pri" id="next">${wtStep<W.length-1?'Next':'Go to the briefing'}</button>${wtStep<W.length-1?'<button class="btn" id="skip">Skip</button>':''}</div></div>`;
  const done=()=>{localStorage.setItem(wtKey(),'1');sig='';refresh()};
  document.getElementById('next').onclick=()=>{if(wtStep<W.length-1){wtStep++;sig='';render()}else done()};
  const b=document.getElementById('back');if(b)b.onclick=()=>{wtStep--;sig='';render()};
  const k=document.getElementById('skip');if(k)k.onclick=done;
}
function render(){
  const s=state.session,v=state.view,me=state.me;
  if(!wtDone())return renderWalkthrough();
  const who=me.team?`<p class="m">Team ${esc(me.team)} · ${me.mates} joined</p>`:'';
  if(s.phase==='lobby'){
    app.innerHTML=`<div class="grid"><div><div class="card"><div class="ey">Briefing</div>${CFG.briefing.map(p=>`<p>${esc(p)}</p>`).join('')}${who}</div></div>
    <div><div class="card"><div class="ey">Documents</div><p class="muted">Open both now. You can open them again during play.</p><div class="row">${docButtons()}</div></div>
    <div class="notice">Waiting for your instructor to start the clock. Every report arrives at the same moment for the whole room.</div>
    <div class="row"><button class="btn" id="rewt">See the introduction again</button></div></div></div>`;
    document.getElementById('rewt').onclick=()=>{localStorage.removeItem(wtKey());wtStep=0;sig='';render()};
    return wireDocs();
  }
  const fresh=v.reports.length>seen;seen=v.reports.length;
  const reps=[...v.reports].reverse().map((r,i)=>`<div class="rep ${i===0&&fresh?'new':''}"><div class="src">Report ${r.n} of 12 · ${esc(r.source)}</div>${esc(r.text)}</div>`).join('');
  let panel;
  if(v.decision){
    const what=v.decision.choice==='switch'?'switched to ClearPath':'committed to staying on Northline';
    const by=v.decision.by?` (${esc(v.decision.by)} pressed)`:'';
    const st=v.status?.kind==='switching'?'<div class="notice">Terminals are re-registering. No store can take a card until this finishes.</div>':v.status?.text?`<div class="notice">${esc(v.status.text)}</div>`:'';
    panel=`<div class="card"><div class="ey">${me.team?'Your team\'s decision':'Your decision'}</div><p>${me.team?'Your team':'You'} ${what} at report ${v.decision.atReport}${by}. It cannot be undone.</p>${st}<p class="muted">Reports keep arriving until the clock ends.</p></div>`;
  }else{
    panel=`<div class="card"><div class="ey">Decide</div><div class="choice">
      <button data-c="switch"><b>Switch to ClearPath</b><span>Every store moves to the backup. No card payments for about eight minutes while terminals re-register.</span></button>
      <button data-c="stay"><b>Stay on Northline</b><span>Commit to the provider Harlow uses now.</span></button></div>
      <p class="muted" style="margin-top:10px">You can press one, once. If you press neither before the clock ends, that is recorded as no decision.${me.team?' The first press on your team decides for everyone.':''}</p></div>`;
  }
  app.innerHTML=`<div class="grid"><div><div class="card"><div class="ey">Reports</div>${reps}</div></div>
  <div>${panel}<div class="card"><div class="ey">Documents</div><div class="row">${docButtons()}</div></div>
  <div class="card"><div class="ey">Briefing</div>${CFG.briefing.map(p=>`<p class="muted">${esc(p)}</p>`).join('')}${who}</div></div></div>`;
  wireDocs();
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>askReason(b.dataset.c));
}
function askReason(choice){
  pending=choice;
  const label=choice==='switch'?'Switch to ClearPath':'Stay on Northline';
  const cost=choice==='switch'?'No store can take a card for about eight minutes. ':'';
  modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="card" style="width:min(520px,100%)"><div class="ey">${label}</div>
  <p>In one line, why?</p><textarea id="why" maxlength="${CFG.reasonMaxLength}" aria-label="Your reason"></textarea><div class="m" id="cnt">0 / ${CFG.reasonMaxLength}</div>
  <p class="muted" style="margin-top:10px">${cost}You cannot undo this.</p>
  <div class="row"><button class="btn pri" id="ok">${label}</button><button class="btn" id="no">Not yet</button></div><div id="me"></div></div></div>`;
  const ta=document.getElementById('why');ta.focus();
  ta.oninput=()=>document.getElementById('cnt').textContent=`${ta.value.length} / ${CFG.reasonMaxLength}`;
  document.getElementById('no').onclick=()=>{pending=null;modal.innerHTML='';sig='';refresh()};
  document.getElementById('ok').onclick=async()=>{
    const reason=ta.value.trim();if(!reason){document.getElementById('me').innerHTML='<div class="notice bad">Write one line saying why.</div>';return}
    document.getElementById('ok').disabled=true;
    try{await api('decide',{choice,reason})}
    catch(e){
      const done=e.data?.error==='decision_already_made'||/clock has ended/.test(e.data?.message||'');
      if(!done){document.getElementById('ok').disabled=false;document.getElementById('me').innerHTML=`<div class="notice bad">${esc(e.data?.message||e.message)}</div>`;return}
    }
    pending=null;modal.innerHTML='';sig='';refresh();
  };
}
function mapSvg(map){
  const pos={stores:[260,34],northline:[135,124],clearpath:[385,124],meridian:[260,214],processor:[260,304]};
  const W=230,H=38;
  const edges=map.edges.map(([a,b])=>`<line x1="${pos[a][0]}" y1="${pos[a][1]+H/2}" x2="${pos[b][0]}" y2="${pos[b][1]-H/2}" stroke="#3A4659" stroke-width="2"/>`).join('');
  const nodes=map.nodes.map(n=>{const [x,y]=pos[n.id];const f=n.fault;return `<g><rect x="${x-W/2}" y="${y-H/2}" width="${W}" height="${H}" rx="2" fill="${f?'rgba(206,124,141,.15)':'#1D2637'}" stroke="${f?'#CE7C8D':'#3A4659'}" stroke-width="${f?2:1}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" fill="${f?'#E3B9C2':'#E8E4DA'}">${esc(n.label)}</text></g>`}).join('');
  return `<svg viewBox="0 0 520 330" role="img" aria-label="Both providers connect to Meridian Transit, where the fault was" style="width:100%;display:block">${edges}${nodes}</svg>`;
}
async function showReveal(){
  if(!revealed){try{revealed=(await api('reveal')).reveal}catch(e){app.innerHTML=`<div class="notice bad">${esc(e.message)}</div>`;return}}
  const r=revealed;
  const reading=CFG.documents.map(d=>`<div class="kv"><span>${esc(d.title)}</span><b>${r.reading[d.id]?'Yes':'No'}</b></div>`).join('');
  const win=r.switchWindow?`<p class="muted">This includes ${esc(r.switchWindow.fromStory)} to ${esc(r.switchWindow.toStory)}, while terminals re-registered and no store could take a card.</p>`:'';
  app.innerHTML=`<div class="grid"><div><div class="card"><div class="ey">What was underneath</div>${mapSvg(r.map)}<p class="notice">${esc(r.map.faultNote)}</p><p>${esc(r.caption)}</p></div></div>
  <div><div class="card"><div class="ey">Your decision</div><p>${esc(r.decisionLine)}</p></div>
  <div class="card"><div class="ey">${esc(r.readingLabel)}</div>${reading}</div>
  <div class="card"><div class="ey">Card sales lost by 12:05</div><h2>${fmt(r.lostTotal)}</h2>${win}</div>
  <div class="card"><div class="ey">The documents again</div><p class="muted">The lines about Meridian are marked.</p><div class="row">${r.documents.map(d=>`<button class="btn" data-rdoc="${esc(d.id)}">${esc(d.title)}</button>`).join('')}</div></div></div></div>`;
  app.querySelectorAll('[data-rdoc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.rdoc,r.documents,true));
}
boot();
</script>
</body>
</html>
